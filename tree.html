<!DOCTYPE html>

<html>
 <head>
  <meta charset="UTF-8" />
  <title>OrgChart</title>
  <link rel="shortcut icon" type="image/x-icon" href="misc/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 </head>

 <body>
  <!----------------   ORG CHART NON ESSENTIAL CONTENT ------------>
  <script src="build/vendor/html2canvas.js"></script>
  <script src="build/vendor/jspdf.umd.min.js"></script>
  <link href="build/simptip.min.css" rel="stylesheet" />

  <style>
   [data-tooltip]:focus:after {
    display: none;
    border-bottom-color: none !important;
   }

   [data-tooltip]:focus:before {
    display: none;
    border-bottom-color: none !important;
   }

   [data-tooltip]:after {
    height: auto !important;
    padding: 11px 11px 11px 11px !important;
    content: attr(data-tooltip);
    white-space: pre;
    line-height: 16px !important;
    text-align: left !important;
   }
  </style>

  <link href="build/app.css" rel="stylesheet" />

  <div class="toolbar">
   <div class="toolbar__brand">
    <i class="fas fa-sitemap"></i>
    Organograma
   </div>

   <label class="file-upload">
    <span class="file-upload__label">
     <i class="fas fa-file-csv"></i>
     Carregar CSV
    </span>
    <input
     type="file"
     id="csv-input"
     accept=".csv,text/csv,.json,application/json"
     title="Selecione um arquivo CSV ou JSON"
    />
   </label>

   <a
    class="btn file-upload__label"
    href="misc/modelo-organograma.csv"
    download="modelo-organograma.csv"
    title="Baixar modelo de CSV/JSON"
   >
    <i class="fas fa-download"></i> Modelo
   </a>

   <button class="btn" onclick="downloadCsv()" title="Exportar o organograma como CSV">
    <i class="fas fa-file-export"></i> Exportar CSV
   </button>
   <button class="btn" onclick="downloadJson()" title="Exportar o organograma como JSON">
    <i class="fas fa-file-code"></i> Exportar JSON
   </button>

   <label class="theme-picker">
    <i class="fas fa-palette"></i>
    <select id="theme-select" title="Design (bumbeishvili/org-chart)"></select>
   </label>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button class="btn" onclick="chartFit()" title="Ajustar à tela">
     <i class="fas fa-expand"></i> Fit
    </button>
    <button class="btn" onclick="toggleFullscreen()" title="Tela cheia">
     <i class="fas fa-arrows-alt"></i> Full
    </button>
    <button
     class="btn"
     onclick="cycleLayout()"
     title="Trocar layout"
    >
     <i class="fas fa-exchange-alt"></i> Layout
    </button>
   </div>

   <div class="toolbar__group">
    <button class="btn" onclick="safeCall('expandAll', 'Expandir tudo')" title="Expandir tudo">
     <i class="fas fa-plus-circle"></i> Expand All
    </button>
    <button class="btn" onclick="safeCall('collapseAll', 'Recolher tudo')" title="Recolher tudo">
     <i class="fas fa-minus-circle"></i> Collapse All
    </button>
   </div>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button
     class="btn"
     onclick="safeExportImg(false)"
     title="Exportar PNG do que está visível"
    >
     <i class="fas fa-image"></i> PNG
    </button>
    <button
     class="btn"
     onclick="safeExportImg(true)"
     title="Exportar PNG do grafo completo"
    >
     <i class="far fa-images"></i> PNG Full
    </button>
    <button class="btn" onclick="safeExportSvg()" title="Exportar SVG">
     <i class="fas fa-code"></i> SVG
    </button>
    <button class="btn" onclick="downloadPdf()" title="Exportar PDF">
     <i class="fas fa-file-pdf"></i> PDF
    </button>
   </div>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button class="btn" onclick="centerFocusNode()" title="Centralizar nó">
     <i class="fas fa-crosshairs"></i> Center
    </button>
    <button class="btn" onclick="highlightFocusNode()" title="Destacar nó">
     <i class="fas fa-highlighter"></i> Highlight
    </button>
    <button
     class="btn"
     onclick="highlightPathToRoot()"
     title="Destacar caminho até a raiz"
    >
     <i class="fas fa-arrow-up"></i> To Root
    </button>
    <button
     class="btn"
     onclick="clearHighlighting()"
     title="Limpar destaques"
    >
     <i class="fas fa-eraser"></i> Clear
    </button>
    <button class="btn" onclick="undoLast()" title="Desfazer a última alteração">
     <i class="fas fa-undo"></i> Undo
    </button>
   </div>

   <div class="toolbar__group">
    <button class="btn btn--primary" onclick="addSampleNode()" title="Adicionar um subordinado ao card selecionado">
     <i class="fas fa-user-plus"></i> Add Node
    </button>
    <button
     class="btn"
     onclick="abrirEditor()"
     title="Editar o card selecionado (ou dê duplo clique no card)"
    >
     <i class="fas fa-pen"></i> Editar
    </button>
    <button
     class="btn btn--danger"
     onclick="removeSampleNode()"
     title="Remover o card selecionado e todos os subordinados dele"
    >
     <i class="fas fa-user-minus"></i> Remove
    </button>
   </div>

   <button
    class="btn btn--danger"
    id="btn-descartar"
    onclick="descartarLocal()"
    title="Descartar as alterações salvas neste navegador e voltar ao organograma original"
    hidden
   >
    <i class="fas fa-undo"></i> Descartar alterações
   </button>
  </div>

  <div class="modal" id="editor" hidden>
   <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="editor-titulo">
    <div class="modal__head">
     <h2 id="editor-titulo">Editar colaborador</h2>
     <button class="modal__x" onclick="fecharEditor()" title="Fechar" aria-label="Fechar">
      <i class="fas fa-times"></i>
     </button>
    </div>

    <div class="modal__body">
     <div class="campo-foto">
      <img id="ed-preview" alt="Foto do colaborador" />
      <div class="campo-foto__acoes">
       <label class="btn btn--primary" style="cursor:pointer">
        <i class="fas fa-upload"></i> Enviar foto
        <input type="file" id="ed-arquivo" accept="image/*" hidden />
       </label>
       <button class="btn" type="button" onclick="limparFoto()">
        <i class="fas fa-trash"></i> Remover foto
       </button>
      </div>
     </div>

     <label class="campo campo--largo">
      <span>URL da foto</span>
      <input type="text" id="ed-image" placeholder="https://… (ou use Enviar foto)" />
     </label>

     <label class="campo">
      <span>Nome <b>*</b></span>
      <input type="text" id="ed-name" />
     </label>

     <label class="campo">
      <span>Sobrenome</span>
      <input type="text" id="ed-lastName" />
     </label>

     <label class="campo campo--largo">
      <span>Cargo <b>*</b></span>
      <input type="text" id="ed-position" />
     </label>

     <label class="campo">
      <span>E-mail</span>
      <input type="text" id="ed-email" />
     </label>

     <label class="campo">
      <span>Departamento</span>
      <input type="text" id="ed-department_name" />
     </label>

     <label class="campo campo--largo">
      <span>Responde a</span>
      <select id="ed-parentId"></select>
     </label>
    </div>

    <div class="modal__pe">
     <span class="modal__erro" id="ed-erro"></span>
     <button class="btn" onclick="fecharEditor()">Cancelar</button>
     <button class="btn btn--primary" onclick="salvarEditor()">
      <i class="fas fa-check"></i> Salvar
     </button>
    </div>
   </div>
  </div>

  <div class="status-bar">
   <span class="status-bar__dot"></span>
   <span id="status-msg">Carregando…</span>
  </div>

  <div class="chart-wrapper">
   <div class="chart-container"></div>
  </div>

  <div class="drop-overlay" id="drop-overlay">
   <div class="drop-overlay__content">
    <i class="fas fa-cloud-upload-alt"></i>
    Solte o arquivo CSV aqui
   </div>
  </div>

  <!----------------  ORG CHART ESSENTIAL CONTENT ---------------->

  <script src="build/d3.v7.min.js"></script>
  <script src="build/d3-org-chart.js"></script>
  <script src="build/d3-flextree.js"></script>

  <script>
   // ---------------------------------------------------------------------
   // Os 5 designs abaixo são portes dos exemplos de github.com/bumbeishvili/
   // org-chart, adaptados para as colunas de misc/data.csv.
   //
   // Os designs "Futuristic" e "Prev version" foram removidos: ambos exibiam
   // dados que não existem no CSV — barras de progresso e percentuais
   // gerados por Math.random(), largura/altura de card aleatórias e um texto
   // institucional fixo em inglês. Num organograma de RH isso é dado falso
   // apresentado como se fosse informação da pessoa.
   // ---------------------------------------------------------------------

   var index = 0;
   var chart;
   var currentDesign = "default";
   var currentData = [];
   var selectedNodeId = null;
   var undoStack = [];

   var designs = [
    {
     id: "default",
     label: "Default",
     background: "white",
     // Porte do próprio tree.html do repositório (o nodeContent está lá
     // comentado, junto da configuração ativa de nodeWidth/nodeHeight e do
     // override de layoutBindings). Sem ele, a lib cai no nodeContent padrão,
     // que é só o placeholder "Sample Node(id=…), override using…".
     apply: (c) => {
      c.nodeHeight((d) => 85 + 25)
       .nodeWidth((d) => {
        return 220 + 2;
       })
       .childrenMargin((d) => 50)
       .compactMarginBetween((d) => 35)
       .compactMarginPair((d) => 30)
       .neighbourMargin((a, b) => 20)
       .nodeContent(function (d, i, arr, state) {
        const color = "#FFFFFF";
        const imageDiffVert = 25 + 2;
        return `
                <div style='width:${d.width}px;height:${
         d.height
        }px;padding-top:${
         imageDiffVert - 2
        }px;padding-left:1px;padding-right:1px'>
                    <div style="font-family: 'Inter', sans-serif;background-color:${color};  margin-left:-1px;width:${
         d.width - 2
        }px;height:${
         d.height - imageDiffVert
        }px;border-radius:10px;border: 1px solid #E4E2E9">
                        <div style="display:flex;justify-content:flex-end;margin-top:5px;margin-right:5px">#${
                         d.data.id
                        }</div>
                        <div style="background-color:${color};margin-top:${
         -imageDiffVert - 20
        }px;margin-left:${15}px;border-radius:100px;width:50px;height:50px;" ></div>
                        <div style="margin-top:${
                         -imageDiffVert - 20
                        }px;">   <img src=" ${
         d.data.image
        }" style="margin-left:${20}px;border-radius:100px;width:40px;height:40px;" /></div>
                        <div style="font-size:15px;color:#08011E;margin-left:20px;margin-top:10px">  ${
                         d.data.name
                        } </div>
                        <div style="color:#716E7B;margin-left:20px;margin-top:3px;font-size:10px;"> ${
                         d.data.position
                        } </div>

                    </div>
                </div>
                        `;
       });

      c.layoutBindings(
       (() => {
        const layouts = c.layoutBindings();
        layouts.top.linkY = (node) => node.y + 0;
        layouts.top.linkCompactYStart = (node) => node.y + node.height / 2 + 15;
        return layouts;
       })()
      );
      return c;
     }
    },

    {
     id: "sky",
     label: "Sky",
     background: "#f6f6f6",
     apply: (c) =>
      c
       .nodeWidth((d) => 250)
       .initialZoom(0.7)
       .nodeHeight((d) => 175)
       .childrenMargin((d) => 40)
       .compactMarginBetween((d) => 15)
       .compactMarginPair((d) => 80)
       .nodeContent(function (d, i, arr, state) {
        return `
            <div style="padding-top:30px;background-color:none;margin-left:1px;height:${
             d.height
            }px;border-radius:2px;overflow:visible">
              <div style="height:${
               d.height - 32
              }px;padding-top:0px;background-color:white;border:1px solid lightgray;">

                <img src=" ${
                 d.data.imageUrl
                }" style="margin-top:-30px;margin-left:${
         d.width / 2 - 30
        }px;border-radius:100px;width:60px;height:60px;" />

               <div style="margin-right:10px;margin-top:15px;float:right">${
                d.data.id
               }</div>

               <div style="margin-top:-30px;background-color:#3AB6E3;height:10px;width:${
                d.width - 2
               }px;border-radius:1px"></div>

               <div style="padding:20px; padding-top:35px;text-align:center">
                   <div style="color:#111672;font-size:16px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"> ${
                    d.data.name
                   } </div>
                   <div style="color:#404040;font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"> ${
                    d.data.positionName
                   } </div>
               </div>
               <div style="display:flex;justify-content:space-between;padding-left:15px;padding-right:15px;">
                 <div > Manages:  ${d.data._directSubordinates} 👤</div>
                 <div > Oversees: ${d.data._totalSubordinates} 👤</div>
               </div>
              </div>
      </div>
  `;
       })
    },

    {
     id: "circles",
     label: "Circles",
     background: "#fffeff",
     apply: (c) =>
      c
       .rootMargin(100)
       .nodeWidth((d) => 210)
       .nodeHeight((d) => 140)
       .childrenMargin((d) => 130)
       .compactMarginBetween((d) => 75)
       .compactMarginPair((d) => 80)
       .linkUpdate(function (d, i, arr) {
        d3.select(this)
         .attr("stroke", (d) =>
          d.data._upToTheRootHighlighted ? "#152785" : "lightgray"
         )
         .attr("stroke-width", (d) =>
          d.data._upToTheRootHighlighted ? 5 : 1.5
         )
         .attr("stroke-dasharray", "4,4");

        if (d.data._upToTheRootHighlighted) {
         d3.select(this).raise();
        }
       })
       .nodeContent(function (d, i, arr, state) {
        const colors = [
         "#6E6B6F",
         "#18A8B6",
         "#F45754",
         "#96C62C",
         "#BD7E16",
         "#802F74"
        ];
        const color = colors[d.depth % colors.length];
        const imageDim = 80;
        const lightCircleDim = 95;
        const outsideCircleDim = 110;

        return `
                <div style="background-color:white; position:absolute;width:${
                 d.width
                }px;height:${d.height}px;">
                   <div style="background-color:${color};position:absolute;margin-top:-${
         outsideCircleDim / 2
        }px;margin-left:${
         d.width / 2 - outsideCircleDim / 2
        }px;border-radius:100px;width:${outsideCircleDim}px;height:${outsideCircleDim}px;"></div>
                   <div style="background-color:#ffffff;position:absolute;margin-top:-${
                    lightCircleDim / 2
                   }px;margin-left:${
         d.width / 2 - lightCircleDim / 2
        }px;border-radius:100px;width:${lightCircleDim}px;height:${lightCircleDim}px;"></div>
                   <img src=" ${
                    d.data.imageUrl
                   }" style="position:absolute;margin-top:-${
         imageDim / 2
        }px;margin-left:${
         d.width / 2 - imageDim / 2
        }px;border-radius:100px;width:${imageDim}px;height:${imageDim}px;" />
                   <div class="card" style="top:${
                    outsideCircleDim / 2 + 10
                   }px;position:absolute;height:30px;width:${
         d.width
        }px;background-color:#3AB6E3;">
                      <div style="background-color:${color};height:28px;text-align:center;padding-top:10px;color:#ffffff;font-weight:bold;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                          ${d.data.name}
                      </div>
                      <div style="background-color:#F0EDEF;height:28px;text-align:center;padding-top:10px;color:#424142;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                          ${d.data.positionName}
                      </div>
                   </div>
               </div>
  `;
       })
    },

    {
     id: "oval",
     label: "Oval",
     background: "#fffeff",
     apply: (c) =>
      c
       .nodeHeight((d) => 70)
       .nodeWidth((d) => {
        if (d.depth == 0) return 250;
        if (d.depth == 1) return 220;
        return 140;
       })
       .childrenMargin((d) => 50)
       .compactMarginBetween((d) => 35)
       .compactMarginPair((d) => 30)
       .neighbourMargin((a, b) => 20)
       .buttonContent(({ node, state }) => {
        return `<div style="border-radius:3px;padding:3px;font-size:10px;margin:auto auto;background-color:lightgray"> <span style="font-size:9px">${
         node.children
          ? `<i class="fas fa-chevron-up"></i>`
          : `<i class="fas fa-chevron-down"></i>`
        }</span> ${node.data._directSubordinates}  </div>`;
       })
       .nodeContent(function (d, i, arr, state) {
        const colors = ["#278B8D", "#404040", "#0C5C73", "#33C6CB"];
        const color = colors[d.depth % colors.length];
        return `
            <div style="background-color:${color}; position:absolute;margin-top:-1px; margin-left:-1px;width:${
         d.width
        }px;height:${d.height}px;border-radius:50px">
               <img src=" ${
                d.data.imageUrl
               }" style="position:absolute;margin-top:5px;margin-left:${5}px;border-radius:100px;width:60px;height:60px;" />
               <div style="position:absolute;top:-15px;width:${
                d.width
               }px;text-align:center;color:#fafafa;">
                     <div style="margin:0 auto;background-color:${color};display:inline-block;padding:8px;padding-bottom:0px;border-radius:5px"> ${
         d.data.id
        }</div>
              </div>

              <div style="color:#fafafa;font-size:${
               d.depth < 2 ? 16 : 12
              }px;font-weight:bold;margin-left:70px;margin-right:20px;margin-top:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"> ${
         d.depth < 2
          ? d.data.name
          : (d.data.name || "").trim().split(/\s+/g)[0]
        } </div>
              <div style="color:#fafafa;margin-left:70px;margin-right:20px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"> ${
               d.depth < 2 ? d.data.positionName : d.data.area
              } </div>
           </div>
  `;
       })
    },

    {
     id: "clean",
     label: "Clean",
     background: "#fffeff",
     apply: (c) =>
      c
       .nodeHeight((d) => 85)
       .nodeWidth((d) => {
        return 220;
       })
       .childrenMargin((d) => 50)
       .compactMarginBetween((d) => 25)
       .compactMarginPair((d) => 50)
       .neighbourMargin((a, b) => 25)
       .siblingsMargin((d) => 25)
       .buttonContent(({ node, state }) => {
        return `<div style="px;color:#716E7B;border-radius:5px;padding:4px;font-size:10px;margin:auto auto;background-color:white;border: 1px solid #E4E2E9"> <span style="font-size:9px">${
         node.children
          ? `<i class="fas fa-angle-up"></i>`
          : `<i class="fas fa-angle-down"></i>`
        }</span> ${node.data._directSubordinates}  </div>`;
       })
       .linkUpdate(function (d, i, arr) {
        d3.select(this)
         .attr("stroke", (d) =>
          d.data._upToTheRootHighlighted ? "#152785" : "#E4E2E9"
         )
         .attr("stroke-width", (d) => (d.data._upToTheRootHighlighted ? 5 : 1));

        if (d.data._upToTheRootHighlighted) {
         d3.select(this).raise();
        }
       })
       .nodeContent(function (d, i, arr, state) {
        const color = "#FFFFFF";
        return `
            <div style="font-family: 'Inter', sans-serif;background-color:${color}; position:absolute;margin-top:-1px; margin-left:-1px;width:${
         d.width
        }px;height:${d.height}px;border-radius:10px;border: 1px solid #E4E2E9">
               <div style="background-color:${color};position:absolute;margin-top:-25px;margin-left:${15}px;border-radius:100px;width:50px;height:50px;" ></div>
               <img src=" ${
                d.data.imageUrl
               }" style="position:absolute;margin-top:-20px;margin-left:${20}px;border-radius:100px;width:40px;height:40px;" />

              <div style="color:#08011E;position:absolute;right:20px;top:17px;font-size:10px;"><i class="fas fa-ellipsis-h"></i></div>

              <div style="font-size:15px;color:#08011E;margin-left:20px;margin-top:32px"> ${
               d.data.name
              } </div>
              <div style="color:#716E7B;margin-left:20px;margin-top:3px;font-size:10px;"> ${
               d.data.positionName
              } </div>


           </div>
  `;
       })
    },

   ];

   function buildDesignMenu() {
    const select = document.getElementById("theme-select");
    designs.forEach((design, i) => {
     const option = document.createElement("option");
     option.value = design.id;
     option.textContent = `${String(i + 1).padStart(2, "0")} · ${design.label}`;
     select.appendChild(option);
    });
    select.value = currentDesign;
   }

   function activeDesign() {
    return designs.find((item) => item.id === currentDesign) || designs[0];
   }

   // As colunas do misc/data.csv mapeadas para os nomes usados pelos
   // exemplos do repositório (que leem sample-data/org.csv).
   function toChartRow(row) {
    return Object.assign({}, row, {
     id: row.id,
     parentId: row.parentId,
     name: `${row.name || ""} ${row.lastName || ""}`.trim(),
     positionName: row.position || "",
     imageUrl: row.image || "",
     area: row.department_name || "",
     office: row.location_state || row.department_name || "",
     email: row.email || ""
    });
   }

   function chartHeight() {
    const el = document.querySelector(".chart-container");
    const rect = el ? el.getBoundingClientRect() : { height: 1100 };
    return Math.max(800, Math.round(rect.height || 1100));
   }

   function refreshChart() {
    if (!chart) return;
    chart.svgHeight(chartHeight()).render(); fitLegivel();
    setTimeout(afterRender, 100);
   }

   function attachEmailOverlay() {
    const nodes = document.querySelectorAll(".chart-container g.node");
    nodes.forEach((node) => {
     const inner = node.querySelector(".node-foreign-object-div");
     if (!inner || inner.querySelector(".orgchart-email-overlay")) return;
     const idMatch = (node.textContent || "").match(/#\s*(\d+)/);
     if (!idMatch) return;
     const nodeId = idMatch[1];
     const row = currentData.find((r) => String(r.id) === String(nodeId));
     if (!row) return;
     const overlay = document.createElement("div");
     overlay.className = "orgchart-email-overlay";
     overlay.textContent = row.email ? `✉ ${row.email}` : "✉ sem e-mail";
     overlay.style.position = "absolute";
     overlay.style.right = "6px";
     overlay.style.bottom = "6px";
     overlay.style.padding = "2px 6px";
     overlay.style.borderRadius = "10px";
     overlay.style.background = "rgba(15,23,42,.78)";
     overlay.style.color = "#fff";
     overlay.style.font = "9px 'Inter','Helvetica',sans-serif";
     overlay.style.pointerEvents = "none";
     overlay.style.maxWidth = "200px";
     overlay.style.overflow = "hidden";
     overlay.style.textOverflow = "ellipsis";
     overlay.style.whiteSpace = "nowrap";
     overlay.style.zIndex = "5";
     inner.style.position = "relative";
     inner.appendChild(overlay);
    });
   }

   // Desenha o contorno no card selecionado. Sem isso não há como saber em
   // quem as ações da toolbar vão agir.
   function applySelectionStyle() {
    document.querySelectorAll(".chart-container g.node").forEach((node) => {
     const inner = node.querySelector(".node-foreign-object-div");
     if (!inner) return;
     const id = nodeIdFromElement(node);
     const isSelected = id !== null && String(id) === String(selectedNodeId);
     inner.style.outline = isSelected ? "3px solid #1565C0" : "";
     inner.style.outlineOffset = isSelected ? "2px" : "";
     inner.style.borderRadius = isSelected ? "12px" : "";
    });
   }

   function nodeIdFromElement(node) {
    const datum = d3.select(node).datum();
    if (datum && datum.data && datum.data.id !== undefined) return datum.data.id;
    const match = (node.textContent || "").match(/#\s*([\w-]+)/);
    return match ? match[1] : null;
   }

   function selectNode(id) {
    selectedNodeId = id === null || id === undefined ? null : String(id);
    applySelectionStyle();
   }

   // Abaixo deste zoom o nome e o cargo no card viram borrão. Quando a árvore
   // é larga demais para caber inteira, é melhor cortar e deixar o usuário
   // navegar do que mostrar tudo ilegível.
   const ZOOM_MINIMO = 0.5;

   function fitLegivel(ancorarEm) {
    if (!chart) return;
    // O fit da lib encaixa a árvore inteira na tela. Com muitos irmãos isso
    // encolhe o card até o nome sumir, então ele só vale enquanto o resultado
    // continuar legível; abaixo disso enquadramos um nó e o usuário navega.
    chart.fit();
    setTimeout(() => {
     // `svg` e `zoomBehavior` entram no state depois do constructor, então não
     // ganham getter na instância — só dá para lê-los pelo state.
     const state = chart.getChartState();
     if (!state.svg || !state.zoomBehavior || !state.allNodes) return;
     if (state.lastTransform && state.lastTransform.k >= ZOOM_MINIMO) return;

     const alvo =
      state.allNodes.find((n) => String(n.data.id) === String(ancorarEm)) ||
      state.allNodes.find((n) => String(n.data.id) === String(rootId()));
     if (!alvo) return;

     // Depois do fit o center-group está zerado, então as coordenadas do nó
     // já estão no mesmo espaço em que o zoom é aplicado.
     const k = ZOOM_MINIMO;
     const x = state.svgWidth / 2 - alvo.x * k;
     const y = 60 - alvo.y * k;
     state.svg
      .transition()
      .duration(400)
      .call(state.zoomBehavior.transform, d3.zoomIdentity.translate(x, y).scale(k));
    }, 550);
   }

   function afterRender() {
    requestAnimationFrame(() => {
     attachEmailOverlay();
     applySelectionStyle();
    });
   }

   function renderDesign() {
    const design = activeDesign();
    const container = document.querySelector(".chart-container");
    container.innerHTML = "";
    container.style.backgroundColor = design.background;

    let rows = currentData.map(toChartRow);
    if (design.prepare) rows = design.prepare(rows);

    chart = new d3.OrgChart()
     .container(".chart-container")
     .svgHeight(chartHeight())
     .data(rows)
     // Um organograma mostra a equipe inteira. Esconder subordinados atrás de
     // um "Show next N nodes" faz o gestor parecer ter menos gente do que tem.
     .minPagingVisibleNodes((d) => Number.MAX_SAFE_INTEGER)
     .pagingStep((d) => Number.MAX_SAFE_INTEGER)
     .onNodeClick((d) => {
      selectNode(d.data.id);
      setStatus(`Selecionado: ${nodeLabel(d.data.id)}`);
     })
     .onExpandOrCollapse(() => {
      requestAnimationFrame(() => {
       fitLegivel();
       afterRender();
      });
     });

    design.apply(chart);
    chart.render(); fitLegivel();
    setTimeout(afterRender, 50);
    setTimeout(afterRender, 250);
    if (design.after) design.after(chart);
   }

   // --------------------------- persistência local ---------------------------
   // Sem isto, adicionar/editar/remover é perdido no primeiro F5: a página
   // sempre recarregava o CSV do servidor e jogava fora o trabalho.

   const CHAVE_SALVA = "organograma:dados";

   function salvarLocal() {
    try {
     localStorage.setItem(CHAVE_SALVA, JSON.stringify(currentData));
     marcarAlterado(true);
     return true;
    } catch (erro) {
     marcarAlterado(false);
     setStatus(
      "As alterações não puderam ser salvas neste navegador — exporte o CSV para não perdê-las",
      true
     );
     return false;
    }
   }

   function lerLocal() {
    try {
     const cru = localStorage.getItem(CHAVE_SALVA);
     if (!cru) return null;
     const linhas = JSON.parse(cru);
     return Array.isArray(linhas) && linhas.length ? linhas : null;
    } catch (erro) {
     return null;
    }
   }

   function marcarAlterado(alterado) {
    document.getElementById("btn-descartar").hidden = !alterado;
   }

   function descartarLocal() {
    if (
     !confirm(
      "Descartar todas as alterações salvas neste navegador e recarregar o organograma original?"
     )
    )
     return;
    try {
     localStorage.removeItem(CHAVE_SALVA);
    } catch (erro) {}
    location.reload();
   }

   function iniciar(linhas, mensagem) {
    currentData = linhas;
    buildDesignMenu();
    renderDesign();
    afterRender();
    setStatus(mensagem);
   }

   const salvos = lerLocal();
   if (salvos) {
    marcarAlterado(true);
    iniciar(
     salvos,
     `${salvos.length} pessoas • alterações restauradas deste navegador`
    );
   } else {
    d3.csv("misc/data.csv").then((dataFlattened) => {
     iniciar(
      dataFlattened,
      `Pronto • ${dataFlattened.length} pessoas • clique em um card para selecioná-lo`
     );
    });
   }

   // ------------------------- ações da toolbar -------------------------

   function rootId() {
    const ids = new Set(currentData.map((row) => String(row.id)));
    const root = currentData.find(
     (row) => !String(row.parentId || "").trim() || !ids.has(String(row.parentId))
    );
    return root ? String(root.id) : null;
   }

   function nodeExists(id) {
    return currentData.some((row) => String(row.id) === String(id));
   }

   function pushUndo() {
    undoStack.push(JSON.stringify(currentData));
    if (undoStack.length > 25) undoStack.shift();
   }

   function undoLast() {
    if (!undoStack.length) return setStatus("Nada para desfazer", true);
    const previous = JSON.parse(undoStack.pop());
    if (!Array.isArray(previous)) return setStatus("Histórico corrompido", true);
    currentData = previous;
    selectNode(
     currentData.some((row) => String(row.id) === String(selectedNodeId))
      ? selectedNodeId
      : null
    );
    salvarLocal();
    renderDesign();
    fitLegivel();
    afterRender();
    setStatus(`Última alteração desfeita (${currentData.length} pessoas)`);
   }

   // Só devolve um nó se o usuário realmente clicou em um. Sem palpite:
   // toda ação da toolbar age no que está selecionado ou em nada.
   function getSelectedNodeId() {
    if (selectedNodeId && nodeExists(selectedNodeId)) return selectedNodeId;
    selectedNodeId = null;
    return null;
   }

   function requireSelection(acao) {
    const id = getSelectedNodeId();
    if (!id) {
     setStatus(`Clique em um card para selecioná-lo antes de ${acao}`, true);
     return null;
    }
    return id;
   }

   function centerFocusNode() {
    const id = requireSelection("centralizar");
    if (!id) return;
    chart.setCentered(id).render(); fitLegivel(id);
    afterRender();
    setStatus(`Centralizado em ${nodeLabel(id)}`);
   }

   function highlightFocusNode() {
    const id = requireSelection("destacar");
    if (!id) return;
    chart.clearHighlighting().setHighlighted(id).render(); fitLegivel(id);
    afterRender();
    setStatus(`Nó destacado: ${nodeLabel(id)}`);
   }

   function highlightPathToRoot() {
    const id = requireSelection("destacar o caminho");
    if (!id) return;
    chart.clearHighlighting().setUpToTheRootHighlighted(id).render(); fitLegivel(id);
    afterRender();
    setStatus(`Caminho até a raiz destacado: ${nodeLabel(id)}`);
   }

   function clearHighlighting() {
    if (!chart) return setStatus("Carregue dados antes de limpar destaques", true);
    chart.clearHighlighting().render(); fitLegivel();
    afterRender();
    setStatus("Destaques removidos");
   }

   function nodeLabel(id) {
    const row = currentData.find((r) => String(r.id) === String(id));
    if (!row) return `#${id}`;
    const fullName = `${row.name || ""} ${row.lastName || ""}`.trim() || `(sem nome)`;
    return `#${id} • ${fullName}${row.position ? " — " + row.position : ""}`;
   }

   function chartFit() {
    if (!chart) return setStatus("Carregue dados antes de ajustar à tela", true);
    fitLegivel();
    afterRender();
    setStatus("Visão ajustada à tela");
   }

   function toggleFullscreen() {
    const el = document.querySelector(".chart-wrapper");
    if (!el) return;
    if (!document.fullscreenElement) {
     (el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen());
     setStatus("Modo tela cheia ativado");
    } else {
     (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen && document.webkitExitFullscreen());
     setStatus("Modo tela cheia desativado");
    }
   }

   function cycleLayout() {
    if (!chart) return setStatus("Carregue dados antes de trocar layout", true);
    const layouts = ["right", "bottom", "left", "top"];
    chart.layout(layouts[index++ % layouts.length]).render(); fitLegivel();
    setStatus(`Layout: ${layouts[(index - 1 + layouts.length) % layouts.length]}`);
   }

   function safeCall(method, label) {
    if (!chart) return setStatus(`Carregue dados antes de ${label.toLowerCase()}`, true);
    if (typeof chart[method] === "function") {
     chart[method]();
     fitLegivel();
     afterRender();
     setStatus(label);
    } else {
     setStatus(`${label} indisponível nesta versão`, true);
    }
   }

   function safeExportImg(full) {
    if (!chart) return setStatus("Carregue dados antes de exportar", true);
    chart.exportImg(full ? { full: true } : undefined);
    setStatus(full ? "PNG completo exportado" : "PNG exportado");
   }

   function safeExportSvg() {
    if (!chart) return setStatus("Carregue dados antes de exportar SVG", true);
    chart.exportSvg();
    setStatus("SVG exportado");
   }

   function addSampleNode() {
    const parentId = requireSelection("adicionar um subordinado");
    if (!parentId) return;
    const name = (prompt(`Nome do novo subordinado de ${nodeLabel(parentId)}:`) || "").trim();
    if (!name) return setStatus("Nada adicionado: o nome é obrigatório", true);
    const position = (prompt(`Cargo de ${name}:`, "Analista") || "").trim();
    if (!position) return setStatus("Nada adicionado: o cargo é obrigatório", true);
    const parentRow = currentData.find((r) => String(r.id) === String(parentId));
    const id = proximoId();
    pushUndo();
    currentData.push({
     id,
     parentId,
     name,
     lastName: "",
     position,
     email: "",
     department_name: (parentRow && parentRow.department_name) || "Equipe",
     image: ""
    });
    selectNode(id);
    salvarLocal();
    renderDesign();
    chart.setCentered(id).render(); fitLegivel(id);
    afterRender();
    setStatus(`Adicionado sob ${nodeLabel(parentId)}: ${name} — ${position}`);
   }

   // ----------------------------- editor de card -----------------------------

   var editandoId = null;
   const CAMPOS_EDITAVEIS = ["name", "lastName", "position", "email", "department_name", "image"];

   function abrirEditor(id) {
    const alvo = id !== undefined && id !== null ? String(id) : requireSelection("editar");
    if (!alvo) return;
    const row = currentData.find((r) => String(r.id) === String(alvo));
    if (!row) return setStatus("Colaborador não encontrado", true);

    editandoId = String(alvo);
    CAMPOS_EDITAVEIS.forEach((campo) => {
     document.getElementById("ed-" + campo).value = row[campo] || "";
    });
    atualizarPreview(row.image);
    montarSelectChefe(editandoId, row.parentId);
    document.getElementById("ed-erro").textContent = "";
    document.getElementById("editor").hidden = false;
    document.getElementById("ed-name").focus();
    setStatus(`Editando ${nodeLabel(editandoId)}`);
   }

   function fecharEditor() {
    document.getElementById("editor").hidden = true;
    editandoId = null;
   }

   // A raiz não tem chefe, e ninguém pode responder a um subordinado seu —
   // isso quebraria a árvore em um ciclo e o organograma sumiria da tela.
   function montarSelectChefe(id, parentIdAtual) {
    const select = document.getElementById("ed-parentId");
    const proibidos = descendantsOf(id);
    const ehRaiz = String(id) === String(rootId());
    select.innerHTML = "";
    select.disabled = ehRaiz;

    if (ehRaiz) {
     select.appendChild(new Option("— é a raiz do organograma —", ""));
     select.value = "";
     return;
    }

    currentData
     .filter((row) => !proibidos.has(String(row.id)))
     .sort((a, b) => `${a.name} ${a.lastName}`.localeCompare(`${b.name} ${b.lastName}`, "pt-BR"))
     .forEach((row) => {
      const nome = `${row.name || ""} ${row.lastName || ""}`.trim() || `#${row.id}`;
      select.appendChild(new Option(`${nome}${row.position ? " — " + row.position : ""}`, row.id));
     });
    select.value = String(parentIdAtual || "");
   }

   function atualizarPreview(src) {
    const img = document.getElementById("ed-preview");
    const vazio =
     "data:image/svg+xml;utf8," +
     encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="76" height="76"><rect width="76" height="76" fill="#e2e8f0"/><circle cx="38" cy="30" r="13" fill="#94a3b8"/><path d="M12 76c0-16 12-24 26-24s26 8 26 24z" fill="#94a3b8"/></svg>`
     );
    img.src = src || vazio;
   }

   function limparFoto() {
    document.getElementById("ed-image").value = "";
    atualizarPreview("");
   }

   // A foto vira data URI para viajar junto no CSV/JSON exportado. Sem o
   // redimensionamento, uma foto de celular sozinha passaria de 1 MB no arquivo.
   function fotoParaDataUri(file, aoTerminar) {
    const reader = new FileReader();
    reader.onload = () => {
     const img = new Image();
     img.onload = () => {
      const lado = 128;
      const canvas = document.createElement("canvas");
      canvas.width = lado;
      canvas.height = lado;
      const corte = Math.min(img.width, img.height);
      canvas
       .getContext("2d")
       .drawImage(img, (img.width - corte) / 2, (img.height - corte) / 2, corte, corte, 0, 0, lado, lado);
      aoTerminar(canvas.toDataURL("image/jpeg", 0.85));
     };
     img.onerror = () => setStatus("Não foi possível ler essa imagem", true);
     img.src = reader.result;
    };
    reader.onerror = () => setStatus("Não foi possível ler o arquivo", true);
    reader.readAsDataURL(file);
   }

   function salvarEditor() {
    if (!editandoId) return;
    const row = currentData.find((r) => String(r.id) === String(editandoId));
    if (!row) return setStatus("Colaborador não encontrado", true);

    const valores = {};
    CAMPOS_EDITAVEIS.forEach((campo) => {
     valores[campo] = document.getElementById("ed-" + campo).value.trim();
    });
    const erro = document.getElementById("ed-erro");
    if (!valores.name) {
     erro.textContent = "O nome é obrigatório";
     return document.getElementById("ed-name").focus();
    }
    if (!valores.position) {
     erro.textContent = "O cargo é obrigatório";
     return document.getElementById("ed-position").focus();
    }

    const select = document.getElementById("ed-parentId");
    const novoChefe = select.disabled ? row.parentId : select.value;
    const mudouChefe = String(novoChefe || "") !== String(row.parentId || "");

    pushUndo();
    Object.assign(row, valores);
    if (mudouChefe) row.parentId = novoChefe;

    fecharEditor();
    selectNode(editandoId);
    salvarLocal();
    renderDesign();
    chart.setCentered(row.id).render();
    fitLegivel(row.id);
    afterRender();
    setStatus(
     mudouChefe
      ? `Salvo: ${nodeLabel(row.id)} agora responde a ${nodeLabel(novoChefe)}`
      : `Salvo: ${nodeLabel(row.id)}`
    );
   }

   // Continua a numeração do CSV em vez de um id sintético: quem adiciona uma
   // pessoa aqui espera encontrá-la no CSV exportado, com um id igual aos outros.
   function proximoId() {
    const numericos = currentData
     .map((row) => Number(row.id))
     .filter((n) => Number.isFinite(n));
    return String(numericos.length ? Math.max(...numericos) + 1 : 1);
   }

   function descendantsOf(targetId) {
    const ids = new Set([String(targetId)]);
    let changed = true;
    while (changed) {
     changed = false;
     for (const row of currentData) {
      if (ids.has(String(row.parentId)) && !ids.has(String(row.id))) {
       ids.add(String(row.id));
       changed = true;
      }
     }
    }
    return ids;
   }

   function removeSampleNode() {
    if (!currentData.length) return setStatus("Não há nós para remover", true);
    const targetId = requireSelection("remover");
    if (!targetId) return;

    // Apagar a raiz esvazia o organograma inteiro e deixa a tela em branco.
    if (String(targetId) === String(rootId())) {
     return setStatus(
      `${nodeLabel(targetId)} é a raiz do organograma e não pode ser removida`,
      true
     );
    }

    const idsToRemove = descendantsOf(targetId);
    const label = nodeLabel(targetId);
    const subordinados = idsToRemove.size - 1;
    const aviso = subordinados
     ? `Remover ${label}?\n\nIsto também remove ${subordinados} subordinado(s) abaixo dele.`
     : `Remover ${label}?`;
    if (!confirm(aviso)) return setStatus("Remoção cancelada");

    pushUndo();
    currentData = currentData.filter((row) => !idsToRemove.has(String(row.id)));
    selectNode(null);
    salvarLocal();
    renderDesign();
    fitLegivel();
    afterRender();
    setStatus(`Removido: ${label} (${idsToRemove.size} pessoa(s))`);
   }

   function downloadPdf() {
    chart.exportImg({
     save: false,
     onLoad: (base64) => {
      const image = new Image();
      image.onload = () => {
       const landscape = image.width >= image.height;
       const pdf = new jspdf.jsPDF({
        orientation: landscape ? "landscape" : "portrait",
        unit: "mm",
        format: "a4"
       });
       const pageW = pdf.internal.pageSize.getWidth();
       const pageH = pdf.internal.pageSize.getHeight();
       const margin = 8;
       const scale = Math.min(
        (pageW - margin * 2) / image.width,
        (pageH - margin * 2) / image.height
       );
       const w = image.width * scale;
       const h = image.height * scale;
       pdf.addImage(base64, "PNG", (pageW - w) / 2, (pageH - h) / 2, w, h);
       pdf.save("organograma.pdf");
      };
      image.onerror = () => setStatus("Não foi possível gerar o PDF", true);
      image.src = base64;
     }
    });
   }

   // ------------------------- carregamento de CSV -------------------------

   function validateRows(rows) {
    const ids = new Set();
    const duplicated = [];
    rows.forEach((row) => {
     const id = String(row.id);
     if (ids.has(id)) duplicated.push(id);
     ids.add(id);
    });
    if (duplicated.length) {
     throw new Error(
      `IDs duplicados no CSV: ${[...new Set(duplicated)].slice(0, 3).join(", ")}`
     );
    }
    const roots = rows.filter((row) => !String(row.parentId || "").trim());
    if (!roots.length) {
     throw new Error("O CSV não tem nó raiz (uma linha com parentId vazio)");
    }
    if (roots.length > 1) {
     throw new Error(
      `O CSV tem ${roots.length} raízes; use apenas uma linha com parentId vazio`
     );
    }
    const orphan = rows.find((row) => {
     const parent = String(row.parentId || "").trim();
     return parent && !ids.has(parent);
    });
    if (orphan) {
     throw new Error(
      `A linha ${orphan.id} aponta para um parentId inexistente (${orphan.parentId})`
     );
    }
   }

   function parseInput(text, name) {
    const ext = (name || "").toLowerCase();
    if (ext.endsWith(".json")) {
     const json = JSON.parse(text);
     const rows = Array.isArray(json) ? json : Array.isArray(json.nodes) ? json.nodes : null;
     if (!rows) throw new Error("JSON precisa ser uma lista de nós ou ter a chave 'nodes'");
     return rows;
    }
    return d3.csvParse(text);
   }

   function loadDataFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
     try {
      const rows = parseInput(event.target.result, file.name);
      if (!Array.isArray(rows) || rows.length === 0) {
       throw new Error("O arquivo não contém dados válidos");
      }
      const validRows = rows.filter((row) => {
       const id = String(row.id || "").trim();
       const name = String(row.name || "").trim();
       return id && (name || String(row.lastName || "").trim());
      });
      if (!validRows.length) {
       throw new Error("O arquivo precisa conter pelo menos id e nome/lastName");
      }
      validateRows(validRows);
      currentData = validRows;
      selectNode(null);
      undoStack.length = 0;
      salvarLocal();
      renderDesign();
      fitLegivel();
      afterRender();
      setStatus(`${validRows.length} registros carregados de ${file.name}`);
     } catch (error) {
      setStatus(error.message || "Não foi possível ler o arquivo", true);
     }
    };
    reader.onerror = () => setStatus("Não foi possível ler o arquivo", true);
    reader.readAsText(file, "UTF-8");
   }

   const CSV_COLUMNS = ["id", "parentId", "name", "lastName", "position", "email", "department_name", "location_state", "image"];

   function exportRows() {
    return CSV_COLUMNS.map((column) => `"${column.replace(/"/g, '""')}"`).join(",")
     + "\n"
     + currentData.map((row) =>
      CSV_COLUMNS.map((column) => {
       const value = row[column] === undefined || row[column] === null ? "" : String(row[column]);
       return `"${value.replace(/"/g, '""')}"`;
      }).join(",")
     ).join("\n");
   }

   function downloadCsv() {
    if (!currentData.length) return setStatus("Não há dados para exportar", true);
    const blob = new Blob([exportRows()], { type: "text/csv;charset=utf-8" });
    triggerDownload(blob, "organograma.csv");
    setStatus(`Exportado organograma.csv (${currentData.length} registros)`);
   }

   function downloadJson() {
    if (!currentData.length) return setStatus("Não há dados para exportar", true);
    const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: "application/json" });
    triggerDownload(blob, "organograma.json");
    setStatus(`Exportado organograma.json (${currentData.length} registros)`);
   }

   function triggerDownload(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
   }

   function setStatus(message, isError) {
    const status = document.getElementById("status-msg");
    if (status) {
     status.textContent = message;
     status.previousElementSibling.style.background = isError
      ? "#ef4444"
      : "#10b981";
    }
   }

   document.getElementById("ed-arquivo").addEventListener("change", (event) => {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file) return;
    fotoParaDataUri(file, (dataUri) => {
     document.getElementById("ed-image").value = dataUri;
     atualizarPreview(dataUri);
     setStatus(`Foto carregada (${Math.round(dataUri.length / 1024)} KB)`);
    });
   });

   document.getElementById("ed-image").addEventListener("input", (event) => {
    atualizarPreview(event.target.value.trim());
   });

   // Sem isso o aviso de campo obrigatório fica na tela depois de corrigido.
   document.querySelectorAll("#editor input, #editor select").forEach((campo) => {
    campo.addEventListener("input", () => {
     document.getElementById("ed-erro").textContent = "";
    });
   });

   document.getElementById("editor").addEventListener("click", (event) => {
    if (event.target.id === "editor") fecharEditor();
   });

   document.addEventListener("keydown", (event) => {
    if (document.getElementById("editor").hidden) return;
    if (event.key === "Escape") fecharEditor();
    if (event.key === "Enter" && event.target.tagName === "INPUT") salvarEditor();
   });

   // A lib só expõe callback de clique simples, então o duplo clique é
   // capturado por delegação no container.
   document.querySelector(".chart-wrapper").addEventListener("dblclick", (event) => {
    const node = event.target.closest("g.node");
    if (!node) return;
    const id = nodeIdFromElement(node);
    if (id === null) return;
    selectNode(id);
    abrirEditor(id);
   });

   document.getElementById("csv-input").addEventListener("change", (event) => {
    loadDataFile(event.target.files[0]);
    event.target.value = "";
   });

   document.getElementById("theme-select").addEventListener("change", (event) => {
    currentDesign = event.target.value;
    index = 0;
    renderDesign();
    afterRender();
    setStatus(`${event.target.selectedOptions[0].textContent} aplicado`);
   });

   let resizeTimer;
   window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
     if (!chart) return;
     chart.svgHeight(chartHeight()).render();
     fitLegivel();
    }, 200);
   });

   const dropOverlay = document.getElementById("drop-overlay");
   let dragDepth = 0;
   document.addEventListener("dragenter", (event) => {
    event.preventDefault();
    dragDepth += 1;
    dropOverlay.classList.add("active");
   });
   document.addEventListener("dragover", (event) => event.preventDefault());
   document.addEventListener("dragleave", (event) => {
    event.preventDefault();
    dragDepth -= 1;
    if (dragDepth <= 0) {
     dragDepth = 0;
     dropOverlay.classList.remove("active");
    }
   });
   document.addEventListener("drop", (event) => {
    event.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove("active");
    loadDataFile(event.dataTransfer.files[0]);
   });
  </script>

  <link href="build/fontawesome.min.css?v=2" rel="stylesheet" />
 </body>
