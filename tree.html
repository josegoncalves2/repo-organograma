<!DOCTYPE html>

<html>
 <head>
  <meta charset="UTF-8" />
  <title>OrgChart</title>
  <link rel="shortcut icon" type="image/x-icon" href="misc/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 </head>

 <body>
  <div class="layout-with-sidebar">
   <aside class="sidebar" id="sidebar">
   <iframe
    src="sidebar/sidebar.html"
    title="Árvore completa do organograma"
   ></iframe>
    <div class="sidebar-resizer" id="sidebar-resizer" title="Arraste para ajustar a largura"></div>
   </aside>

  <!----------------   ORG CHART NON ESSENTIAL CONTENT ------------>
  <script src="build/vendor/html2canvas.js"></script>
  <script src="build/vendor/jspdf.umd.min.js"></script>
  <link href="build/simptip.min.css" rel="stylesheet" />

  <style>
   [data-tooltip]:focus:after {
    display: none;
    border-bottom-color: none !important;
   }

   [data-tooltip]:focus:before {
    display: none;
    border-bottom-color: none !important;
   }

   [data-tooltip]:after {
    height: auto !important;
    padding: 11px 11px 11px 11px !important;
    content: attr(data-tooltip);
    white-space: pre;
    line-height: 16px !important;
    text-align: left !important;
   }
  </style>

  <link href="build/app.css" rel="stylesheet" />
  <link href="sidebar/sidebar.css" rel="stylesheet" />

  <main class="main-content">

  <div class="toolbar">
   <div class="toolbar__brand">
    <i class="fas fa-sitemap"></i>
    Organograma
   </div>

   <label class="escopo-picker" title="Desenhar o organograma a partir de uma unidade">
    <i class="fas fa-crosshairs"></i>
    <span class="escopo-picker__rotulo">Ver a partir de</span>
    <select id="escopo-select"></select>
   </label>

   <div class="toolbar__divider"></div>

   <label class="file-upload">
    <span class="file-upload__label">
     <i class="fas fa-file-csv"></i>
     Carregar CSV + fotos
    </span>
    <input
     type="file"
     id="csv-input"
     accept=".csv,text/csv,.json,application/json,image/*"
     multiple
     title="Selecione o CSV e as fotos juntos (Ctrl+A na pasta)"
    />
   </label>

   <a
    class="btn file-upload__label"
    href="misc/modelo-organograma.csv"
    download="modelo-organograma.csv"
    title="Baixar modelo CSV para importação"
   >
    <i class="fas fa-file-csv"></i> Modelo CSV
   </a>

   <a
    class="btn file-upload__label"
    href="misc/modelo-organograma.json"
    download="modelo-organograma.json"
    title="Baixar modelo JSON para importação"
   >
    <i class="fas fa-file-code"></i> Modelo JSON
   </a>

   <button class="btn" onclick="downloadCsv(false)" title="Exportar todo o organograma como CSV">
    <i class="fas fa-file-export"></i> Exportar CSV
   </button>
   <button class="btn" onclick="downloadJson(false)" title="Exportar todo o organograma como JSON">
    <i class="fas fa-file-code"></i> Exportar JSON
   </button>
   <button class="btn" onclick="downloadCsv(true)" title="Exportar o ramo selecionado ou a visão atual como CSV">
    <i class="fas fa-code-branch"></i> CSV Parte
   </button>
   <button class="btn" onclick="downloadJson(true)" title="Exportar o ramo selecionado ou a visão atual como JSON">
    <i class="fas fa-code-branch"></i> JSON Parte
   </button>

   <label class="theme-picker">
    <i class="fas fa-palette"></i>
    <select id="theme-select" title="Design (bumbeishvili/org-chart)"></select>
   </label>

   <button class="btn" onclick="abrirCores()" title="Trocar as cores de cada tipo">
    <i class="fas fa-fill-drip"></i> Cores
   </button>

   <button class="btn" id="theme-mode-toggle" onclick="toggleThemeMode()" title="Alternar modo claro/escuro">
    <i class="fas fa-moon"></i> Dark
   </button>


   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button class="btn" onclick="chartFit()" title="Ajustar à tela">
     <i class="fas fa-expand"></i> Fit
    </button>
    <button class="btn" onclick="toggleFullscreen()" title="Tela cheia">
     <i class="fas fa-arrows-alt"></i> Full
    </button>
    <button
     class="btn"
     onclick="cycleLayout()"
     title="Trocar layout"
    >
     <i class="fas fa-exchange-alt"></i> Layout
    </button>
   </div>

   <div class="toolbar__group">
    <button class="btn" onclick="safeCall('expandAll', 'Expandir tudo')" title="Expandir tudo">
     <i class="fas fa-plus-circle"></i> Expand All
    </button>
    <button class="btn" onclick="safeCall('collapseAll', 'Recolher tudo')" title="Recolher tudo">
     <i class="fas fa-minus-circle"></i> Collapse All
    </button>
   </div>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button
     class="btn"
     onclick="safeExportImg(false)"
     title="Exportar PNG do que está visível"
    >
     <i class="fas fa-image"></i> PNG
    </button>
    <button
     class="btn"
     onclick="safeExportImg(true)"
     title="Exportar PNG do grafo completo"
    >
     <i class="far fa-images"></i> PNG Full
    </button>
    <button class="btn" onclick="safeExportSvg()" title="Exportar SVG">
     <i class="fas fa-code"></i> SVG
    </button>
    <button class="btn" onclick="downloadPdf()" title="Exportar PDF">
     <i class="fas fa-file-pdf"></i> PDF
    </button>
   </div>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button class="btn" onclick="centerFocusNode()" title="Centralizar nó">
     <i class="fas fa-crosshairs"></i> Center
    </button>
    <button class="btn" onclick="highlightFocusNode()" title="Destacar nó">
     <i class="fas fa-highlighter"></i> Highlight
    </button>
    <button
     class="btn"
     onclick="highlightPathToRoot()"
     title="Destacar caminho até a raiz"
    >
     <i class="fas fa-arrow-up"></i> To Root
    </button>
    <button
     class="btn"
     onclick="clearHighlighting()"
     title="Limpar destaques"
    >
     <i class="fas fa-eraser"></i> Clear
    </button>
    <button class="btn" onclick="undoLast()" title="Desfazer a última alteração">
     <i class="fas fa-undo"></i> Undo
    </button>
   </div>

   <div class="toolbar__group">
    <button class="btn btn--primary" onclick="addSampleNode()" title="Adicionar um subordinado ao card selecionado">
     <i class="fas fa-user-plus"></i> Add Node
    </button>
    <button
     class="btn"
     onclick="abrirEditor()"
     title="Editar o card selecionado (ou dê duplo clique no card)"
    >
     <i class="fas fa-pen"></i> Editar
    </button>
    <button
     class="btn btn--danger"
     onclick="removeSampleNode()"
     title="Remover o card selecionado e todos os subordinados dele"
    >
     <i class="fas fa-user-minus"></i> Remove
    </button>
   </div>

   <button
    class="btn btn--danger"
    id="btn-descartar"
    onclick="descartarLocal()"
    title="Descartar as alterações salvas neste navegador e voltar ao organograma original"
    hidden
   >
    <i class="fas fa-undo"></i> Descartar alterações
   </button>
  </div>

  <div class="modal" id="cores" hidden>
   <div class="modal__box modal__box--cores" role="dialog" aria-modal="true" aria-labelledby="cores-titulo">
    <div class="modal__head">
     <h2 id="cores-titulo">Cores dos tipos</h2>
     <button class="modal__x" onclick="fecharCores()" title="Fechar" aria-label="Fechar">
      <i class="fas fa-times"></i>
     </button>
    </div>

    <div class="modal__body">
     <p class="cores__ajuda">
      Vale para os 50 designs — todos leem esta tabela. A troca aparece na hora
      e fica gravada neste navegador.
     </p>
     <div class="cores__cabecalho">
      <span>Tipo</span><span>Fundo</span><span>Borda</span><span>Texto</span><span>Selo</span><span>Texto do selo</span><span></span>
     </div>
     <div id="cores-lista"></div>
    </div>

    <div class="modal__pe">
     <button class="btn" onclick="restaurarTodasAsCores()">
      <i class="fas fa-rotate-left"></i> Restaurar tudo
     </button>
     <button class="btn btn--primary" onclick="fecharCores()">
      <i class="fas fa-check"></i> Pronto
     </button>
    </div>
   </div>
  </div>

  <div class="modal" id="editor" hidden>
   <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="editor-titulo">
    <div class="modal__head">
     <h2 id="editor-titulo">Editar colaborador</h2>
     <button class="modal__x" onclick="fecharEditor()" title="Fechar" aria-label="Fechar">
      <i class="fas fa-times"></i>
     </button>
    </div>

    <div class="modal__body">
     <div class="campo-foto">
      <img id="ed-preview" alt="Foto do colaborador" />
      <div class="campo-foto__acoes">
       <label class="btn btn--primary" style="cursor:pointer">
        <i class="fas fa-upload"></i> Enviar foto
        <input type="file" id="ed-arquivo" accept="image/*" hidden />
       </label>
       <button class="btn" type="button" onclick="limparFoto()">
        <i class="fas fa-trash"></i> Remover foto
       </button>
      </div>
     </div>

     <label class="campo campo--largo">
      <span>URL da foto</span>
      <input type="text" id="ed-image" placeholder="https://… (ou use Enviar foto)" />
     </label>

     <label class="campo">
      <span>Nome <b>*</b></span>
      <input type="text" id="ed-name" />
     </label>

     <label class="campo">
      <span>Sobrenome</span>
      <input type="text" id="ed-lastName" />
     </label>

     <label class="campo campo--largo">
      <span>Cargo / Nome da unidade <b>*</b></span>
      <input type="text" id="ed-position" />
     </label>

     <label class="campo campo--largo">
      <span>Tipo <b>*</b></span>
      <select id="ed-type"></select>
     </label>

     <label class="campo">
      <span>E-mail</span>
      <input type="text" id="ed-email" />
     </label>

     <label class="campo">
      <span>Departamento</span>
      <input type="text" id="ed-department_name" />
     </label>

     <label class="campo campo--largo">
      <span>Responde a</span>
      <select id="ed-parentId"></select>
     </label>
    </div>

    <div class="modal__pe">
     <span class="modal__erro" id="ed-erro"></span>
     <button class="btn" onclick="fecharEditor()">Cancelar</button>
     <button class="btn btn--primary" onclick="salvarEditor()">
      <i class="fas fa-check"></i> Salvar
     </button>
    </div>
   </div>
  </div>

  <div class="status-bar">
   <span class="status-bar__dot"></span>
   <span id="status-msg">Carregando…</span>
  </div>

  <div class="chart-wrapper">
   <div class="chart-container"></div>
  </div>

  <div class="drop-overlay" id="drop-overlay">
   <div class="drop-overlay__content">
    <i class="fas fa-cloud-upload-alt"></i>
    Solte aqui o CSV e as fotos
   </div>
  </div>

  </main>
 </div>

  <!----------------  ORG CHART ESSENTIAL CONTENT ---------------->

  <script src="build/d3.v7.min.js"></script>
  <script src="build/d3-org-chart.js"></script>
  <script src="build/d3-flextree.js"></script>
  <script src="build/vendor/pieChart.js"></script>

  <script>
   // ---------------------------------------------------------------------
   // Os 7 designs abaixo são portes dos exemplos de github.com/bumbeishvili/
   // org-chart, adaptados para as colunas de misc/data.csv.
   //
   // Em Futuristic e Prev version, os números que vinham de Math.random()
   // (barras de progresso, percentuais, largura e canto do card) foram
   // trocados por dados reais do arquivo. O desenho dos dois é o original.
   // ---------------------------------------------------------------------

   const READ_ONLY_MODE = new URLSearchParams(window.location.search).get("view") === "1";

   var chart;
   var currentDesign = "default";
   var currentData = [];
   var selectedNodeId = null;
   // Escopo do desenho: null = organograma inteiro; senao, o id da unidade que
   // passa a ser a raiz. 643 caixas de uma vez sao ilegiveis; abrir a partir de
   // uma Secretaria/Divisao/Setor e o uso normal.
   var escopoId = null;
   // Ultima altura passada ao svgHeight(): serve de guarda contra o loop do
   // ResizeObserver e evita render() a toa.
   var alturaDesenhada = 0;
   var undoStack = [];
   var novoNoPendente = null;

   // =====================================================================
   // TAXONOMIA DE ORGAOS — enumerada, nao booleana.
   //
   // As 15 classes e o rank de cada uma foram MEDIDOS em
   // organograma-completo.csv (629 linhas). Nada aqui foi arbitrado:
   //   rank 0  PREFEITURA ....... profundidade 0       (1 no)
   //   rank 1  SECRETARIA ....... profundidade 1      (14 nos)
   //           GABINETE ......... profundidade 1       (1 no)
   //           CONTROLADORIA .... profundidade 1       (1 no)
   //   rank 2  COORDENADORIA .... profundidade 2      (16 nos)
   //           ASSESSOR ......... profundidade 2      (15 nos)
   //           FUNDO ............ profundidade 2       (5 nos)
   //           CHEFE/CONSELHO/GUARDA . profundidade 2  (1 cada)
   //   rank 3  DIVISAO .......... profundidade 2-4    (73 nos)
   //           FUNDEB/CORPO ..... profundidade 3       (1 cada)
   //   rank 4  SETOR ............ profundidade 3-9   (168 nos)
   //   rank 5  COLABORADOR ...... profundidade 2-10  (330 nos)
   //
   // Cada classe tem identidade visual PROPRIA: nenhuma compartilha
   // preenchimento, borda, forma de selo nem rotulo com outra.
   // COLABORADOR nao e SETOR, nao e DIVISAO, nao e SECRETARIA.
   // =====================================================================

   const TIPOS = {
    PREFEITURA:    { rotulo:"PREFEITURA",    rank:0, bg:"#0F172A", borda:"#38BDF8", texto:"#E0F2FE", selo:"#38BDF8", seloTexto:"#0F172A", forma:"escudo",  raio:4  },
    SECRETARIA:    { rotulo:"SECRETARIA",    rank:1, bg:"#F0FDFA", borda:"#0F766E", texto:"#134E4A", selo:"#0F766E", seloTexto:"#FFFFFF", forma:"bloco",   raio:6  },
    GABINETE:      { rotulo:"GABINETE",      rank:1, bg:"#FFF1F2", borda:"#9F1239", texto:"#881337", selo:"#9F1239", seloTexto:"#FFFFFF", forma:"bloco",   raio:6  },
    CONTROLADORIA: { rotulo:"CONTROLADORIA", rank:1, bg:"#FAF5FF", borda:"#6B21A8", texto:"#581C87", selo:"#6B21A8", seloTexto:"#FFFFFF", forma:"bloco",   raio:6  },
    COORDENADORIA: { rotulo:"COORDENADORIA", rank:2, bg:"#FFFBEB", borda:"#B45309", texto:"#92400E", selo:"#B45309", seloTexto:"#FFFFFF", forma:"chanfro", raio:8  },
    ASSESSOR:      { rotulo:"ASSESSOR",      rank:2, bg:"#F0F9FF", borda:"#0369A1", texto:"#075985", selo:"#0369A1", seloTexto:"#FFFFFF", forma:"chanfro", raio:8  },
    FUNDO:         { rotulo:"FUNDO",         rank:2, bg:"#FDF4FF", borda:"#A21CAF", texto:"#86198F", selo:"#A21CAF", seloTexto:"#FFFFFF", forma:"chanfro", raio:8  },
    CHEFE:         { rotulo:"CHEFE",         rank:2, bg:"#F8FAFC", borda:"#0F172A", texto:"#0F172A", selo:"#0F172A", seloTexto:"#FFFFFF", forma:"chanfro", raio:8  },
    CONSELHO:      { rotulo:"CONSELHO",      rank:2, bg:"#ECFDF5", borda:"#047857", texto:"#065F46", selo:"#047857", seloTexto:"#FFFFFF", forma:"chanfro", raio:8  },
    GUARDA:        { rotulo:"GUARDA",        rank:2, bg:"#EFF6FF", borda:"#1E3A8A", texto:"#1E3A8A", selo:"#1E3A8A", seloTexto:"#FFFFFF", forma:"chanfro", raio:8  },
    // Legenda "COMISSIONADOS:" que cada slide traz no canto: agrupa os
    // Assessores de Gabinete, que nao ocupam caixa no desenho. Sem esta
    // classe eles saiam pendurados na Secretaria, irmaos das Divisoes.
    COMISSIONADOS: { rotulo:"COMISSIONADOS", rank:2, bg:"#FEF2F2", borda:"#B91C1C", texto:"#991B1B", selo:"#B91C1C", seloTexto:"#FFFFFF", forma:"chanfro", raio:8  },
    DIVISAO:       { rotulo:"DIVISAO",       rank:3, bg:"#F5F3FF", borda:"#4338CA", texto:"#3730A3", selo:"#4338CA", seloTexto:"#FFFFFF", forma:"faixa",   raio:10 },
    FUNDEB:        { rotulo:"FUNDEB",        rank:3, bg:"#F7FEE7", borda:"#3F6212", texto:"#365314", selo:"#3F6212", seloTexto:"#FFFFFF", forma:"faixa",   raio:10 },
    CORPO:         { rotulo:"CORPO",         rank:3, bg:"#FFF7ED", borda:"#C2410C", texto:"#9A3412", selo:"#C2410C", seloTexto:"#FFFFFF", forma:"faixa",   raio:10 },
    SETOR:         { rotulo:"SETOR",         rank:4, bg:"#ECFEFF", borda:"#0E7490", texto:"#155E75", selo:"#0E7490", seloTexto:"#FFFFFF", forma:"aba",     raio:12 },
    COLABORADOR:   { rotulo:"COLABORADOR",   rank:5, bg:"#FFFFFF", borda:"#64748B", texto:"#334155", selo:"#E2E8F0", seloTexto:"#475569", forma:"pilula",  raio:16 }
   };

   // ----------------------------- cores editaveis -----------------------------
   // A tabela acima e o padrao de fabrica. O que o usuario escolher fica no
   // navegador e e reaplicado por cima dela no boot. Como os 50 designs leem
   // TIPOS, mexer aqui repinta todos de uma vez.
   const CHAVE_CORES = "organograma:cores";
   const CAMPOS_COR = ["bg", "borda", "texto", "selo", "seloTexto"];
   const CORES_PADRAO = JSON.parse(JSON.stringify(TIPOS));

   function carregarCoresSalvas() {
    let salvas = null;
    try {
     salvas = JSON.parse(localStorage.getItem(CHAVE_CORES) || "null");
    } catch (erro) {}
    if (!salvas) return;
    for (const chave of Object.keys(salvas)) {
     if (!TIPOS[chave]) continue;
     for (const campo of CAMPOS_COR) {
      const valor = salvas[chave][campo];
      // So aceita hex: qualquer outra coisa no localStorage e lixo e ia
      // injetar direto no style dos cards.
      if (typeof valor === "string" && /^#[0-9A-Fa-f]{6}$/.test(valor)) {
       TIPOS[chave][campo] = valor.toUpperCase();
      }
     }
    }
   }

   function gravarCores() {
    const fora = {};
    for (const chave of Object.keys(TIPOS)) {
     for (const campo of CAMPOS_COR) {
      if (TIPOS[chave][campo] !== CORES_PADRAO[chave][campo]) {
       (fora[chave] = fora[chave] || {})[campo] = TIPOS[chave][campo];
      }
     }
    }
    try {
     if (Object.keys(fora).length) localStorage.setItem(CHAVE_CORES, JSON.stringify(fora));
     else localStorage.removeItem(CHAVE_CORES);
    } catch (erro) {}
   }

   carregarCoresSalvas();

   const TIPO_DESCONHECIDO = { rotulo:"UNIDADE", rank:3, bg:"#F1F5F9", borda:"#475569", texto:"#1E293B", selo:"#475569", seloTexto:"#FFFFFF", forma:"bloco", raio:8 };

   // Acentos fora: "DIVISAO" e "DIVISAO" precisam bater com a mesma chave.
   function normalizar(texto) {
    return String(texto || "")
     .normalize("NFD")
     .replace(/[\u0300-\u036f]/g, "")
     .trim()
     .toUpperCase();
   }

   function valorCampo(row, ...chaves) {
    if (!row || typeof row !== "object") return "";
    const alternativos = [];
    for (const chave of chaves) {
     if (!chave) continue;
     const base = String(chave);
     alternativos.push(base);
     alternativos.push(base.toLowerCase());
     alternativos.push(base.replace(/[^a-zA-Z0-9]/g, ""));
     alternativos.push(base.replace(/([a-z])([A-Z])/g, "$1_$2").toLowerCase());
     alternativos.push(base.replace(/([a-z])([A-Z])/g, "$1-$2").toLowerCase());
    }
    for (const chave of alternativos) {
     if (!chave) continue;
     const valor = row[chave];
     if (valor !== undefined && valor !== null && String(valor).trim() !== "") {
      return String(valor).trim();
     }
    }
    return "";
   }

   function temFoto(row) {
    const imagem = valorCampo(
     row,
     "image",
     "imageUrl",
     "foto",
     "photo",
     "avatar",
     "imagem",
     "fotoUrl",
     "photoUrl",
     "image_url",
     "photo_url"
    );
    return Boolean(String(imagem || "").trim());
   }

   function normalizarLinha(row) {
    if (!row || typeof row !== "object") return row;
    const linha = { ...row };
    const nome = valorCampo(linha, "name", "nome", "fullName", "nomeCompleto", "full_name", "nome_completo", "employeeName", "nomeFuncionario");
    const sobrenome = valorCampo(linha, "lastName", "sobrenome", "surname", "ultimoNome", "last_name", "sobrenome_completo", "lastNameCompleto");
    const cargo = valorCampo(linha, "position", "cargo", "titulo", "title", "cargoAtual", "positionName");
    const tipo = valorCampo(linha, "type", "tipo");
    const email = valorCampo(linha, "email", "mail", "emailCorporativo", "email_corporativo");
    const departamento = valorCampo(linha, "department_name", "department", "departamento", "departmentName", "department_name", "departamentoNome");
    const localizacao = valorCampo(linha, "location_state", "location", "estado", "locationState", "state", "location_state");
    const imagem = valorCampo(linha, "image", "imageUrl", "foto", "photo", "avatar", "imagem", "image_url", "photo_url", "fotoUrl", "photoUrl");
    const parentId = valorCampo(linha, "parentId", "parent_id", "parentid", "paiId", "parentIdColaborador");
    const id = valorCampo(linha, "id", "ID", "idColaborador", "employeeId");
    if (nome) linha.name = nome;
    if (sobrenome) linha.lastName = sobrenome;
    if (cargo) linha.position = cargo;
    if (tipo) linha.type = tipo;
    if (email) linha.email = email;
    if (departamento) linha.department_name = departamento;
    if (localizacao) linha.location_state = localizacao;
    if (imagem) {
      linha.image = imagem;
      linha.imageUrl = imagem;
    }
    if (parentId) linha.parentId = parentId;
    if (id) linha.id = id;
    return linha;
   }

   // Classifica UMA linha. Ordem de precedencia:
   //   1. coluna `type` explicita, quando o arquivo traz
   //   2. nome de pessoa preenchido -> COLABORADOR
   //   3. primeira palavra de `position`, que e o rotulo do proprio arquivo
   // Nao ha inferencia: se a palavra nao esta na tabela, cai em UNIDADE
   // generica e o rotulo original e preservado no selo.
   function classificar(row) {
    const explicito = normalizar(valorCampo(row, "type", "tipo"));
    if (explicito && TIPOS[explicito]) return explicito;

    const pessoa = nomeCompleto(row);
    if (pessoa) return "COLABORADOR";

    const primeira = normalizar(valorCampo(row, "position", "cargo", "titulo", "title")).split(/[\s,/-]+/)[0];
    if (primeira && TIPOS[primeira]) return primeira;

    return "";
   }

   function tipoDe(row) {
    return TIPOS[classificar(row)] || TIPO_DESCONHECIDO;
   }

   function rankDe(row) {
    return tipoDe(row).rank;
   }

   // COLABORADOR e folha por definicao: pessoa nao chefia orgao.
   function ehColaborador(row) {
    return classificar(row) === "COLABORADOR";
   }

   // =====================================================================
   // VALIDACAO DE HIERARQUIA
   // Regra unica, derivada dos ranks acima: um filho nunca pode ter rank
   // MENOR que o do pai. SETOR (4) sob DIVISAO (3) e valido; DIVISAO (3)
   // sob SETOR (4) nao e. COLABORADOR (5) nao pode ter filho nenhum.
   // As violacoes sao CONTADAS e MOSTRADAS, nunca corrigidas em silencio:
   // o arquivo do usuario e a verdade, o codigo so reporta.
   // =====================================================================
   var violacoesHierarquia = [];

   function validarHierarquia(rows) {
    violacoesHierarquia = [];
    const porId = new Map(rows.map((r) => [String(r.id), r]));

    for (const row of rows) {
     const paiId = String(row.parentId || "").trim();
     if (!paiId) continue;
     const pai = porId.get(paiId);
     if (!pai) continue;

     const tipoFilho = tipoDe(row);
     const tipoPai = tipoDe(pai);

     if (ehColaborador(pai)) {
      violacoesHierarquia.push({
       id: row.id,
       tipo: "COLABORADOR_COM_FILHO",
       texto: `${rotuloLegivel(row)} responde a ${rotuloLegivel(pai)}, que e COLABORADOR`
      });
      continue;
     }

     if (tipoFilho.rank < tipoPai.rank) {
      violacoesHierarquia.push({
       id: row.id,
       tipo: "RANK_INVERTIDO",
       texto: `${tipoFilho.rotulo} "${rotuloLegivel(row)}" esta sob ${tipoPai.rotulo} "${rotuloLegivel(pai)}"`
      });
     }
    }
    return violacoesHierarquia;
   }

   function rotuloLegivel(row) {
    const pessoa = nomeCompleto(row);
    return pessoa || String(valorCampo(row, "position", "cargo", "titulo", "title") || "").trim() || `#${row.id}`;

   function escaparHtml(texto) {
    return String(texto == null ? "" : texto)
     .replace(/&/g, "&amp;")
     .replace(/</g, "&lt;")
     .replace(/>/g, "&gt;")
     .replace(/"/g, "&quot;")
     .replace(/'/g, "&#39;");
   }

   function resolveImageUrl(src) {
    const texto = String(src ?? "").trim().replace(/\\/g, "/");
    if (!texto) return "";
    if (/^data:|^https?:|^\/\//i.test(texto) || texto.startsWith("/")) return texto;
    const normalizado = texto.replace(/^\.\//, "").replace(/^\//, "");
    return `/${normalizado}`;

   // Como a cor da classe vira fundo/texto do card. `solido` preenche com a
   // cor da classe; `escuro` inverte o card inteiro; `papel` e um creme com
   // tipografia serifada.
   // Luminancia relativa (WCAG). Usada para escolher, entre as cores da
   // classe, a que mais contrasta com o fundo do card daquele modo.
   function luminancia(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || "").trim());
    if (!m) return 0;
    const v = parseInt(m[1], 16);
    const canais = [(v >> 16) & 255, (v >> 8) & 255, v & 255].map((n) => {
     const x = n / 255;
     return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * canais[0] + 0.7152 * canais[1] + 0.0722 * canais[2];
   }

   function contraste(a, b) {
    const la = luminancia(a);
    const lb = luminancia(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
   }

   function paraRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || "").trim());
    const v = m ? parseInt(m[1], 16) : 0;
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
   }

   function paraHex(rgb) {
    return "#" + rgb.map((n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, "0")).join("");
   }

   // Mistura a cor com branco ou preto mantendo o MATIZ.
   function misturar(cor, alvo, fracao) {
    const a = paraRgb(cor);
    const b = paraRgb(alvo);
    return paraHex([0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * fracao));
   }

   // contraste — e isso QUEBROU a identidade: `seloTexto` e #FFFFFF em quase
   // todas as classes, o branco ganha sempre num fundo escuro, e as 15
   // classes colapsavam para 2 acentos distintos. Medido pelo harness:

   // SECRETARIA continuam distinguiveis em qualquer modo.
   function acentoContrastante(t, fundo) {
    const alvo = luminancia(fundo) < 0.25 ? "#FFFFFF" : "#000000";
    let cor = t.borda;
    for (let passo = 0; passo <= 10; passo++) {
     cor = passo === 0 ? t.borda : misturar(t.borda, alvo, passo / 14);
     if (contraste(cor, fundo) >= 3.2) return cor;
    }
    return cor;
   }

   // `acento` e a cor dos elementos de ESTRUTURA (barra, faixa, quadrado de
   // inicial, listra). Medido: quando o acento era sempre t.borda, nos modos
   // solido e escuro ele coincidia com o proprio fundo do card e a silhueta
   // sumia — 43 temas viravam 5 retangulos chapados. Cada modo agora define
   // um acento que contrasta com o fundo que ele mesmo usa.
   const MODOS = {
    claro:  (t) => ({ fundo: t.bg,      linha: t.borda,   acento: t.borda,  corTitulo: t.texto,   corSub: t.texto,   canvas: "#FFFFFF", raio: 8,  fonte: 13, fonteSub: 10, fam: "'Inter',sans-serif" }),
    branco: (t) => ({ fundo: "#FFFFFF", linha: "#E2E8F0", acento: t.borda,  corTitulo: t.texto,   corSub: "#64748B", canvas: "#F8FAFC", raio: 14, fonte: 13, fonteSub: 10, fam: "'Inter',sans-serif" }),
    escuro: (t) => ({ fundo: "#111827", linha: "#1F2937", acento: acentoContrastante(t, "#111827"), corTitulo: acentoContrastante(t, "#111827"), corSub: "#94A3B8", canvas: "#020617", raio: 4,  fonte: 13, fonteSub: 10, fam: "'Inter',sans-serif" }),
    solido: (t) => ({ fundo: t.borda,   linha: t.texto,   acento: acentoContrastante(t, t.borda), corTitulo: "#FFFFFF", corSub: "#E5E7EB", canvas: "#F1F5F9", raio: 20, fonte: 13, fonteSub: 10, fam: "'Inter',sans-serif" }),
    papel:  (t) => ({ fundo: "#FBF7EF", linha: "#D9CDB6", acento: t.borda,  corTitulo: t.texto,   corSub: "#6B5E4A", canvas: "#F3ECDF", raio: 2,  fonte: 13, fonteSub: 10, fam: "Georgia,'Times New Roman',serif" })
   };

   (function gerarTemas() {
    CATALOGO.forEach((entrada) => {
     const estrutura = entrada[0];
     const modo = entrada[1];
     const rotulo = entrada[2];
     const escuro = modo === "escuro";

     designs.push({
      id: `t-${estrutura}-${modo}`,
      label: rotulo,
      background: MODOS[modo](TIPO_DESCONHECIDO).canvas,
      apply: (c) =>
       c
        // Card dimensionado pelo RANK: SECRETARIA sai maior que DIVISAO,
        // que sai maior que SETOR, que sai maior que COLABORADOR. A posicao
        // na hierarquia continua legivel mesmo quando dois ranks caem na
        // mesma linha — que e o caso de 93 pessoas no nivel 2 do arquivo.
        .nodeWidth((d) => Math.round(268 * escalaPorRank(d)))
        .nodeHeight((d) => Math.round(104 * escalaPorRank(d)))
        .childrenMargin(() => 46)
        .compactMarginBetween(() => 26)
        .compactMarginPair(() => 40)
        .neighbourMargin(() => 22)
        .siblingsMargin(() => 22)
        .buttonContent(({ node }) =>
         `<div style="border:1px solid ${escuro ? "#334155" : "#CBD5E1"};background:${escuro ? "#0F172A" : "#FFFFFF"};color:${escuro ? "#E2E8F0" : "#475569"};border-radius:6px;padding:3px 6px;font-size:10px;font-family:'Inter',sans-serif;white-space:nowrap">${node.children ? "&#9650;" : "&#9660;"} ${node.data._directSubordinates}</div>`)
        .linkUpdate(function (l) {
         d3.select(this)
          .attr("stroke", l.data._upToTheRootHighlighted ? "#DC2626" : escuro ? "#334155" : "#CBD5E1")
          .attr("stroke-width", l.data._upToTheRootHighlighted ? 4 : 1.4);
         if (l.data._upToTheRootHighlighted) d3.select(this).raise();
        })
        .nodeContent((d) => {
         const t = d.data._tipo || TIPO_DESCONHECIDO;
         const cfg = MODOS[modo](t);
         cfg.nomeCru = d.data.name || "";
         cfg.nome = escaparHtml(d.data.name);
         cfg.sub = escaparHtml(d.data.positionName);
         return `${selo(d)}
           <div style="box-sizing:border-box;width:${d.width}px;height:${d.height}px;padding-top:9px;font-family:${cfg.fam}">
            <div style="box-sizing:border-box;width:100%;height:${d.height - 9}px">${ESTRUTURAS[estrutura](d, t, cfg)}</div>
           </div>`;
        })
     });
    });
   })();

   function buildDesignMenu() {
    const select = document.getElementById("theme-select");
    if (!select) return;
    select.innerHTML = "";
    designs.forEach((design, i) => {
     const option = document.createElement("option");
     option.value = design.id;
     option.textContent = `${String(i + 1).padStart(2, "0")} · ${design.label}`;
     select.appendChild(option);

   // ------------------------- editor de cores (UI) -------------------------

   function abrirCores() {
    montarListaDeCores();
    document.getElementById("cores").hidden = false;
   }

   }

   function montarListaDeCores() {
    const lista = document.getElementById("cores-lista");
    lista.innerHTML = "";
    Object.keys(TIPOS)
     .sort((a, b) => TIPOS[a].rank - TIPOS[b].rank || a.localeCompare(b, "pt-BR"))
     .forEach((chave) => {
      const linha = document.createElement("div");

      CAMPOS_COR.forEach((campo) => {
       const entrada = document.createElement("input");
       entrada.type = "color";
       entrada.value = TIPOS[chave][campo];
       entrada.title = `${TIPOS[chave].rotulo} — ${campo}`;
       entrada.addEventListener("input", () => trocarCor(chave, campo, entrada.value));

     });

   // TIPOS[chave] e o MESMO objeto que os cards guardam em _tipo, entao mutar
   // no lugar ja atualiza quem tem a referencia; o render redesenha.
   function trocarCor(chave, campo, valor) {
    TIPOS[chave][campo] = String(valor).toUpperCase();
    gravarCores();
    repintar();
   }

   function restaurarTipo(chave) {
    CAMPOS_COR.forEach((campo) => (TIPOS[chave][campo] = CORES_PADRAO[chave][campo]));
    gravarCores();
    montarListaDeCores();
    repintar();
   }

   function restaurarTodasAsCores() {
    Object.keys(TIPOS).forEach((chave) =>
     CAMPOS_COR.forEach((campo) => (TIPOS[chave][campo] = CORES_PADRAO[chave][campo]))
    );
    gravarCores();
    montarListaDeCores();
    repintar();
    setStatus("Cores de fabrica restauradas");
   }

   // Redesenha sem perder o que estava aberto nem a selecao.
   let repintarTimer;
   function repintar() {
    clearTimeout(repintarTimer);
    repintarTimer = setTimeout(() => {
     capturarExpandidos();
     renderDesign();
     afterRender();
    }, 120);
   }

   function activeDesign() {
    return designs.find((item) => item.id === currentDesign) || designs[0];
   }

   // ----------------------------- escopo do desenho -----------------------------
   // Tipos que fazem sentido como ponto de partida: os que agrupam gente. Nao
   // entram COLABORADOR (folha) nem a propria PREFEITURA (que ja e o inteiro).
   const TIPOS_ESCOPAVEIS = [
    "SECRETARIA", "GABINETE", "CONTROLADORIA", "COORDENADORIA",
   "GUARDA", "CONSELHO", "FUNDO", "CORPO", "DIVISAO", "FUNDEB", "SETOR"
   ];

   const ROTULOS_GENERICOS_ESCOPOS = new Set([
    "COORDENADORIA",
    "ASSESSOR EXECUTIVO",
    "ASSESSOR",
    "CHEFE",
    "COMISSIONADOS"
   ]);

   function deveAparecerNoEscopo(row) {
    const tipo = classificar(row);
    if (!TIPOS_ESCOPAVEIS.includes(tipo)) return false;
    const rotulo = normalizar(rotuloLegivel(row));
    const tipoRotulo = normalizar((TIPOS[tipo] && TIPOS[tipo].rotulo) || tipo);
    if (ROTULOS_GENERICOS_ESCOPOS.has(rotulo)) return false;
    if (rotulo === tipoRotulo) return false;
    return true;
   }

   function ancestralInstitucional(row) {
    let atual = currentData.find((r) => String(r.id) === String(row.parentId || "").trim());
    const visto = new Set([String(row.id)]);
    while (atual && !visto.has(String(atual.id))) {
     visto.add(String(atual.id));
     const tipo = classificar(atual);
     if (["SECRETARIA", "GABINETE", "CONTROLADORIA"].includes(tipo)) return atual;
     atual = currentData.find((r) => String(r.id) === String(atual.parentId || "").trim());
    }
    return null;
   }

   function rotuloEscopo(row, repetidos) {
    const rotulo = rotuloLegivel(row);
    if (!repetidos.has(normalizar(rotulo))) return rotulo;
    const ancestral = ancestralInstitucional(row);
    if (!ancestral) return `${rotulo} (#${row.id})`;
    return `${rotulo} — ${rotuloLegivel(ancestral)}`;
   }

   function buildEscopoMenu() {
    const select = document.getElementById("escopo-select");
    if (!select) return;
    select.innerHTML = "";
    select.appendChild(new Option("Organograma completo", ""));

    // Agrupado por tipo: com ~250 unidades uma lista corrida e inutilizavel.
    const porTipo = new Map();
    const candidatos = [];
    for (const row of currentData) {
     const tipo = classificar(row);
     if (!deveAparecerNoEscopo(row)) continue;
     candidatos.push(row);
     if (!porTipo.has(tipo)) porTipo.set(tipo, []);
     porTipo.get(tipo).push(row);
    }
    const contagemRotulos = new Map();
    candidatos.forEach((row) => {
     const chave = normalizar(rotuloLegivel(row));
     contagemRotulos.set(chave, (contagemRotulos.get(chave) || 0) + 1);
    });
    const repetidos = new Set(
     [...contagemRotulos.entries()].filter((item) => item[1] > 1).map((item) => item[0])
    );

    for (const tipo of TIPOS_ESCOPAVEIS) {
     const linhas = porTipo.get(tipo);
     if (!linhas || !linhas.length) continue;
     const grupo = document.createElement("optgroup");
     grupo.label = `${TIPOS[tipo].rotulo} (${linhas.length})`;
     linhas
      .map((row) => ({ id: String(row.id), rotulo: rotuloEscopo(row, repetidos) }))
      .sort((a, b) => a.rotulo.localeCompare(b.rotulo, "pt-BR"))
      .forEach((item) => grupo.appendChild(new Option(item.rotulo, item.id)));
     select.appendChild(grupo);
    }

    // Escopo salvo que aponta para no inexistente nao pode travar a tela.
    if (escopoId && !select.querySelector(`option[value="${escopoId}"]`)) escopoId = null;
    select.value = escopoId || "";
   }

   // A arvore lateral escopa qualquer no, mas o seletor so lista os tipos que
   // agrupam gente. Sem isto o <select> ficava com selectedIndex -1 (nenhuma
   // opcao marcada) sempre que o escopo vinha de la.
   function garantirOpcaoDeEscopo(id) {
    const select = document.getElementById("escopo-select");
    if (!select || !id) return;
    if (select.querySelector(`option[value="${id}"]`)) return;
    const linha = currentData.find((r) => String(r.id) === String(id));
    const opcao = new Option(linha ? rotuloLegivel(linha) : `#${id}`, String(id));
    // insertBefore e nao select.add(): options[1] costuma estar DENTRO de um
    // <optgroup>, e o add() exige que a referencia seja filha direta do select.
    select.insertBefore(opcao, select.children[1] || null);
   }

   function aplicarEscopo(id) {
    if (id) garantirOpcaoDeEscopo(String(id));
    escopoId = id ? String(id) : null;
    // O que estava aberto no inteiro nao vale para o recorte, e vice-versa.
    expandidos = new Set();
    renderDesign();
    afterRender();
    salvarVisual();
    const select = document.getElementById("escopo-select");
    if (select) select.value = escopoId || "";
    if (!escopoId) return setStatus(`Organograma completo • ${currentData.length} pessoas`);
    setStatus(`Vendo a partir de: ${nodeLabel(escopoId)} • ${linhasDoGrafico().length} caixas`);
   }

   // As colunas do misc/data.csv mapeadas para os nomes usados pelos
   // exemplos do repositório (que leem sample-data/org.csv).
   // NADA aqui é classificação inventada. A versão anterior agrupava
   // "ASSESSOR" dentro de COORDENADORIA e "GUARDA/CORPO/CHEFE" dentro de
   // GABINETE, e ordenava os tipos por um ranking que eu havia arbitrado —
   // um card saía com etiqueta COORDENADORIA e nome ASSESSOR EXECUTIVO.
   // Agora as duas informações saem do próprio arquivo:
   //   • a etiqueta é a primeira palavra do rótulo, sem agrupar nada;
   //   • a cor vem da profundidade real do nó na árvore.
   // A única distinção categórica que resta é pessoa x unidade, que é real:
   // quem tem nome preenchido é colaborador.


   // Profundidade de cada id, contada a partir da raiz.
   var nivelPorId = new Map();

   function calcularNiveis() {
    nivelPorId = new Map();
    const paiDe = new Map(currentData.map((r) => [String(r.id), String(r.parentId || "").trim()]));
    for (const id of paiDe.keys()) {
     let nivel = 0;
     let atual = paiDe.get(id);
     const visto = new Set([id]);
     while (atual && paiDe.has(atual) && !visto.has(atual)) {
      visto.add(atual);
      nivel++;
      atual = paiDe.get(atual);
     }
     nivelPorId.set(id, nivel);
    }
   }

   function nivelDe(row) {
    return nivelPorId.get(String(row.id)) || 0;
   }


   // A etiqueta é a primeira palavra do rótulo, como está escrita no arquivo.


   var nomesDeUnidade = new Set();




   // Distinção por campo `type` explícito — não por name vazio.
   // Colaborador tem nome, unidade tem rótulo em position.
   // Uma unidade e quem responde por ela sao a MESMA caixa do organograma.
   // No arquivo elas vem em duas linhas: "Setor de Monitoramento e Avaliacao"
   // e, pendurado abaixo, "Anderson Nascimento" com esse mesmo texto em
   // `position`. Renderizar as duas produz 249 pares repetidos e faz o setor
   // parecer o chefe da pessoa que o ocupa.
   var titularPorUnidade = new Map();
   var idsAbsorvidos = new Set();

   // O selo do tipo e ACRESCENTADO por cima do card de cada tema, em posicao
   // absoluta. Nenhuma linha do template original e alterada: os layouts
   // continuam sendo os do repositorio, e o selo apenas se sobrepoe a eles.
   //
   // O texto do selo e o rotulo da CLASSE da taxonomia — nao mais a primeira
   // palavra fatiada da string. Se a classe nao esta na tabela, o rotulo
   // original do arquivo e preservado, sem inventar categoria.
   function etiquetaDoNo(row) {
    const chave = classificar(row);
    if (chave) return TIPOS[chave].rotulo;
    const rotulo = String(row.position || "").trim();
    return rotulo ? rotulo.toUpperCase().slice(0, 18) : "";
   }

   // Cada uma das 15 classes tem selo PROPRIO: cor de fundo, cor de texto e
   // FORMA diferentes. Duas classes nunca saem iguais na tela.
   //   escudo  PREFEITURA      canto reto + faixa dourada
   //   bloco   SECRETARIA/GABINETE/CONTROLADORIA   retangulo solido
   //   chanfro COORDENADORIA/ASSESSOR/FUNDO/CHEFE/CONSELHO/GUARDA  canto cortado
   //   faixa   DIVISAO/FUNDEB/CORPO   barra com risco lateral
   //   aba     SETOR           canto inferior arredondado
   //   pilula  COLABORADOR     vazado, totalmente arredondado
   const FORMAS_SELO = {
    escudo:  "border-radius:2px;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);padding:2px 9px 5px 9px;",
    bloco:   "border-radius:2px;",
    chanfro: "border-radius:2px;clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);",
    faixa:   "border-radius:2px;border-left-width:4px;border-left-style:solid;",
    aba:     "border-radius:2px 2px 8px 8px;",
    pilula:  "border-radius:999px;"
   };

   function selo(d) {
    const tipo = d.data._tipo || TIPO_DESCONHECIDO;
    const texto = d.data._etiqueta || "";
    if (!texto) return "";
    const forma = FORMAS_SELO[tipo.forma] || FORMAS_SELO.bloco;
    const base =
     "position:absolute;top:-9px;left:10px;z-index:5;font-family:'Inter',sans-serif;" +
     "font-size:8.5px;font-weight:700;letter-spacing:.7px;padding:2px 7px;" +
     "white-space:nowrap;pointer-events:none;line-height:1.35;" +
     `border:1px solid ${tipo.borda};background:${tipo.selo};color:${tipo.seloTexto};`;
    return `<div style="${base}${forma}">${texto}</div>`;
   }

   function nomeCompleto(row) {
    const nome = valorCampo(row, "name", "nome", "fullName", "nomeCompleto", "employeeName");
    const sobrenome = valorCampo(row, "lastName", "sobrenome", "surname", "ultimoNome");
    return [nome, sobrenome].filter(Boolean).join(" ").trim();
   }

   const TIPOS_SEM_GESTOR_EMBUTIDO = new Set(["PREFEITURA", "COLABORADOR", "COMISSIONADOS"]);
   const CARGO_GESTOR_PADRAO = {
    SECRETARIA: "Secretario",
    CONTROLADORIA: "Controlador",
    GABINETE: "Gestor",
    DIVISAO: "Diretor",
    SETOR: "Chefe",
    ASSESSOR: "Assessor Executivo",
    COORDENADORIA: "Coordenador",
    FUNDO: "Gestor",
    CHEFE: "Chefe",
    CONSELHO: "Presidente",
    GUARDA: "Comandante",
    FUNDEB: "Gestor",
    CORPO: "Comandante"
   };

   function cargoGestorDe(unidade, titular) {
    const tipo = classificar(unidade);
    const cargo = String(titular && titular.position || "").trim();
    return cargo || CARGO_GESTOR_PADRAO[tipo] || "Gestor";
   }

   function pareceGestorDaUnidade(unidade, pessoa) {
    const tipo = classificar(unidade);
    const cargo = normalizar(pessoa.position);
    const rotulo = normalizar(unidade.position);
    if (!cargo) return false;
    if (cargo === rotulo) return true;
    const esperado = normalizar(CARGO_GESTOR_PADRAO[tipo]);
    if (esperado && cargo.includes(esperado)) return true;
    if (tipo === "SECRETARIA" && cargo.includes("SECRETARI")) return true;
    if (tipo === "CONTROLADORIA" && cargo.includes("CONTROL")) return true;
    if (tipo === "DIVISAO" && cargo.includes("DIRETOR")) return true;
    if (tipo === "SETOR" && cargo.includes("CHEFE")) return true;
    if (tipo === "COORDENADORIA" && cargo.includes("COORDEN")) return true;
    if (tipo === "ASSESSOR" && cargo.includes("ASSESSOR")) return true;
    return false;
   }

   function gestorDaUnidade(unidade, filhosDiretos) {
    const tipo = classificar(unidade);
    if (TIPOS_SEM_GESTOR_EMBUTIDO.has(tipo)) return null;
    const colaboradores = filhosDiretos.filter((filho) => ehColaborador(filho));
    if (!colaboradores.length) return null;
    const porCargo = colaboradores.filter((pessoa) => pareceGestorDaUnidade(unidade, pessoa));
    if (porCargo.length === 1) return porCargo[0];
    if (colaboradores.length === 1) return colaboradores[0];
    return null;
   }

   // Unidade e gestor nao sao a mesma entidade nos dados. Na visualizacao,
   // porem, o gestor direto pertence ao card da unidade: Secretaria + Secretario,
   // Divisao + Diretor, Setor + Chefe. Isso evita desenhar a pessoa como se
   // fosse um departamento irmao.
   function mapearTitulares() {
    titularPorUnidade = new Map();
    idsAbsorvidos = new Set();
    const filhosPorPai = new Map();
    for (const row of currentData) {
     const pai = String(row.parentId || "").trim();
     if (!filhosPorPai.has(pai)) filhosPorPai.set(pai, []);
     filhosPorPai.get(pai).push(row);
    }
    for (const unidade of currentData) {
     if (!ehUnidade(unidade)) continue;
     const titular = gestorDaUnidade(unidade, filhosPorPai.get(String(unidade.id)) || []);
     if (!titular) continue;
     titularPorUnidade.set(String(unidade.id), titular);
     idsAbsorvidos.add(String(titular.id));
    }
   }

   function repeteRotuloDoPai(row) {
    const pai = currentData.find((r) => String(r.id) === String(row.parentId || "").trim());
    if (!pai) return false;
    return (
     String(row.position || "").trim().toUpperCase() ===
     String(pai.position || "").trim().toUpperCase()
    );
   }

   function titularDe(row) {
    return titularPorUnidade.get(String(row.id)) || null;
   }

   // Quem foi absorvido some como card, mas os subordinados dele nao podem
   // sumir junto: passam a responder direto a unidade.
   // Irmaos saem ORDENADOS POR RANK: sob uma SECRETARIA vem primeiro
   // COORDENADORIA e ASSESSOR (rank 2), depois DIVISAO (3), depois SETOR (4)
   // e por ultimo COLABORADOR (5). Medido no arquivo: no nivel 2 havia 93
   // pessoas embaralhadas entre 16 coordenadorias, 15 assessorias e 23
   // divisoes, e a linha lia como se pessoa e orgao fossem pares.
   //
   // Isto muda apenas a ORDEM DE DESENHO. Nenhum parentId e alterado: a
   // arvore do arquivo continua exatamente a mesma.
   // Devolve so a subarvore de escopoId, com ela promovida a raiz (parentId
   // vazio). Precisa rodar DEPOIS da absorcao de titulares, senao o no
   // escolhido pode ter sido reparentado e a busca por filhos erra.
   function recortarEscopo(linhas) {
    if (!escopoId) return linhas;
    const alvo = linhas.find((r) => String(r.id) === String(escopoId));
    // Escopo apontando para no removido/absorvido: volta ao inteiro em vez de
    // desenhar vazio.
    if (!alvo) {
     escopoId = null;
     return linhas;
    }
    const filhosDe = new Map();
    for (const row of linhas) {
     const pai = String(row.parentId || "").trim();
     if (!filhosDe.has(pai)) filhosDe.set(pai, []);
     filhosDe.get(pai).push(row);
    }
    const dentro = [];
    const fila = [alvo];
    while (fila.length) {
     const atual = fila.shift();
     dentro.push(atual);
     for (const filho of filhosDe.get(String(atual.id)) || []) fila.push(filho);
    }
    return dentro.map((row) =>
     String(row.id) === String(alvo.id) ? Object.assign({}, row, { parentId: "" }) : row
    );
   }

   function linhasEstruturais(recortar) {
    const paiDe = new Map();
    for (const [idUnidade, titular] of titularPorUnidade) {
     paiDe.set(String(titular.id), idUnidade);
    }
    let linhas = currentData
     .filter((row) => !idsAbsorvidos.has(String(row.id)))
     .map((row) => {
      const novoPai = paiDe.get(String(row.parentId || "").trim());
      return novoPai ? Object.assign({}, row, { parentId: novoPai }) : row;
     });

    if (recortar) linhas = recortarEscopo(linhas);

    return linhas.sort((a, b) => {
     const pa = String(a.parentId || "").trim();
     const pb = String(b.parentId || "").trim();
     if (pa !== pb) return 0;
     const ra = rankDe(a);
     const rb = rankDe(b);
     if (ra !== rb) return ra - rb;
     return rotuloLegivel(a).localeCompare(rotuloLegivel(b), "pt-BR");
    });
   }

   function linhasDoGrafico() {
    return linhasEstruturais(true);
   }

   // Mantida porque mapearTitulares/linhasDoGrafico dependem dela, mas agora
   // e DERIVADA da taxonomia em vez de ser a classificacao. Ela responde
   // apenas "isto ocupa uma caixa de unidade?" — a classe real de cada no
   // vem de classificar()/tipoDe(), que distingue as 15.
   function ehUnidade(row) {
    return !ehColaborador(row);
   }

   // Era um TERCEIRO classificador, com baldes proprios em minusculas
   // ("unidade", "gabinete"...), concorrendo com classificar() e com
   // ehUnidade(). Tres verdades diferentes sobre a mesma linha. Agora ha
   // uma so: a taxonomia. A funcao continua existindo e responde o mesmo
   // formato de antes, mas derivado de classificar().
   function tipoUnidade(row) {
    const chave = classificar(row);
    if (!chave || chave === "COLABORADOR") return "unidade";
    return chave.toLowerCase();
   }


   // Em caixa de unidade o department_name é sempre a secretaria de cima, que a
   // própria árvore já mostra — e truncado ("SECRETARIA MUNICIPAL DE ASSISTÊ…")
   // não informa nada. O subtítulo fica reservado para cargo de pessoa.
   function toChartRow(row) {
    const linha = normalizarLinha(row);
    const titular = titularDe(linha);
    const pessoa = nomeCompleto(linha);
    const cargo = valorCampo(linha, "position", "cargo", "titulo", "title");
    const tipo = tipoDe(linha);
    const imagem = valorCampo(linha, "image", "imageUrl", "foto", "photo", "avatar", "imagem") || "";
    return Object.assign({}, linha, {
     id: linha.id,
     parentId: linha.parentId,
     // Caixa de unidade: o nome e o rotulo dela e a segunda linha e quem
     // responde por ela. Caixa de pessoa sem unidade propria: nome e cargo.
     name: pessoa || cargo || `#${linha.id}`,
     // 54 unidades tem mais de um ocupante com o mesmo rotulo (dois nomes no
     // mesmo setor). O primeiro encabeca a caixa da unidade; repetir o nome
     // dela no subtitulo dos outros so duplica o que a arvore ja mostra.
     positionName: pessoa
      ? repeteRotuloDoPai(linha)
        ? ""
        : cargo || ""
      : titular
      ? `${cargoGestorDe(linha, titular)}: ${nomeCompleto(titular)}`
      : "",
     // Os cards originais leem `position` direto; sem espelhar aqui, a unidade
     // aparece com o proprio nome repetido na segunda linha.
     _etiqueta: etiquetaDoNo(linha),
     _souUnidade: !pessoa,
     _tipo: tipo,
     _tipoNome: classificar(linha) || "UNIDADE",
     position: pessoa
      ? repeteRotuloDoPai(linha)
        ? ""
        : cargo || ""
      : titular
      ? `${cargoGestorDe(linha, titular)}: ${nomeCompleto(titular)}`
      : "",
     image: imagem,
     imageUrl: imagem,
     _gestorId: titular ? titular.id : "",
     _gestorNome: titular ? nomeCompleto(titular) : "",
     _gestorCargo: titular ? cargoGestorDe(linha, titular) : "",
     area: valorCampo(linha, "department_name", "department", "departamento", "departmentName") || "",
     office: valorCampo(linha, "location_state", "location", "estado", "locationState") || valorCampo(linha, "department_name", "department", "departamento", "departmentName") || "",
     email: valorCampo((titular || linha), "email", "mail", "emailCorporativo") || ""
    });
   }

   function chartHeight() {
    const el = document.querySelector(".chart-container");
    const rect = el ? el.getBoundingClientRect() : { height: 600 };
    // Piso de 800 aqui era o motivo do organograma sair cortado: numa janela
    // normal o container tem ~480px, o SVG virava 800 e o overflow:hidden do
    // .chart-container comia o resto. Pior, o fit() encaixava a arvore num
    // canvas de 800 que ninguem via inteiro. O piso agora so evita medir
    // altura zero enquanto o layout ainda nao assentou.
    return Math.max(240, Math.round(rect.height || 600));
   }

   function refreshChart() {
    if (!chart) return;
    chart.svgHeight(chartHeight()).render(); fitLegivel();
    setTimeout(afterRender, 100);
   }

   function attachEmailOverlay() {
    const nodes = document.querySelectorAll(".chart-container g.node");
    nodes.forEach((node) => {
     const inner = node.querySelector(".node-foreign-object-div");
     if (!inner || inner.querySelector(".orgchart-email-overlay")) return;
     const idMatch = (node.textContent || "").match(/#\s*(\d+)/);
     if (!idMatch) return;
     const nodeId = idMatch[1];
     const row = currentData.find((r) => String(r.id) === String(nodeId));
     if (!row) return;
     // "sem e-mail" em toda caixa de secretaria é ruído: unidade não tem
     // e-mail pessoal. O selo só aparece quando existe endereço de verdade.
     if (!row.email) return;
     const overlay = document.createElement("div");
     overlay.className = "orgchart-email-overlay";
     overlay.textContent = `✉ ${row.email}`;
     overlay.style.position = "absolute";
     overlay.style.right = "6px";
     overlay.style.bottom = "6px";
     overlay.style.padding = "2px 6px";
     overlay.style.borderRadius = "10px";
     overlay.style.background = "rgba(15,23,42,.78)";
     overlay.style.color = "#fff";
     overlay.style.font = "9px 'Inter','Helvetica',sans-serif";
     overlay.style.pointerEvents = "none";
     overlay.style.maxWidth = "200px";
     overlay.style.overflow = "hidden";
     overlay.style.textOverflow = "ellipsis";
     overlay.style.whiteSpace = "nowrap";
     overlay.style.zIndex = "5";
     inner.style.position = "relative";
     inner.appendChild(overlay);
    });
   }

   // Desenha o contorno no card selecionado. Sem isso não há como saber em
   // quem as ações da toolbar vão agir.
   function applySelectionStyle() {
    document.querySelectorAll(".chart-container g.node").forEach((node) => {
     const inner = node.querySelector(".node-foreign-object-div");
     if (!inner) return;
     const id = nodeIdFromElement(node);
     const isSelected = id !== null && String(id) === String(selectedNodeId);
     inner.style.outline = isSelected ? "3px solid #1565C0" : "";
     inner.style.outlineOffset = isSelected ? "2px" : "";
     inner.style.borderRadius = isSelected ? "12px" : "";
    });
   }

   function nodeIdFromElement(node) {
    const datum = d3.select(node).datum();
    if (datum && datum.data && datum.data.id !== undefined) return datum.data.id;
    const match = (node.textContent || "").match(/#\s*([\w-]+)/);
    return match ? match[1] : null;
   }

   function selectNode(id) {
    selectedNodeId = id === null || id === undefined ? null : String(id);
    applySelectionStyle();
    enviarSelecaoAoSidebar();
   }

   // Abaixo deste zoom o nome e o cargo no card viram borrão. Quando a árvore
   // é larga demais para caber inteira, é melhor cortar e deixar o usuário
   // navegar do que mostrar tudo ilegível.
   const ZOOM_MINIMO = 0.5;

   function fitLegivel(ancorarEm) {
    if (!chart) return;
    // O fit da lib encaixa a árvore inteira na tela. Com muitos irmãos isso
    // encolhe o card até o nome sumir, então ele só vale enquanto o resultado
    // continuar legível; abaixo disso enquadramos um nó e o usuário navega.
    chart.fit();
    setTimeout(() => {
     // `svg` e `zoomBehavior` entram no state depois do constructor, então não
     // ganham getter na instância — só dá para lê-los pelo state.
     const state = chart.getChartState();
     if (!state.svg || !state.zoomBehavior || !state.allNodes) return;
     if (state.lastTransform && state.lastTransform.k >= ZOOM_MINIMO) return;

     const alvo =
      state.allNodes.find((n) => String(n.data.id) === String(ancorarEm)) ||
      state.allNodes.find((n) => String(n.data.id) === String(rootId()));
     if (!alvo) return;

     // Depois do fit o center-group está zerado, então as coordenadas do nó
     // já estão no mesmo espaço em que o zoom é aplicado.
     const k = ZOOM_MINIMO;
     const x = state.svgWidth / 2 - alvo.x * k;
     const y = 60 - alvo.y * k;
     state.svg
      .transition()
      .duration(400)
      .call(state.zoomBehavior.transform, d3.zoomIdentity.translate(x, y).scale(k));
    }, 550);
   }

   function afterRender() {
    requestAnimationFrame(() => {
     attachEmailOverlay();
     attachCardShortcuts();
     applySelectionStyle();
    });
   }

   function attachCardShortcuts() {
    if (READ_ONLY_MODE) return;
    document.querySelectorAll(".chart-container g.node").forEach((node) => {
     if (node.dataset.shortcutsReady) return;
     node.dataset.shortcutsReady = "1";
     node.addEventListener("dblclick", (event) => {
      event.stopPropagation();
      const id = nodeIdFromElement(node);
      if (id === null) return;
      selectNode(id);
      abrirEditor(id);
     });
    });
   }

   function renderDesign() {
    mapearTitulares();
    calcularNiveis();
    const design = activeDesign();
    const container = document.querySelector(".chart-container");
    container.innerHTML = "";
    container.style.backgroundColor = design.background;

    let rows = linhasDoGrafico().map(toChartRow);
    if (design.prepare) rows = design.prepare(rows);

    chart = new d3.OrgChart()
     .container(".chart-container")
     .svgHeight(chartHeight())
     .data(rows)
     // Um organograma mostra a equipe inteira. Esconder subordinados atrás de
     // um "Show next N nodes" faz o gestor parecer ter menos gente do que tem.
     .minPagingVisibleNodes((d) => Number.MAX_SAFE_INTEGER)
     .pagingStep((d) => Number.MAX_SAFE_INTEGER)
     .onNodeClick((d) => {
      selectNode(d.data.id);
      salvarVisual();
      setStatus(`Selecionado: ${nodeLabel(d.data.id)}`);
     })
     .onExpandOrCollapse(() => {
      requestAnimationFrame(() => {
       fitLegivel();
       afterRender();
       capturarExpandidos();
       salvarVisual();
      });
     });

    design.apply(chart);
    chart.layout(layoutAtual);
    alturaDesenhada = chartHeight();
    chart.render(); fitLegivel();
    setTimeout(afterRender, 50);
    setTimeout(afterRender, 250);
    if (design.after) design.after(chart);
    enviarDadosAoSidebar();
   }

   // --------------------------- painel da árvore ---------------------------
   // O painel roda num iframe: a única conversa entre os dois lados é esta
   // função (dados para dentro) e as chamadas a window.parent.* lá de dentro.

   function janelaDoSidebar() {
    const quadro = document.querySelector("#sidebar iframe");
    return quadro && quadro.contentWindow;
   }

   function enviarDadosAoSidebar() {
    const janela = janelaDoSidebar();
    if (janela && janela.setSidebarData) janela.setSidebarData(linhasEstruturais(false).map(toChartRow));
    enviarTemaAoSidebar();
   }

   function enviarSelecaoAoSidebar() {
    const janela = janelaDoSidebar();
    if (janela && janela.setSidebarSelection) janela.setSidebarSelection(selectedNodeId);
   }

   function enviarTemaAoSidebar() {
    const janela = janelaDoSidebar();
    if (janela && janela.setSidebarTheme) janela.setSidebarTheme(appThemeMode);
   }

   // Recolher é do lado de fora: o botão vive dentro do iframe, mas quem tem
   // de encolher é o <aside> que reserva a coluna de 320px nesta página.
   function toggleSidebarPanel() {
    const sidebar = document.getElementById("sidebar");
    const recolhido = sidebar.classList.toggle("collapsed");
    if (recolhido) {
     sidebar.style.flexBasis = "48px";
     sidebar.style.width = "48px";
    } else {
     try {
      aplicarLarguraSidebar(localStorage.getItem(CHAVE_SIDEBAR_LARGURA) || 320);
     } catch (erro) {
      aplicarLarguraSidebar(320);
     }
    }
   }

   const CHAVE_SIDEBAR_LARGURA = "organograma:sidebarLargura";

   function aplicarLarguraSidebar(largura) {
    const sidebar = document.getElementById("sidebar");
    if (!sidebar || !largura) return;
    const limite = Math.min(Math.max(Number(largura), 260), Math.min(560, window.innerWidth - 180));
    sidebar.style.flexBasis = `${limite}px`;
    sidebar.style.width = `${limite}px`;
   }

   function iniciarResizeSidebar() {
    const sidebar = document.getElementById("sidebar");
    const handle = document.getElementById("sidebar-resizer");
    if (!sidebar || !handle) return;
    try {
     aplicarLarguraSidebar(localStorage.getItem(CHAVE_SIDEBAR_LARGURA));
    } catch (erro) {}
    handle.addEventListener("pointerdown", (event) => {
     if (sidebar.classList.contains("collapsed")) return;
     event.preventDefault();
     handle.setPointerCapture(event.pointerId);
     document.body.classList.add("is-resizing-sidebar");
     const mover = (moveEvent) => {
      const largura = moveEvent.clientX;
      aplicarLarguraSidebar(largura);
     };
     const soltar = () => {
      document.body.classList.remove("is-resizing-sidebar");
      handle.removeEventListener("pointermove", mover);
      handle.removeEventListener("pointerup", soltar);
      handle.removeEventListener("pointercancel", soltar);
      try {
       localStorage.setItem(CHAVE_SIDEBAR_LARGURA, String(Math.round(sidebar.getBoundingClientRect().width)));
      } catch (erro) {}
     };
     handle.addEventListener("pointermove", mover);
     handle.addEventListener("pointerup", soltar);
     handle.addEventListener("pointercancel", soltar);
    });
   }

   // --------------------------- persistência local ---------------------------
   // Sem isto, adicionar/editar/remover é perdido no primeiro F5: a página
   // sempre recarregava o CSV do servidor e jogava fora o trabalho.

   const CHAVE_VISUAL = "organograma:visual";

   // Tema, layout, o que está aberto e o card selecionado. Sem guardar isto,
   // escolher um tema, expandir a árvore e trocar o layout era tudo perdido no
   // primeiro F5, mesmo com os dados intactos.
   var expandidos = new Set();
   var layoutAtual = "top";
   var appThemeMode = "light";
   const LAYOUTS = ["top", "right", "bottom", "left"];

   function aplicarTemaVisual() {
    document.body.dataset.theme = appThemeMode;
    const botao = document.getElementById("theme-mode-toggle");
    if (botao) {
     const escuro = appThemeMode === "dark";
     botao.innerHTML = escuro
      ? '<i class="fas fa-sun"></i> Light'
      : '<i class="fas fa-moon"></i> Dark';
     botao.title = escuro ? "Alternar para modo claro" : "Alternar para modo escuro";
    }
    enviarTemaAoSidebar();
   }

   function toggleThemeMode() {
    appThemeMode = appThemeMode === "dark" ? "light" : "dark";
    aplicarTemaVisual();
    salvarVisual();
    setStatus(appThemeMode === "dark" ? "Modo escuro ativado" : "Modo claro ativado");
   }

   // Garante que o nó esteja visível ABRINDO o caminho até ele — sem fechar
   // nada. A versão anterior substituía a lista de nós abertos por esse
   // caminho, então adicionar uma pessoa fechava todos os ramos que o usuário
   // tinha aberto: 50 cards na tela viravam 26 sem ninguém pedir.
   function focarCaminho(id) {
    let atual = currentData.find((r) => String(r.id) === String(id));
    const visto = new Set();
    while (atual && !visto.has(String(atual.id))) {
     visto.add(String(atual.id));
     expandidos.add(String(atual.id));
     atual = currentData.find((r) => String(r.id) === String(atual.parentId));
    }
   }

   function capturarExpandidos() {
    if (!chart) return;
    const state = chart.getChartState();
    if (!state.root) return;
    // allNodes traz a árvore inteira, inclusive o que está recolhido — salvar
    // aquilo reabria tudo no F5. Visível é só quem tem o caminho aberto até a
    // raiz, e a lib marca isso movendo os filhos entre .children e ._children.
    const visiveis = new Set();
    const percorrer = (no) => {
     visiveis.add(String(no.data.id));
     if (no.children) no.children.forEach(percorrer);
    };
    percorrer(state.root);
    expandidos = visiveis;
   }

   function salvarVisual() {
    try {
     localStorage.setItem(
      CHAVE_VISUAL,
      JSON.stringify({
       tema: currentDesign,
       layout: layoutAtual,
       modo: appThemeMode,
       expandidos: [...expandidos],
       selecionado: selectedNodeId,
       escopo: escopoId
      })
     );
    } catch (erro) {}
   }

   function aplicarVisualSalvo() {
    let visual = null;
    try {
     visual = JSON.parse(localStorage.getItem(CHAVE_VISUAL) || "null");
    } catch (erro) {}
    if (!visual) return;
    if (designs.some((d) => d.id === visual.tema)) currentDesign = visual.tema;
    if (LAYOUTS.includes(visual.layout)) layoutAtual = visual.layout;
    if (visual.modo === "dark" || visual.modo === "light") appThemeMode = visual.modo;
    if (Array.isArray(visual.expandidos)) expandidos = new Set(visual.expandidos.map(String));
    if (visual.selecionado) selectedNodeId = String(visual.selecionado);
    if (visual.escopo) escopoId = String(visual.escopo);
   }

   var versaoServidor = null;
   var gravando = false;
   var gravarDeNovo = false;

   // Os dados ficam no servidor, num arquivo JSON. O que continua no navegador
   // é só a preferência visual de cada pessoa (tema, layout, o que está aberto),
   // que não faz sentido impor aos outros.
   async function salvarNoServidor() {
    if (gravando) {
     gravarDeNovo = true;
     return;
    }
    gravando = true;
    try {
     const resposta = await fetch("api/organograma", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ versao: versaoServidor, linhas: currentData })
     });
     const corpo = await resposta.json();

     if (resposta.status === 409) {
      // Alguém salvou enquanto esta aba estava aberta. Trocar para a versão
      // do servidor é menos ruim do que apagar o trabalho da outra pessoa.
      versaoServidor = corpo.versao;
      currentData = corpo.linhas;
      selectNode(null);
      renderDesign();
      afterRender();
      marcarAlterado(true);
      setStatus(
       `${corpo.erro}. A tela foi atualizada com a versão do servidor — refaça sua alteração.`,
       true
      );
      return;
     }

     if (!resposta.ok) {
      setStatus(
       `Não foi possível salvar no servidor: ${corpo.erro || resposta.status}. Exporte o CSV para não perder o trabalho.`,
       true
      );
      return;
     }

     versaoServidor = corpo.versao;
     marcarAlterado(true);
    } catch (erro) {
     setStatus(
      "Sem conexão com o servidor — a alteração não foi salva. Exporte o CSV para não perder o trabalho.",
      true
     );
    } finally {
     gravando = false;
     if (gravarDeNovo) {
      gravarDeNovo = false;
      salvarNoServidor();
     }
    }
   }

   async function carregarDoServidor() {
    const resposta = await fetch("api/organograma", { cache: "no-store" });
    if (!resposta.ok) throw new Error("servidor indisponível");
    const corpo = await resposta.json();
    if (!corpo.existe) return null;
    versaoServidor = corpo.versao;
    return corpo.linhas;
   }

   async function descartarLocal() {
    if (
     !confirm(
      "Descartar as alterações salvas no servidor e voltar ao organograma original?\n\nIsto afeta todo mundo que abrir esta página."
     )
    )
     return;
    try {
     const resposta = await fetch("api/organograma", { method: "DELETE" });
     if (!resposta.ok) throw new Error();
     location.reload();
    } catch (erro) {
     setStatus("Não foi possível descartar as alterações no servidor", true);
    }
   }

   function marcarAlterado(alterado) {
    const btn = document.getElementById("btn-descartar");
    if (btn) btn.hidden = !alterado;
   }

   function iniciar(linhas, mensagem) {
   currentData = linhas;
   aplicarVisualSalvo();
    aplicarTemaVisual();
    if (selectedNodeId && !nodeExists(selectedNodeId)) selectedNodeId = null;
    buildDesignMenu();
    buildEscopoMenu();
    renderDesign();
    afterRender();
    setStatus(mensagem);
   }

   (async () => {
    if (READ_ONLY_MODE) {
      const toolbar = document.querySelector(".toolbar");
      if (toolbar) toolbar.remove();
      const sidebar = document.getElementById("sidebar");
      if (sidebar) sidebar.remove();
      const editor = document.getElementById("editor");
      if (editor) editor.remove();
      const colors = document.getElementById("cores");
      if (colors) colors.remove();
      document.addEventListener("contextmenu", (event) => event.preventDefault(), { passive: false });
    }

    try {
     const salvas = await carregarDoServidor();
     if (salvas) {
      marcarAlterado(true);
      iniciar(salvas, `${salvas.length} pessoas • carregado do servidor`);
      return;
     }
    } catch (erro) {
     setStatus("Servidor fora do ar — abrindo o organograma original, sem salvar", true);
    }
    const originais = await d3.csv("misc/data.csv");
    iniciar(
     originais,
     READ_ONLY_MODE
      ? `Pronto • ${originais.length} pessoas • visualização somente leitura`
      : `Pronto • ${originais.length} pessoas • clique em um card para selecioná-lo`
    );
   })();

   // ------------------------- ações da toolbar -------------------------

   function rootId() {
    const ids = new Set(currentData.map((row) => String(row.id)));
    const root = currentData.find(
     (row) => !String(row.parentId || "").trim() || !ids.has(String(row.parentId))
    );
    return root ? String(root.id) : null;
   }

   function nodeExists(id) {
    return currentData.some((row) => String(row.id) === String(id));
   }

   function pushUndo() {
    undoStack.push(JSON.stringify(currentData));
    if (undoStack.length > 25) undoStack.shift();
   }

   function undoLast() {
    if (!undoStack.length) return setStatus("Nada para desfazer", true);
    const previous = JSON.parse(undoStack.pop());
    if (!Array.isArray(previous)) return setStatus("Histórico corrompido", true);
    currentData = previous;
    selectNode(
     currentData.some((row) => String(row.id) === String(selectedNodeId))
      ? selectedNodeId
      : null
    );
    salvarNoServidor();
    renderDesign();
    fitLegivel();
    afterRender();
    setStatus(`Última alteração desfeita (${currentData.length} pessoas)`);
   }

   // Só devolve um nó se o usuário realmente clicou em um. Sem palpite:
   // toda ação da toolbar age no que está selecionado ou em nada.

   function nodeLabel(id) {
    const row = currentData.find((r) => String(r.id) === String(id));
    if (!row) return `#${id}`;
    // Era tituloDe(), que nao existe: qualquer chamada lancava
    // ReferenceError e derrubava abrirEditor() inteiro.
    const titulo = rotuloLegivel(row);
    const complemento = ehUnidade(row) ? "" : row.position ? " — " + row.position : "";
    return `#${id} • ${titulo}${complemento}`;

    const id = proximoId();

   // ----------------------------- editor de card -----------------------------

   var editandoId = null;
   const CAMPOS_EDITAVEIS = ["name", "lastName", "position", "email", "department_name", "image"];

   function abrirEditor(id) {
    if (READ_ONLY_MODE) return;
    const alvo = id !== undefined && id !== null ? String(id) : requireSelection("editar");
    if (!alvo) return;
    const row = currentData.find((r) => String(r.id) === String(alvo));
    if (!row) return setStatus("Colaborador não encontrado", true);

    editandoId = String(alvo);
    const campos = {
      name: row.name || "",
      lastName: row.lastName || "",
      position: row.position || "",
      email: row.email || "",
      department_name: row.department_name || "",
      image: row.image || row.imageUrl || ""
    };
    Object.entries(campos).forEach(([campo, valor]) => {
     document.getElementById("ed-" + campo).value = valor;
    });
    montarSelectTipo(row);
    atualizarPreview(campos.image);
    montarSelectChefe(editandoId, row.parentId);
    document.getElementById("ed-erro").textContent = "";
    document.getElementById("editor-titulo").textContent =
     novoNoPendente && String(novoNoPendente) === String(alvo) ? "Novo nó" : "Editar nó";
    document.getElementById("editor").hidden = false;
    document.getElementById("ed-name").focus();
    setStatus(`Editando ${nodeLabel(editandoId)}`);
   }

   // O editor nao tinha campo de tipo: qualquer no criado ou editado saia
   // classificado pelo texto do cargo, e nao havia como cadastrar uma
   // SECRETARIA, uma DIVISAO ou um SETOR pela interface — so COLABORADOR.
   function montarSelectTipo(row) {
    const select = document.getElementById("ed-type");
    const atual = classificar(row);
    select.innerHTML = "";
    Object.keys(TIPOS)
     .sort((a, b) => TIPOS[a].rank - TIPOS[b].rank || a.localeCompare(b, "pt-BR"))
     .forEach((chave) => {
      select.appendChild(
       new Option(`${TIPOS[chave].rotulo}  (nivel ${TIPOS[chave].rank})`, chave)
      );
     });
    select.value = atual || "COLABORADOR";
   }

   // Cancelar um no recem-criado tem que desfazer a criacao, senao fica uma
   // linha em branco na arvore.
   function fecharEditor() {
    if (novoNoPendente) {
     const alvo = String(novoNoPendente);
     novoNoPendente = null;
     currentData = currentData.filter((r) => String(r.id) !== alvo);
     selectNode(null);
     renderDesign();
     afterRender();
     setStatus("Criação cancelada");
    }
    document.getElementById("editor").hidden = true;
    editandoId = null;
   }

   // A raiz não tem chefe, e ninguém pode responder a um subordinado seu —
   // isso quebraria a árvore em um ciclo e o organograma sumiria da tela.
   function montarSelectChefe(id, parentIdAtual) {
    const select = document.getElementById("ed-parentId");
    const proibidos = descendantsOf(id);
    const ehRaiz = String(id) === String(rootId());
    select.innerHTML = "";
    select.disabled = ehRaiz;

    if (ehRaiz) {
     select.appendChild(new Option("— é a raiz do organograma —", ""));
     select.value = "";
     return;
    }

    // Ordenava por `${name} ${lastName}`, que e vazio nas 299 unidades do
    // arquivo: todas empatavam em "" e saiam listadas como "#123". E oferecia
    // COLABORADOR como chefe possivel, o que cria pessoa chefiando orgao.
    currentData
     .filter((row) => !proibidos.has(String(row.id)))
     .filter((row) => !ehColaborador(row))
     .map((row) => ({ row: row, tipo: tipoDe(row), rotulo: rotuloLegivel(row) }))
     .sort((a, b) =>
      a.tipo.rank !== b.tipo.rank
       ? a.tipo.rank - b.tipo.rank
       : a.rotulo.localeCompare(b.rotulo, "pt-BR")
     )
     .forEach((item) => {
      select.appendChild(new Option(`${item.tipo.rotulo} · ${item.rotulo}`, item.row.id));
     });
    select.value = String(parentIdAtual || "");
   }

   function atualizarPreview(src) {
    const img = document.getElementById("ed-preview");
