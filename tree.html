<!DOCTYPE html>

<html>
 <head>
  <meta charset="UTF-8" />
  <title>OrgChart</title>
  <link rel="shortcut icon" type="image/x-icon" href="misc/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 </head>

 <body>
  <!----------------   ORG CHART NON ESSENTIAL CONTENT ------------>
  <script src="build/vendor/html2canvas.js"></script>
  <script src="build/vendor/jspdf.umd.min.js"></script>
  <link href="build/simptip.min.css" rel="stylesheet" />

  <style>
   [data-tooltip]:focus:after {
    display: none;
    border-bottom-color: none !important;
   }

   [data-tooltip]:focus:before {
    display: none;
    border-bottom-color: none !important;
   }

   [data-tooltip]:after {
    height: auto !important;
    padding: 11px 11px 11px 11px !important;
    content: attr(data-tooltip);
    white-space: pre;
    line-height: 16px !important;
    text-align: left !important;
   }
  </style>

  <link href="build/app.css" rel="stylesheet" />

  <div class="toolbar">
   <div class="toolbar__brand">
    <i class="fas fa-sitemap"></i>
    Organograma
   </div>

   <label class="file-upload">
    <span class="file-upload__label">
     <i class="fas fa-file-csv"></i>
     Carregar CSV + fotos
    </span>
    <input
     type="file"
     id="csv-input"
     accept=".csv,text/csv,.json,application/json,image/*"
     multiple
     title="Selecione o CSV e as fotos juntos (Ctrl+A na pasta)"
    />
   </label>

   <a
    class="btn file-upload__label"
    href="misc/modelo-organograma.csv"
    download="modelo-organograma.csv"
    title="Baixar modelo de CSV/JSON"
   >
    <i class="fas fa-download"></i> Modelo
   </a>

   <button class="btn" onclick="downloadCsv()" title="Exportar o organograma como CSV">
    <i class="fas fa-file-export"></i> Exportar CSV
   </button>
   <button class="btn" onclick="downloadJson()" title="Exportar o organograma como JSON">
    <i class="fas fa-file-code"></i> Exportar JSON
   </button>

   <label class="theme-picker">
    <i class="fas fa-palette"></i>
    <select id="theme-select" title="Design (bumbeishvili/org-chart)"></select>
   </label>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button class="btn" onclick="chartFit()" title="Ajustar à tela">
     <i class="fas fa-expand"></i> Fit
    </button>
    <button class="btn" onclick="toggleFullscreen()" title="Tela cheia">
     <i class="fas fa-arrows-alt"></i> Full
    </button>
    <button
     class="btn"
     onclick="cycleLayout()"
     title="Trocar layout"
    >
     <i class="fas fa-exchange-alt"></i> Layout
    </button>
   </div>

   <div class="toolbar__group">
    <button class="btn" onclick="safeCall('expandAll', 'Expandir tudo')" title="Expandir tudo">
     <i class="fas fa-plus-circle"></i> Expand All
    </button>
    <button class="btn" onclick="safeCall('collapseAll', 'Recolher tudo')" title="Recolher tudo">
     <i class="fas fa-minus-circle"></i> Collapse All
    </button>
   </div>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button
     class="btn"
     onclick="safeExportImg(false)"
     title="Exportar PNG do que está visível"
    >
     <i class="fas fa-image"></i> PNG
    </button>
    <button
     class="btn"
     onclick="safeExportImg(true)"
     title="Exportar PNG do grafo completo"
    >
     <i class="far fa-images"></i> PNG Full
    </button>
    <button class="btn" onclick="safeExportSvg()" title="Exportar SVG">
     <i class="fas fa-code"></i> SVG
    </button>
    <button class="btn" onclick="downloadPdf()" title="Exportar PDF">
     <i class="fas fa-file-pdf"></i> PDF
    </button>
   </div>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button class="btn" onclick="centerFocusNode()" title="Centralizar nó">
     <i class="fas fa-crosshairs"></i> Center
    </button>
    <button class="btn" onclick="highlightFocusNode()" title="Destacar nó">
     <i class="fas fa-highlighter"></i> Highlight
    </button>
    <button
     class="btn"
     onclick="highlightPathToRoot()"
     title="Destacar caminho até a raiz"
    >
     <i class="fas fa-arrow-up"></i> To Root
    </button>
    <button
     class="btn"
     onclick="clearHighlighting()"
     title="Limpar destaques"
    >
     <i class="fas fa-eraser"></i> Clear
    </button>
    <button class="btn" onclick="undoLast()" title="Desfazer a última alteração">
     <i class="fas fa-undo"></i> Undo
    </button>
   </div>

   <div class="toolbar__group">
    <button class="btn btn--primary" onclick="addSampleNode()" title="Adicionar um subordinado ao card selecionado">
     <i class="fas fa-user-plus"></i> Add Node
    </button>
    <button
     class="btn"
     onclick="abrirEditor()"
     title="Editar o card selecionado (ou dê duplo clique no card)"
    >
     <i class="fas fa-pen"></i> Editar
    </button>
    <button
     class="btn btn--danger"
     onclick="removeSampleNode()"
     title="Remover o card selecionado e todos os subordinados dele"
    >
     <i class="fas fa-user-minus"></i> Remove
    </button>
   </div>

   <button
    class="btn btn--danger"
    id="btn-descartar"
    onclick="descartarLocal()"
    title="Descartar as alterações salvas neste navegador e voltar ao organograma original"
    hidden
   >
    <i class="fas fa-undo"></i> Descartar alterações
   </button>
  </div>

  <div class="modal" id="editor" hidden>
   <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="editor-titulo">
    <div class="modal__head">
     <h2 id="editor-titulo">Editar colaborador</h2>
     <button class="modal__x" onclick="fecharEditor()" title="Fechar" aria-label="Fechar">
      <i class="fas fa-times"></i>
     </button>
    </div>

    <div class="modal__body">
     <div class="campo-foto">
      <img id="ed-preview" alt="Foto do colaborador" />
      <div class="campo-foto__acoes">
       <label class="btn btn--primary" style="cursor:pointer">
        <i class="fas fa-upload"></i> Enviar foto
        <input type="file" id="ed-arquivo" accept="image/*" hidden />
       </label>
       <button class="btn" type="button" onclick="limparFoto()">
        <i class="fas fa-trash"></i> Remover foto
       </button>
      </div>
     </div>

     <label class="campo campo--largo">
      <span>URL da foto</span>
      <input type="text" id="ed-image" placeholder="https://… (ou use Enviar foto)" />
     </label>

     <label class="campo">
      <span>Nome <b>*</b></span>
      <input type="text" id="ed-name" />
     </label>

     <label class="campo">
      <span>Sobrenome</span>
      <input type="text" id="ed-lastName" />
     </label>

     <label class="campo campo--largo">
      <span>Cargo <b>*</b></span>
      <input type="text" id="ed-position" />
     </label>

     <label class="campo">
      <span>E-mail</span>
      <input type="text" id="ed-email" />
     </label>

     <label class="campo">
      <span>Departamento</span>
      <input type="text" id="ed-department_name" />
     </label>

     <label class="campo campo--largo">
      <span>Responde a</span>
      <select id="ed-parentId"></select>
     </label>
    </div>

    <div class="modal__pe">
     <span class="modal__erro" id="ed-erro"></span>
     <button class="btn" onclick="fecharEditor()">Cancelar</button>
     <button class="btn btn--primary" onclick="salvarEditor()">
      <i class="fas fa-check"></i> Salvar
     </button>
    </div>
   </div>
  </div>

  <div class="status-bar">
   <span class="status-bar__dot"></span>
   <span id="status-msg">Carregando…</span>
   <span class="legenda" id="legenda"></span>
  </div>

  <div class="chart-wrapper">
   <div class="chart-container"></div>
  </div>

  <div class="drop-overlay" id="drop-overlay">
   <div class="drop-overlay__content">
    <i class="fas fa-cloud-upload-alt"></i>
    Solte aqui o CSV e as fotos
   </div>
  </div>

  <!----------------  ORG CHART ESSENTIAL CONTENT ---------------->

  <script src="build/d3.v7.min.js"></script>
  <script src="build/d3-org-chart.js"></script>
  <script src="build/d3-flextree.js"></script>

  <script>
   // ---------------------------------------------------------------------
   // Os 5 designs abaixo são portes dos exemplos de github.com/bumbeishvili/
   // org-chart, adaptados para as colunas de misc/data.csv.
   //
   // Os designs "Futuristic" e "Prev version" foram removidos: ambos exibiam
   // dados que não existem no CSV — barras de progresso e percentuais
   // gerados por Math.random(), largura/altura de card aleatórias e um texto
   // institucional fixo em inglês. Num organograma de RH isso é dado falso
   // apresentado como se fosse informação da pessoa.
   // ---------------------------------------------------------------------

   var chart;
   var currentDesign = "default";
   var currentData = [];
   var selectedNodeId = null;
   var undoStack = [];

   var designs = [
    {
     id: "default",
     label: "Default",
     background: "white",
     // Porte do próprio tree.html do repositório (o nodeContent está lá
     // comentado, junto da configuração ativa de nodeWidth/nodeHeight e do
     // override de layoutBindings). Sem ele, a lib cai no nodeContent padrão,
     // que é só o placeholder "Sample Node(id=…), override using…".
     apply: (c) => {
      c.nodeHeight((d) => 104)
       .nodeWidth((d) => 222)
       .childrenMargin((d) => 50)
       .compactMarginBetween((d) => 35)
       .compactMarginPair((d) => 30)
       .neighbourMargin((a, b) => 20)
       .nodeContent(function (d, i, arr, state) {
        // Distinguir tipo só por tom de azul não funcionou: numa tarja de 5px,
        // #184f95 e #256abf são o mesmo azul a olho nu. O guia de dataviz é
        // explícito — identidade nunca pode depender só da cor. Então o tipo
        // vai ESCRITO no card, e unidade x pessoa se separam pela forma:
        // unidade tem faixa de cabeçalho preenchida, pessoa tem foto e fundo
        // branco. A cor continua ordenando os níveis, mas agora é reforço.
        const cor = d.data._cor || "#94a3b8";
        const unidade = d.data._ehUnidade;
        const titulo = d.data.name || "";
        const tinta = textoSobre(cor);

        if (unidade) {
         const corpo = titulo.length > 60 ? 11 : titulo.length > 34 ? 12 : 13.5;
         return `
          <div style="width:${d.width}px;height:${d.height}px;padding:4px 1px 0">
            <div style="font-family:'Inter',sans-serif;background:#fff;width:${d.width - 2}px;height:${d.height - 6}px;border-radius:10px;border:1px solid #E4E2E9;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column">
              <div style="background:${cor};color:${tinta};padding:4px 10px;font-size:9px;font-weight:700;letter-spacing:.7px;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto">
                <span>${d.data._rotuloTipo || ""}</span><span style="opacity:.75">#${d.data.id}</span>
              </div>
              <div style="padding:8px 12px;flex:1 1 auto;display:flex;align-items:center">
                <div style="font-size:${corpo}px;line-height:1.25;color:#0b0b0b;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${titulo}</div>
              </div>
            </div>
          </div>`;
        }

        const avatar = d.data.imageUrl
         ? `<img src="${d.data.imageUrl}" alt="" style="width:34px;height:34px;border-radius:100px;object-fit:cover;flex:0 0 auto" />`
         : `<div style="width:34px;height:34px;border-radius:100px;background:#e2e8f0;color:#64748b;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto">${d.data._sigla || ""}</div>`;
        return `
          <div style="width:${d.width}px;height:${d.height}px;padding:4px 1px 0">
            <div style="font-family:'Inter',sans-serif;background:#fff;width:${d.width - 2}px;height:${d.height - 6}px;border-radius:10px;border:1px dashed #cbd5e1;box-sizing:border-box;padding:10px 12px;display:flex;gap:10px;align-items:center;overflow:hidden;position:relative">
              <div style="position:absolute;top:5px;right:8px;font-size:9px;color:#94a3b8">#${d.data.id}</div>
              ${avatar}
              <div style="min-width:0">
                <div style="font-size:13px;line-height:1.2;color:#0b0b0b;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${titulo}</div>
                ${d.data.positionName ? `<div style="color:#52514e;font-size:10px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${d.data.positionName}</div>` : ""}
              </div>
            </div>
          </div>`;
       });

      c.layoutBindings(
       (() => {
        const layouts = c.layoutBindings();
        layouts.top.linkY = (node) => node.y + 0;
        layouts.top.linkCompactYStart = (node) => node.y + node.height / 2 + 15;
        return layouts;
       })()
      );
      return c;
     }
    },

    {
     id: "sky",
     label: "Sky",
     background: "#f6f6f6",
     apply: (c) =>
      c
       .nodeWidth((d) => 250)
       .initialZoom(0.7)
       .nodeHeight((d) => 175)
       .childrenMargin((d) => 40)
       .compactMarginBetween((d) => 15)
       .compactMarginPair((d) => 80)
       .nodeContent(function (d, i, arr, state) {
        // Unidade e colaborador sao coisas diferentes, entao sao dois cards
        // diferentes: unidade tem cabecalho preenchido com o tipo escrito;
        // pessoa tem retrato e moldura tracejada. A cor apenas ordena o nivel.
        const cor = d.data._cor, tinta = textoSobre(cor), nome = d.data.name || "";
        if (d.data._ehUnidade) {
         return `
            <div style="padding-top:12px;height:${d.height}px">
              <div style="height:${d.height - 14}px;background:#fff;border:1px solid #d6dae2;border-radius:4px;overflow:hidden;display:flex;flex-direction:column">
                <div style="background:${cor};color:${tinta};padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.8px;display:flex;justify-content:space-between">
                  <span>${d.data._rotuloTipo}</span><span style="opacity:.75">#${d.data.id}</span>
                </div>
                <div style="flex:1;display:flex;align-items:center;padding:12px 16px">
                  <div style="color:#111672;font-size:${nome.length > 44 ? 13 : 16}px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${nome}</div>
                </div>
                <div style="border-top:1px solid #eef1f5;padding:6px 16px;font-size:11px;color:#52514e">${d.data._directSubordinates} diretos, ${d.data._totalSubordinates} no total</div>
              </div>
            </div>`;
        }
        const foto = d.data.imageUrl
         ? `<img src="${d.data.imageUrl}" alt="" style="width:56px;height:56px;border-radius:100px;object-fit:cover;border:3px solid #fff" />`
         : `<div style="width:56px;height:56px;border-radius:100px;background:#e2e8f0;color:#52514e;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid #fff">${d.data._sigla}</div>`;
        return `
            <div style="padding-top:30px;height:${d.height}px">
              <div style="height:${d.height - 32}px;background:#fff;border:1px dashed #b9c2cf;border-radius:4px;text-align:center;position:relative">
                <div style="margin-top:-30px">${foto}</div>
                <div style="position:absolute;top:8px;right:10px;font-size:10px;color:#94a3b8">#${d.data.id}</div>
                <div style="padding:10px 16px">
                  <div style="color:#0b0b0b;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nome}</div>
                  <div style="color:#52514e;font-size:12px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${d.data.positionName || ""}</div>
                </div>
              </div>
            </div>`;
       })
    },

    {
     id: "circles",
     label: "Circles",
     background: "#fffeff",
     apply: (c) =>
      c
       .rootMargin(100)
       .nodeWidth((d) => 210)
       .nodeHeight((d) => 140)
       .childrenMargin((d) => 130)
       .compactMarginBetween((d) => 75)
       .compactMarginPair((d) => 80)
       .linkUpdate(function (d, i, arr) {
        d3.select(this)
         .attr("stroke", (d) =>
          d.data._upToTheRootHighlighted ? "#152785" : "lightgray"
         )
         .attr("stroke-width", (d) =>
          d.data._upToTheRootHighlighted ? 5 : 1.5
         )
         .attr("stroke-dasharray", "4,4");

        if (d.data._upToTheRootHighlighted) {
         d3.select(this).raise();
        }
       })
       .nodeContent(function (d, i, arr, state) {
        const cor = d.data._cor, tinta = textoSobre(cor), nome = d.data.name || "";
        const unidade = d.data._ehUnidade;
        const dim = 78, anel = 92;
        // Unidade: disco cheio da cor do nivel. Pessoa: retrato com aro neutro.
        const miolo = unidade
         ? `<div style="position:absolute;margin-top:-${dim / 2}px;margin-left:${d.width / 2 - dim / 2}px;width:${dim}px;height:${dim}px;border-radius:100px;background:${cor};color:${tinta};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.5px;text-align:center;padding:6px;box-sizing:border-box;line-height:1.2">${d.data._rotuloTipo.split(" / ")[0]}</div>`
         : d.data.imageUrl
         ? `<img src="${d.data.imageUrl}" alt="" style="position:absolute;margin-top:-${dim / 2}px;margin-left:${d.width / 2 - dim / 2}px;width:${dim}px;height:${dim}px;border-radius:100px;object-fit:cover" />`
         : `<div style="position:absolute;margin-top:-${dim / 2}px;margin-left:${d.width / 2 - dim / 2}px;width:${dim}px;height:${dim}px;border-radius:100px;background:#e2e8f0;color:#52514e;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700">${d.data._sigla}</div>`;
        return `
                <div style="background:#fff;position:absolute;width:${d.width}px;height:${d.height}px">
                   <div style="position:absolute;margin-top:-${anel / 2}px;margin-left:${d.width / 2 - anel / 2}px;width:${anel}px;height:${anel}px;border-radius:100px;background:${unidade ? cor : "#cbd5e1"}"></div>
                   <div style="position:absolute;margin-top:-${(anel - 8) / 2}px;margin-left:${d.width / 2 - (anel - 8) / 2}px;width:${anel - 8}px;height:${anel - 8}px;border-radius:100px;background:#fff"></div>
                   ${miolo}
                   <div style="top:${anel / 2 + 8}px;position:absolute;width:${d.width}px;text-align:center">
                      <div style="font-size:${nome.length > 34 ? 11 : 13}px;font-weight:700;color:#0b0b0b;padding:0 8px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${nome}</div>
                      <div style="font-size:10px;color:#52514e;margin-top:3px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${unidade ? d.data._rotuloTipo : d.data.positionName || ""}</div>
                   </div>
               </div>`;
       })
    },

    {
     id: "oval",
     label: "Oval",
     background: "#fffeff",
     apply: (c) =>
      c
       .nodeHeight((d) => 70)
       .nodeWidth((d) => {
        if (d.depth == 0) return 250;
        if (d.depth == 1) return 220;
        return 140;
       })
       .childrenMargin((d) => 50)
       .compactMarginBetween((d) => 35)
       .compactMarginPair((d) => 30)
       .neighbourMargin((a, b) => 20)
       .buttonContent(({ node, state }) => {
        return `<div style="border-radius:3px;padding:3px;font-size:10px;margin:auto auto;background-color:lightgray"> <span style="font-size:9px">${
         node.children
          ? `<i class="fas fa-chevron-up"></i>`
          : `<i class="fas fa-chevron-down"></i>`
        }</span> ${node.data._directSubordinates}  </div>`;
       })
       .nodeContent(function (d, i, arr, state) {
        const cor = d.data._cor, tinta = textoSobre(cor), nome = d.data.name || "";
        if (d.data._ehUnidade) {
         return `
            <div style="position:absolute;margin-top:-1px;margin-left:-1px;width:${d.width}px;height:${d.height}px;border-radius:50px;background:${cor};color:${tinta};display:flex;flex-direction:column;justify-content:center;padding:0 22px;box-sizing:border-box">
               <div style="font-size:9px;font-weight:700;letter-spacing:.8px;opacity:.85">${d.data._rotuloTipo}</div>
               <div style="font-size:${nome.length > 40 ? 11 : 13}px;font-weight:700;line-height:1.2;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${nome}</div>
            </div>`;
        }
        const foto = d.data.imageUrl
         ? `<img src="${d.data.imageUrl}" alt="" style="width:50px;height:50px;border-radius:100px;object-fit:cover;flex:0 0 auto" />`
         : `<div style="width:50px;height:50px;border-radius:100px;background:#e2e8f0;color:#52514e;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto">${d.data._sigla}</div>`;
        return `
            <div style="position:absolute;margin-top:-1px;margin-left:-1px;width:${d.width}px;height:${d.height}px;border-radius:50px;background:#fff;border:1px dashed #b9c2cf;display:flex;align-items:center;gap:10px;padding:0 16px 0 8px;box-sizing:border-box">
               ${foto}
               <div style="min-width:0">
                 <div style="color:#0b0b0b;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nome}</div>
                 <div style="color:#52514e;font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.data.positionName || ""}</div>
               </div>
            </div>`;
       })
    },

    {
     id: "clean",
     label: "Clean",
     background: "#fffeff",
     apply: (c) =>
      c
       .nodeHeight((d) => 85)
       .nodeWidth((d) => {
        return 220;
       })
       .childrenMargin((d) => 50)
       .compactMarginBetween((d) => 25)
       .compactMarginPair((d) => 50)
       .neighbourMargin((a, b) => 25)
       .siblingsMargin((d) => 25)
       .buttonContent(({ node, state }) => {
        return `<div style="px;color:#716E7B;border-radius:5px;padding:4px;font-size:10px;margin:auto auto;background-color:white;border: 1px solid #E4E2E9"> <span style="font-size:9px">${
         node.children
          ? `<i class="fas fa-angle-up"></i>`
          : `<i class="fas fa-angle-down"></i>`
        }</span> ${node.data._directSubordinates}  </div>`;
       })
       .linkUpdate(function (d, i, arr) {
        d3.select(this)
         .attr("stroke", (d) =>
          d.data._upToTheRootHighlighted ? "#152785" : "#E4E2E9"
         )
         .attr("stroke-width", (d) => (d.data._upToTheRootHighlighted ? 5 : 1));

        if (d.data._upToTheRootHighlighted) {
         d3.select(this).raise();
        }
       })
       .nodeContent(function (d, i, arr, state) {
        const cor = d.data._cor, tinta = textoSobre(cor), nome = d.data.name || "";
        if (d.data._ehUnidade) {
         return `
            <div style="font-family:'Inter',sans-serif;position:absolute;margin-top:-1px;margin-left:-1px;width:${d.width}px;height:${d.height}px;border-radius:10px;border:1px solid #E4E2E9;background:#fff;overflow:hidden;display:flex;flex-direction:column">
               <div style="background:${cor};color:${tinta};padding:5px 12px;font-size:9px;font-weight:700;letter-spacing:.7px;display:flex;justify-content:space-between">
                 <span>${d.data._rotuloTipo}</span><span style="opacity:.75">#${d.data.id}</span>
               </div>
               <div style="flex:1;display:flex;align-items:center;padding:8px 14px">
                 <div style="font-size:${nome.length > 44 ? 11.5 : 13.5}px;color:#0b0b0b;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${nome}</div>
               </div>
            </div>`;
        }
        const foto = d.data.imageUrl
         ? `<img src="${d.data.imageUrl}" alt="" style="width:36px;height:36px;border-radius:100px;object-fit:cover;flex:0 0 auto" />`
         : `<div style="width:36px;height:36px;border-radius:100px;background:#e2e8f0;color:#52514e;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto">${d.data._sigla}</div>`;
        return `
            <div style="font-family:'Inter',sans-serif;position:absolute;margin-top:-1px;margin-left:-1px;width:${d.width}px;height:${d.height}px;border-radius:10px;border:1px dashed #cbd5e1;background:#fff;padding:12px 14px;box-sizing:border-box;display:flex;gap:10px;align-items:center">
               ${foto}
               <div style="min-width:0">
                 <div style="font-size:13px;color:#0b0b0b;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nome}</div>
                 <div style="color:#52514e;font-size:10px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${d.data.positionName || ""}</div>
               </div>
            </div>`;
       })
    },

   ];

   function buildDesignMenu() {
    const select = document.getElementById("theme-select");
    designs.forEach((design, i) => {
     const option = document.createElement("option");
     option.value = design.id;
     option.textContent = `${String(i + 1).padStart(2, "0")} · ${design.label}`;
     select.appendChild(option);
    });
    select.value = currentDesign;
   }

   function activeDesign() {
    return designs.find((item) => item.id === currentDesign) || designs[0];
   }

   // As colunas do misc/data.csv mapeadas para os nomes usados pelos
   // exemplos do repositório (que leem sample-data/org.csv).
   // NADA aqui é classificação inventada. A versão anterior agrupava
   // "ASSESSOR" dentro de COORDENADORIA e "GUARDA/CORPO/CHEFE" dentro de
   // GABINETE, e ordenava os tipos por um ranking que eu havia arbitrado —
   // um card saía com etiqueta COORDENADORIA e nome ASSESSOR EXECUTIVO.
   // Agora as duas informações saem do próprio arquivo:
   //   • a etiqueta é a primeira palavra do rótulo, sem agrupar nada;
   //   • a cor vem da profundidade real do nó na árvore.
   // A única distinção categórica que resta é pessoa x unidade, que é real:
   // quem tem nome preenchido é colaborador.

   // Rampa ordinal azul 700→250, validada com scripts/validate_palette.js
   // (--ordinal, luz): matiz única, luminosidade monótona, degraus visíveis,
   // ponta clara acima de 2:1 contra a superfície.
   const RAMPA_NIVEL = ["#0d366b", "#184f95", "#256abf", "#3987e5", "#86b6ef"];
   const COR_PESSOA = "#94a3b8";

   // Profundidade de cada id, contada a partir da raiz.
   var nivelPorId = new Map();

   function calcularNiveis() {
    nivelPorId = new Map();
    const paiDe = new Map(currentData.map((r) => [String(r.id), String(r.parentId || "").trim()]));
    for (const id of paiDe.keys()) {
     let nivel = 0;
     let atual = paiDe.get(id);
     const visto = new Set([id]);
     while (atual && paiDe.has(atual) && !visto.has(atual)) {
      visto.add(atual);
      nivel++;
      atual = paiDe.get(atual);
     }
     nivelPorId.set(id, nivel);
    }
   }

   function nivelDe(row) {
    return nivelPorId.get(String(row.id)) || 0;
   }

   function corDoNivel(nivel) {
    return RAMPA_NIVEL[Math.min(nivel, RAMPA_NIVEL.length - 1)];
   }

   // A etiqueta é a primeira palavra do rótulo, como está escrita no arquivo.
   function etiquetaDe(row) {
    const rotulo = String(row.position || "").trim();
    if (!rotulo) return "";
    const primeira = rotulo.split(/[\s,/-]+/)[0].toUpperCase();
    return primeira.length > 2 ? primeira : rotulo.toUpperCase().slice(0, 14);
   }

   function textoSobre(cor) {
    const m = /^#([0-9a-f]{6})$/i.exec(cor || "");
    if (!m) return "#0b0b0b";
    const n = parseInt(m[1], 16);
    const canal = (c) => {
     const v = c / 255;
     return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    const lum =
     0.2126 * canal((n >> 16) & 255) + 0.7152 * canal((n >> 8) & 255) + 0.0722 * canal(n & 255);
    return 1.05 / (lum + 0.05) >= 4.5 ? "#ffffff" : "#0b0b0b";
   }

   function iniciaisDe(row) {
    const partes = `${row.name || ""} ${row.lastName || ""}`.trim().split(/\s+/).filter(Boolean);
    if (!partes.length) return "";
    return (partes[0][0] + (partes.length > 1 ? partes[partes.length - 1][0] : "")).toUpperCase();
   }

   function ehUnidade(row) {
    return !`${row.name || ""} ${row.lastName || ""}`.trim();
   }

   function tituloDe(row) {
    const pessoa = `${row.name || ""} ${row.lastName || ""}`.trim();
    return pessoa || row.position || `#${row.id}`;
   }

   // Em caixa de unidade o department_name é sempre a secretaria de cima, que a
   // própria árvore já mostra — e truncado ("SECRETARIA MUNICIPAL DE ASSISTÊ…")
   // não informa nada. O subtítulo fica reservado para cargo de pessoa.
   function toChartRow(row) {
    // Numa caixa de unidade o rótulo é o próprio `position`; usá-lo como
    // título evita o card sair com o nome em branco.
    const unidade = ehUnidade(row);
    return Object.assign({}, row, {
     // A lib decide o que abrir a partir desta flag. toChartRow cria objetos
     // novos a cada render, então ela precisa ser reaplicada aqui — senão o
     // que estava aberto volta a fechar.
     _expanded: expandidos.has(String(row.id)),
     id: row.id,
     parentId: row.parentId,
     name: tituloDe(row),
     positionName: unidade ? "" : row.position || "",
     _nivel: nivelDe(row),
     _cor: unidade ? corDoNivel(nivelDe(row)) : COR_PESSOA,
     _tipo: unidade ? etiquetaDe(row) : "pessoa",
     // Quando o nome da unidade JÁ é o tipo ("COORDENADORIA"), repetir a
     // etiqueta em cima do nome é ruído.
     _rotuloTipo:
      unidade && etiquetaDe(row) !== String(row.position || "").trim().toUpperCase()
       ? etiquetaDe(row)
       : "",
     _sigla: iniciaisDe(row),
     _ehUnidade: unidade,
     imageUrl: row.image || "",
     area: row.department_name || "",
     office: row.location_state || row.department_name || "",
     email: row.email || ""
    });
   }

   function chartHeight() {
    const el = document.querySelector(".chart-container");
    const rect = el ? el.getBoundingClientRect() : { height: 1100 };
    return Math.max(800, Math.round(rect.height || 1100));
   }

   function refreshChart() {
    if (!chart) return;
    chart.svgHeight(chartHeight()).render(); fitLegivel();
    setTimeout(afterRender, 100);
   }

   function attachEmailOverlay() {
    const nodes = document.querySelectorAll(".chart-container g.node");
    nodes.forEach((node) => {
     const inner = node.querySelector(".node-foreign-object-div");
     if (!inner || inner.querySelector(".orgchart-email-overlay")) return;
     const idMatch = (node.textContent || "").match(/#\s*(\d+)/);
     if (!idMatch) return;
     const nodeId = idMatch[1];
     const row = currentData.find((r) => String(r.id) === String(nodeId));
     if (!row) return;
     // "sem e-mail" em toda caixa de secretaria é ruído: unidade não tem
     // e-mail pessoal. O selo só aparece quando existe endereço de verdade.
     if (!row.email) return;
     const overlay = document.createElement("div");
     overlay.className = "orgchart-email-overlay";
     overlay.textContent = `✉ ${row.email}`;
     overlay.style.position = "absolute";
     overlay.style.right = "6px";
     overlay.style.bottom = "6px";
     overlay.style.padding = "2px 6px";
     overlay.style.borderRadius = "10px";
     overlay.style.background = "rgba(15,23,42,.78)";
     overlay.style.color = "#fff";
     overlay.style.font = "9px 'Inter','Helvetica',sans-serif";
     overlay.style.pointerEvents = "none";
     overlay.style.maxWidth = "200px";
     overlay.style.overflow = "hidden";
     overlay.style.textOverflow = "ellipsis";
     overlay.style.whiteSpace = "nowrap";
     overlay.style.zIndex = "5";
     inner.style.position = "relative";
     inner.appendChild(overlay);
    });
   }

   // Desenha o contorno no card selecionado. Sem isso não há como saber em
   // quem as ações da toolbar vão agir.
   function applySelectionStyle() {
    document.querySelectorAll(".chart-container g.node").forEach((node) => {
     const inner = node.querySelector(".node-foreign-object-div");
     if (!inner) return;
     const id = nodeIdFromElement(node);
     const isSelected = id !== null && String(id) === String(selectedNodeId);
     inner.style.outline = isSelected ? "3px solid #1565C0" : "";
     inner.style.outlineOffset = isSelected ? "2px" : "";
     inner.style.borderRadius = isSelected ? "12px" : "";
    });
   }

   function nodeIdFromElement(node) {
    const datum = d3.select(node).datum();
    if (datum && datum.data && datum.data.id !== undefined) return datum.data.id;
    const match = (node.textContent || "").match(/#\s*([\w-]+)/);
    return match ? match[1] : null;
   }

   function selectNode(id) {
    selectedNodeId = id === null || id === undefined ? null : String(id);
    applySelectionStyle();
   }

   // Abaixo deste zoom o nome e o cargo no card viram borrão. Quando a árvore
   // é larga demais para caber inteira, é melhor cortar e deixar o usuário
   // navegar do que mostrar tudo ilegível.
   const ZOOM_MINIMO = 0.5;

   function fitLegivel(ancorarEm) {
    if (!chart) return;
    // O fit da lib encaixa a árvore inteira na tela. Com muitos irmãos isso
    // encolhe o card até o nome sumir, então ele só vale enquanto o resultado
    // continuar legível; abaixo disso enquadramos um nó e o usuário navega.
    chart.fit();
    setTimeout(() => {
     // `svg` e `zoomBehavior` entram no state depois do constructor, então não
     // ganham getter na instância — só dá para lê-los pelo state.
     const state = chart.getChartState();
     if (!state.svg || !state.zoomBehavior || !state.allNodes) return;
     if (state.lastTransform && state.lastTransform.k >= ZOOM_MINIMO) return;

     const alvo =
      state.allNodes.find((n) => String(n.data.id) === String(ancorarEm)) ||
      state.allNodes.find((n) => String(n.data.id) === String(rootId()));
     if (!alvo) return;

     // Depois do fit o center-group está zerado, então as coordenadas do nó
     // já estão no mesmo espaço em que o zoom é aplicado.
     const k = ZOOM_MINIMO;
     const x = state.svgWidth / 2 - alvo.x * k;
     const y = 60 - alvo.y * k;
     state.svg
      .transition()
      .duration(400)
      .call(state.zoomBehavior.transform, d3.zoomIdentity.translate(x, y).scale(k));
    }, 550);
   }

   // A legenda explica o que a cor significa: profundidade na árvore. Antes ela
   // listava tipos que eu havia agrupado por conta própria.
   function montarLegenda() {
    const profundidades = [...new Set(currentData.map((r) => nivelDe(r)))].sort((a, b) => a - b);
    const maior = Math.min(profundidades[profundidades.length - 1] || 0, RAMPA_NIVEL.length - 1);
    const itens = [];
    for (let n = 0; n <= maior; n++) {
     itens.push(
      `<span class="legenda__item"><i style="background:${corDoNivel(n)}"></i>${
       n === 0 ? "Nível 1 (raiz)" : "Nível " + (n + 1)
      }${n === RAMPA_NIVEL.length - 1 && maior === n ? "+" : ""}</span>`
     );
    }
    itens.push(
     `<span class="legenda__item"><i style="background:${COR_PESSOA};border-radius:100px"></i>Colaborador</span>`
    );
    document.getElementById("legenda").innerHTML = itens.join("");
   }

   function afterRender() {
    requestAnimationFrame(() => {
     attachEmailOverlay();
     applySelectionStyle();
     montarLegenda();
    });
   }

   function renderDesign() {
    calcularNiveis();
    const design = activeDesign();
    const container = document.querySelector(".chart-container");
    container.innerHTML = "";
    container.style.backgroundColor = design.background;

    let rows = currentData.map(toChartRow);
    if (design.prepare) rows = design.prepare(rows);

    chart = new d3.OrgChart()
     .container(".chart-container")
     .svgHeight(chartHeight())
     .data(rows)
     // Um organograma mostra a equipe inteira. Esconder subordinados atrás de
     // um "Show next N nodes" faz o gestor parecer ter menos gente do que tem.
     .minPagingVisibleNodes((d) => Number.MAX_SAFE_INTEGER)
     .pagingStep((d) => Number.MAX_SAFE_INTEGER)
     .onNodeClick((d) => {
      selectNode(d.data.id);
      salvarVisual();
      setStatus(`Selecionado: ${nodeLabel(d.data.id)}`);
     })
     .onExpandOrCollapse(() => {
      requestAnimationFrame(() => {
       fitLegivel();
       afterRender();
       capturarExpandidos();
       salvarVisual();
      });
     });

    design.apply(chart);
    chart.layout(layoutAtual);
    chart.render(); fitLegivel();
    setTimeout(afterRender, 50);
    setTimeout(afterRender, 250);
    if (design.after) design.after(chart);
   }

   // --------------------------- persistência local ---------------------------
   // Sem isto, adicionar/editar/remover é perdido no primeiro F5: a página
   // sempre recarregava o CSV do servidor e jogava fora o trabalho.

   const CHAVE_VISUAL = "organograma:visual";

   // Tema, layout, o que está aberto e o card selecionado. Sem guardar isto,
   // escolher um tema, expandir a árvore e trocar o layout era tudo perdido no
   // primeiro F5, mesmo com os dados intactos.
   var expandidos = new Set();
   var layoutAtual = "top";
   const LAYOUTS = ["top", "right", "bottom", "left"];

   // Abre só a linha da raiz até o nó e fecha o resto. Sem isto, criar alguém
   // no fundo da árvore expandia todos os ancestrais de uma vez e cada um
   // despejava os próprios filhos: 1 pessoa criada, dezenas de cards na tela.
   function focarCaminho(id) {
    const caminho = new Set();
    let atual = currentData.find((r) => String(r.id) === String(id));
    while (atual && !caminho.has(String(atual.id))) {
     caminho.add(String(atual.id));
     atual = currentData.find((r) => String(r.id) === String(atual.parentId));
    }
    expandidos = caminho;
   }

   // A lib usa _expanded para abrir os ANCESTRAIS do nó marcado — não os
   // filhos dele. Então o que precisa ser guardado é a lista de nós visíveis:
   // cada um puxa o próprio caminho de volta ao ser restaurado.
   function capturarExpandidos() {
    if (!chart) return;
    const state = chart.getChartState();
    if (!state.root) return;
    // allNodes traz a árvore inteira, inclusive o que está recolhido — salvar
    // aquilo reabria tudo no F5. Visível é só quem tem o caminho aberto até a
    // raiz, e a lib marca isso movendo os filhos entre .children e ._children.
    const visiveis = new Set();
    const percorrer = (no) => {
     visiveis.add(String(no.data.id));
     if (no.children) no.children.forEach(percorrer);
    };
    percorrer(state.root);
    expandidos = visiveis;
   }

   function salvarVisual() {
    try {
     localStorage.setItem(
      CHAVE_VISUAL,
      JSON.stringify({
       tema: currentDesign,
       layout: layoutAtual,
       expandidos: [...expandidos],
       selecionado: selectedNodeId
      })
     );
    } catch (erro) {}
   }

   function aplicarVisualSalvo() {
    let visual = null;
    try {
     visual = JSON.parse(localStorage.getItem(CHAVE_VISUAL) || "null");
    } catch (erro) {}
    if (!visual) return;
    if (designs.some((d) => d.id === visual.tema)) currentDesign = visual.tema;
    if (LAYOUTS.includes(visual.layout)) layoutAtual = visual.layout;
    if (Array.isArray(visual.expandidos)) expandidos = new Set(visual.expandidos.map(String));
    if (visual.selecionado) selectedNodeId = String(visual.selecionado);
   }

   var versaoServidor = null;
   var gravando = false;
   var gravarDeNovo = false;

   // Os dados ficam no servidor, num arquivo JSON. O que continua no navegador
   // é só a preferência visual de cada pessoa (tema, layout, o que está aberto),
   // que não faz sentido impor aos outros.
   async function salvarNoServidor() {
    if (gravando) {
     gravarDeNovo = true;
     return;
    }
    gravando = true;
    try {
     const resposta = await fetch("api/organograma", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ versao: versaoServidor, linhas: currentData })
     });
     const corpo = await resposta.json();

     if (resposta.status === 409) {
      // Alguém salvou enquanto esta aba estava aberta. Trocar para a versão
      // do servidor é menos ruim do que apagar o trabalho da outra pessoa.
      versaoServidor = corpo.versao;
      currentData = corpo.linhas;
      selectNode(null);
      renderDesign();
      afterRender();
      marcarAlterado(true);
      setStatus(
       `${corpo.erro}. A tela foi atualizada com a versão do servidor — refaça sua alteração.`,
       true
      );
      return;
     }

     if (!resposta.ok) {
      setStatus(
       `Não foi possível salvar no servidor: ${corpo.erro || resposta.status}. Exporte o CSV para não perder o trabalho.`,
       true
      );
      return;
     }

     versaoServidor = corpo.versao;
     marcarAlterado(true);
    } catch (erro) {
     setStatus(
      "Sem conexão com o servidor — a alteração não foi salva. Exporte o CSV para não perder o trabalho.",
      true
     );
    } finally {
     gravando = false;
     if (gravarDeNovo) {
      gravarDeNovo = false;
      salvarNoServidor();
     }
    }
   }

   async function carregarDoServidor() {
    const resposta = await fetch("api/organograma", { cache: "no-store" });
    if (!resposta.ok) throw new Error("servidor indisponível");
    const corpo = await resposta.json();
    if (!corpo.existe) return null;
    versaoServidor = corpo.versao;
    return corpo.linhas;
   }

   async function descartarLocal() {
    if (
     !confirm(
      "Descartar as alterações salvas no servidor e voltar ao organograma original?\n\nIsto afeta todo mundo que abrir esta página."
     )
    )
     return;
    try {
     const resposta = await fetch("api/organograma", { method: "DELETE" });
     if (!resposta.ok) throw new Error();
     location.reload();
    } catch (erro) {
     setStatus("Não foi possível descartar as alterações no servidor", true);
    }
   }

   function marcarAlterado(alterado) {
    document.getElementById("btn-descartar").hidden = !alterado;
   }

   function iniciar(linhas, mensagem) {
    currentData = linhas;
    aplicarVisualSalvo();
    if (selectedNodeId && !nodeExists(selectedNodeId)) selectedNodeId = null;
    buildDesignMenu();
    renderDesign();
    afterRender();
    setStatus(mensagem);
   }

   (async () => {
    try {
     const salvas = await carregarDoServidor();
     if (salvas) {
      marcarAlterado(true);
      iniciar(salvas, `${salvas.length} pessoas • carregado do servidor`);
      return;
     }
    } catch (erro) {
     setStatus("Servidor fora do ar — abrindo o organograma original, sem salvar", true);
    }
    const originais = await d3.csv("misc/data.csv");
    iniciar(
     originais,
     `Pronto • ${originais.length} pessoas • clique em um card para selecioná-lo`
    );
   })();

   // ------------------------- ações da toolbar -------------------------

   function rootId() {
    const ids = new Set(currentData.map((row) => String(row.id)));
    const root = currentData.find(
     (row) => !String(row.parentId || "").trim() || !ids.has(String(row.parentId))
    );
    return root ? String(root.id) : null;
   }

   function nodeExists(id) {
    return currentData.some((row) => String(row.id) === String(id));
   }

   function pushUndo() {
    undoStack.push(JSON.stringify(currentData));
    if (undoStack.length > 25) undoStack.shift();
   }

   function undoLast() {
    if (!undoStack.length) return setStatus("Nada para desfazer", true);
    const previous = JSON.parse(undoStack.pop());
    if (!Array.isArray(previous)) return setStatus("Histórico corrompido", true);
    currentData = previous;
    selectNode(
     currentData.some((row) => String(row.id) === String(selectedNodeId))
      ? selectedNodeId
      : null
    );
    salvarNoServidor();
    renderDesign();
    fitLegivel();
    afterRender();
    setStatus(`Última alteração desfeita (${currentData.length} pessoas)`);
   }

   // Só devolve um nó se o usuário realmente clicou em um. Sem palpite:
   // toda ação da toolbar age no que está selecionado ou em nada.
   function getSelectedNodeId() {
    if (selectedNodeId && nodeExists(selectedNodeId)) return selectedNodeId;
    selectedNodeId = null;
    return null;
   }

   // A raiz não tem chefe, e ninguém pode responder a um subordinado seu —
   // isso quebraria a árvore em um ciclo e o organograma sumiria da tela.
   function montarSelectChefe(id, parentIdAtual) {
    const select = document.getElementById("ed-parentId");
    const proibidos = descendantsOf(id);
    const ehRaiz = String(id) === String(rootId());
    select.innerHTML = "";
    select.disabled = ehRaiz;

    if (ehRaiz) {
     select.appendChild(new Option("— é a raiz do organograma —", ""));
     select.value = "";
     return;
    }

    currentData
     .filter((row) => !proibidos.has(String(row.id)))
     .sort((a, b) => `${a.name} ${a.lastName}`.localeCompare(`${b.name} ${b.lastName}`, "pt-BR"))
     .forEach((row) => {
      const nome = `${row.name || ""} ${row.lastName || ""}`.trim() || `#${row.id}`;
      select.appendChild(new Option(`${nome}${row.position ? " — " + row.position : ""}`, row.id));

   function atualizarPreview(src) {

   const LADO_FOTO = 256;

   // Recorta no quadrado central e reduz. Uma foto de celular tem ~4 MB; sem
   // isto, 330 colaboradores encheriam o disco e deixariam a página lenta.
   function prepararFoto(file) {
    return new Promise((resolve, reject) => {
     const reader = new FileReader();
     reader.onerror = () => reject(new Error("não foi possível ler o arquivo"));
     reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("arquivo não é uma imagem válida"));
      img.onload = () => {
       const canvas = document.createElement("canvas");
       canvas.width = LADO_FOTO;
       canvas.height = LADO_FOTO;
       const corte = Math.min(img.width, img.height);
       canvas
        .getContext("2d")
        .drawImage(img, (img.width - corte) / 2, (img.height - corte) / 2, corte, corte, 0, 0, LADO_FOTO, LADO_FOTO);
       canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("falha ao converter"))), "image/jpeg", 0.82);
      };
      img.src = reader.result;
     };
     reader.readAsDataURL(file);
    });
   }

   async function enviarFoto(id, file) {
    const blob = await prepararFoto(file);
    const resposta = await fetch(`api/fotos/${encodeURIComponent(id)}`, {
     method: "PUT",
     headers: { "Content-Type": "image/jpeg" },
     body: blob
    });
    if (!resposta.ok) throw new Error((await resposta.json()).erro || "falha no envio");
    const corpo = await resposta.json();
    // O sufixo força o navegador a buscar de novo depois de trocar a foto.
    return `${corpo.caminho}?v=${Date.now()}`;
   }

   const semAcento = (t) =>
    (t || "")
     .normalize("NFD")
     .replace(/[̀-ͯ]/g, "")
     .toLowerCase()
     .replace(/[^a-z0-9]+/g, " ")
     .trim();

   // Casa "maria.silva.jpg" com a pessoa: primeiro pelo id, depois pelo login/
   // e-mail e por fim pelo nome completo, para o lote não exigir renomear tudo.
   function acharPessoaPorArquivo(nomeArquivo) {
    const base = nomeArquivo.replace(/\.[^.]+$/, "");
    const chave = semAcento(base);
    let achou = currentData.find((r) => String(r.id) === base.trim());
    if (achou) return achou;
    achou = currentData.find((r) => r.email && semAcento(String(r.email).split("@")[0]) === chave);
    if (achou) return achou;
    return currentData.find(
     (r) => semAcento(`${r.name || ""} ${r.lastName || ""}`) === chave && chave
    );
   }

   async function enviarFotosEmLote(arquivos) {
    const total = arquivos.length;
    const semDono = [];
    let enviadas = 0;
    for (let i = 0; i < total; i++) {
     const arquivo = arquivos[i];
     const pessoa = acharPessoaPorArquivo(arquivo.name);
     if (!pessoa) {
      semDono.push(arquivo.name);
      continue;
     }
     setStatus(`Enviando fotos… ${i + 1} de ${total}`);
     try {
      pessoa.image = await enviarFoto(pessoa.id, arquivo);
      enviadas++;
     } catch (erro) {
      semDono.push(`${arquivo.name} (${erro.message})`);
     }
    }
    if (enviadas) {
     await salvarNoServidor();
     renderDesign();
     afterRender();
    }
    const sobra = semDono.length
     ? ` • ${semDono.length} sem correspondência: ${semDono.slice(0, 3).join(", ")}${semDono.length > 3 ? "…" : ""}`
     : "";
    setStatus(`${enviadas} de ${total} fotos aplicadas${sobra}`, !enviadas);
   }

   function salvarEditor() {
    if (!editandoId) return;
    const row = currentData.find((r) => String(r.id) === String(editandoId));
    if (!row) return setStatus("Colaborador não encontrado", true);

    const valores = {};
    CAMPOS_EDITAVEIS.forEach((campo) => {
     valores[campo] = document.getElementById("ed-" + campo).value.trim();
    });
    const erro = document.getElementById("ed-erro");
    // Caixa de unidade ("GABINETE DO PREFEITO") não tem nome de pessoa, e uma
    // pessoa pode estar sem cargo definido: basta um dos dois para identificar.
    if (!valores.name && !valores.position) {
     erro.textContent = "Preencha o nome ou o cargo/unidade";
     return document.getElementById("ed-name").focus();
    }

    const select = document.getElementById("ed-parentId");
    const novoChefe = select.disabled ? row.parentId : select.value;
    const mudouChefe = String(novoChefe || "") !== String(row.parentId || "");

    pushUndo();
    Object.assign(row, valores);
    if (mudouChefe) row.parentId = novoChefe;

    fecharEditor();
    selectNode(editandoId);
    salvarNoServidor();
    if (mudouChefe) focarCaminho(row.id);
    renderDesign();
    fitLegivel(row.id);
    afterRender();
    salvarVisual();
    setStatus(
     mudouChefe
      ? `Salvo: ${nodeLabel(row.id)} agora responde a ${nodeLabel(novoChefe)}`
      : `Salvo: ${nodeLabel(row.id)}`
    );
   }

   // Continua a numeração do CSV em vez de um id sintético: quem adiciona uma
   // pessoa aqui espera encontrá-la no CSV exportado, com um id igual aos outros.
   function proximoId() {
    const numericos = currentData
     .map((row) => Number(row.id))
     .filter((n) => Number.isFinite(n));
    return String(numericos.length ? Math.max(...numericos) + 1 : 1);
   }

   function descendantsOf(targetId) {
    const ids = new Set([String(targetId)]);
    let changed = true;
    while (changed) {
     changed = false;
     for (const row of currentData) {
      if (ids.has(String(row.parentId)) && !ids.has(String(row.id))) {
       ids.add(String(row.id));
       changed = true;
      }
     }
    }
    return ids;
   }

   function removeSampleNode() {
    if (!currentData.length) return setStatus("Não há nós para remover", true);
    const targetId = requireSelection("remover");
    if (!targetId) return;

    // Apagar a raiz esvazia o organograma inteiro e deixa a tela em branco.
    if (String(targetId) === String(rootId())) {
     return setStatus(
      `${nodeLabel(targetId)} é a raiz do organograma e não pode ser removida`,
      true
     );
    }

    const idsToRemove = descendantsOf(targetId);
    const label = nodeLabel(targetId);
    const subordinados = idsToRemove.size - 1;
    const aviso = subordinados
     ? `Remover ${label}?\n\nIsto também remove ${subordinados} subordinado(s) abaixo dele.`
     : `Remover ${label}?`;
    if (!confirm(aviso)) return setStatus("Remoção cancelada");

    pushUndo();
    currentData = currentData.filter((row) => !idsToRemove.has(String(row.id)));
    selectNode(null);
    salvarNoServidor();
    renderDesign();
    fitLegivel();
    afterRender();
    setStatus(`Removido: ${label} (${idsToRemove.size} pessoa(s))`);
   }

   function downloadPdf() {
    chart.exportImg({
     save: false,
     onLoad: (base64) => {
      const image = new Image();
      image.onload = () => {
       const landscape = image.width >= image.height;
       const pdf = new jspdf.jsPDF({
        orientation: landscape ? "landscape" : "portrait",
        unit: "mm",
        format: "a4"
       });
       const pageW = pdf.internal.pageSize.getWidth();
       const pageH = pdf.internal.pageSize.getHeight();
       const margin = 8;
       const scale = Math.min(
        (pageW - margin * 2) / image.width,
        (pageH - margin * 2) / image.height
       );
       const w = image.width * scale;
       const h = image.height * scale;
       pdf.addImage(base64, "PNG", (pageW - w) / 2, (pageH - h) / 2, w, h);
       pdf.save("organograma.pdf");
      };
      image.onerror = () => setStatus("Não foi possível gerar o PDF", true);
      image.src = base64;
     }
    });
   }

   // ------------------------- carregamento de CSV -------------------------

   function validateRows(rows) {
    const ids = new Set();
    const duplicated = [];
    rows.forEach((row) => {
     const id = String(row.id);
     if (ids.has(id)) duplicated.push(id);
     ids.add(id);
    });
    if (duplicated.length) {
     throw new Error(
      `IDs duplicados no CSV: ${[...new Set(duplicated)].slice(0, 3).join(", ")}`
     );
    }
    const roots = rows.filter((row) => !String(row.parentId || "").trim());
    if (!roots.length) {
     throw new Error("O CSV não tem nó raiz (uma linha com parentId vazio)");
    }
    if (roots.length > 1) {
     throw new Error(
      `O CSV tem ${roots.length} raízes; use apenas uma linha com parentId vazio`
     );
    }
    const orphan = rows.find((row) => {
     const parent = String(row.parentId || "").trim();
     return parent && !ids.has(parent);
    });
    if (orphan) {
     throw new Error(
      `A linha ${orphan.id} aponta para um parentId inexistente (${orphan.parentId})`
     );
    }
   }

   function parseInput(text, name) {
    // O Bloco de Notas e o Excel gravam um BOM no início do arquivo. Sem tirar,
    // a primeira coluna vira o texto FEFF+id e nenhuma linha tem id.
    const limpo = text.charCodeAt(0) === 0xfeff ? text.slice(1) : text;
    const ext = (name || "").toLowerCase();
    if (ext.endsWith(".json")) {
     const json = JSON.parse(limpo);
     const rows = Array.isArray(json) ? json : Array.isArray(json.nodes) ? json.nodes : null;
     if (!rows) throw new Error("JSON precisa ser uma lista de nós ou ter a chave 'nodes'");
     return rows;
    }
    // Excel em português salva com ";". Decide pelo separador que mais aparece
    // no cabeçalho, senão o arquivo inteiro vira uma coluna só.
    const cabecalho = limpo.slice(0, limpo.indexOf("\n") + 1 || limpo.length);
    const conta = (c) => cabecalho.split(c).length - 1;
    if (conta(";") > conta(",")) return d3.dsvFormat(";").parse(limpo);
    if (conta("\t") > conta(",")) return d3.dsvFormat("\t").parse(limpo);
    return d3.csvParse(limpo);
   }

   // O CSV e as fotos entram no mesmo gesto. Aqui a lista é separada: os dados
   // são carregados primeiro (as fotos precisam saber a quem pertencem) e só
   // depois as imagens são casadas com as pessoas.
   async function carregarArquivos(lista) {
    const arquivos = [...(lista || [])];
    if (!arquivos.length) return;
    const ehImagem = (f) => /^image\//.test(f.type) || /\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name);
    const imagens = arquivos.filter(ehImagem);
    const dados = arquivos.filter((f) => !ehImagem(f));

    if (dados.length > 1) {
     return setStatus(
      `Selecione um único CSV/JSON (encontrei ${dados.length}: ${dados.map((f) => f.name).join(", ")})`,
      true
     );
    }
    if (dados.length) {
     const carregou = await loadDataFile(dados[0]);
     if (!carregou) return;
    } else if (!currentData.length) {
     return setStatus("Envie o CSV junto com as fotos", true);
    }
    if (imagens.length) {
     await enviarFotosEmLote(imagens);
     return;
    }
    await salvarNoServidor();
   }

   function loadDataFile(file) {
    return new Promise((resolve) => {
     const reader = new FileReader();
     reader.onload = (event) => {
      try {
       const rows = parseInput(event.target.result, file.name);
       if (!Array.isArray(rows) || rows.length === 0) {
        throw new Error("O arquivo não contém dados válidos");
       }
       // Um organograma institucional é feito de unidades (secretaria,
       // gabinete, coordenadoria) além de pessoas, e unidade não tem nome nem
       // sobrenome — só o rótulo em `position`. Exigir nome de pessoa
       // descartava essas linhas, inclusive a raiz, e o arquivo inteiro era
       // recusado por "não tem nó raiz".
       const validRows = rows.filter((row) => {
        const id = String(row.id || "").trim();
        const rotulo =
         String(row.name || "").trim() ||
         String(row.lastName || "").trim() ||
         String(row.position || "").trim();
        return id && rotulo;
       });
       if (!validRows.length) {
        throw new Error("O arquivo precisa ter, em cada linha, um id e um nome ou cargo");
       }
       validateRows(validRows);
       currentData = validRows;
       selectNode(null);
       undoStack.length = 0;
       expandidos = new Set();
       renderDesign();
       fitLegivel();
       afterRender();
       setStatus(`${validRows.length} registros carregados de ${file.name}`);
       resolve(true);
      } catch (error) {
       setStatus(error.message || "Não foi possível ler o arquivo", true);
       resolve(false);
      }
     };
     reader.onerror = () => {
      setStatus("Não foi possível ler o arquivo", true);
      resolve(false);
     };
     reader.readAsText(file, "UTF-8");
    });
   }

   const CSV_COLUMNS = ["id", "parentId", "name", "lastName", "position", "email", "department_name", "location_state", "image"];

   function exportRows() {
    return CSV_COLUMNS.map((column) => `"${column.replace(/"/g, '""')}"`).join(",")
     + "\n"
     + currentData.map((row) =>
      CSV_COLUMNS.map((column) => {
       const value = row[column] === undefined || row[column] === null ? "" : String(row[column]);
       return `"${value.replace(/"/g, '""')}"`;
      }).join(",")
     ).join("\n");
   }

   function downloadCsv() {
    if (!currentData.length) return setStatus("Não há dados para exportar", true);
    const blob = new Blob([exportRows()], { type: "text/csv;charset=utf-8" });
    triggerDownload(blob, "organograma.csv");
    setStatus(`Exportado organograma.csv (${currentData.length} registros)`);
   }

   function downloadJson() {
    if (!currentData.length) return setStatus("Não há dados para exportar", true);
    const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: "application/json" });
    triggerDownload(blob, "organograma.json");
    setStatus(`Exportado organograma.json (${currentData.length} registros)`);
   }

   function triggerDownload(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
   }

   function setStatus(message, isError) {
    const status = document.getElementById("status-msg");
    if (status) {
     status.textContent = message;
     status.previousElementSibling.style.background = isError
      ? "#ef4444"
      : "#10b981";
    }
   }

   });

   document.getElementById("editor").addEventListener("click", (event) => {
    if (event.target.id === "editor") fecharEditor();
   });

   document.addEventListener("keydown", (event) => {
    if (document.getElementById("editor").hidden) return;
    if (event.key === "Escape") fecharEditor();
    if (event.key === "Enter" && event.target.tagName === "INPUT") salvarEditor();
   });

   // A lib só expõe callback de clique simples, então o duplo clique é
   // capturado por delegação no container.
   document.querySelector(".chart-wrapper").addEventListener("dblclick", (event) => {
    const node = event.target.closest("g.node");
    if (!node) return;
    const id = nodeIdFromElement(node);
    if (id === null) return;
    selectNode(id);
    abrirEditor(id);
   });

   document.getElementById("csv-input").addEventListener("change", async (event) => {
    const arquivos = [...event.target.files];
    event.target.value = "";
    await carregarArquivos(arquivos);
   });

   document.getElementById("theme-select").addEventListener("change", (event) => {
    currentDesign = event.target.value;
    renderDesign();
    afterRender();
    salvarVisual();
    setStatus(`${event.target.selectedOptions[0].textContent} aplicado`);
   });

   let resizeTimer;
   window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
     if (!chart) return;
     chart.svgHeight(chartHeight()).render();
     fitLegivel();
    }, 200);
   });

   const dropOverlay = document.getElementById("drop-overlay");
   let dragDepth = 0;
   document.addEventListener("dragenter", (event) => {
    event.preventDefault();
    dragDepth += 1;
    dropOverlay.classList.add("active");
   });
   document.addEventListener("dragover", (event) => event.preventDefault());
   document.addEventListener("dragleave", (event) => {
    event.preventDefault();
    dragDepth -= 1;
    if (dragDepth <= 0) {
     dragDepth = 0;
     dropOverlay.classList.remove("active");
    }
   });
   document.addEventListener("drop", (event) => {
    event.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove("active");
    carregarArquivos(event.dataTransfer.files);
   });
  </script>

  <link href="build/inter.css" rel="stylesheet" />
  <link href="build/fontawesome.min.css?v=2" rel="stylesheet" />
 </body>
