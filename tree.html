<!DOCTYPE html>

<html>
 <head>
  <meta charset="UTF-8" />
  <title>OrgChart</title>
  <link rel="shortcut icon" type="image/x-icon" href="misc/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 </head>

 <body>
  <!----------------   ORG CHART NON ESSENTIAL CONTENT ------------>
  <script src="build/vendor/html2canvas.js"></script>
  <script src="build/vendor/jspdf.umd.min.js"></script>
  <link
   href="build/simptip.min.css"
   rel="stylesheet"
  />

  <style>
   [data-tooltip]:focus:after {
    display: none;
    border-bottom-color: none !important;
   }

   [data-tooltip]:focus:before {
    display: none;
    border-bottom-color: none !important;
   }

   [data-tooltip]:after {
    height: auto !important;
    padding: 11px 11px 11px 11px !important;
    content: attr(data-tooltip);
    white-space: pre;
    line-height: 16px !important;
    text-align: left !important;
   }
  </style>

  <link
   href="build/app.css"
   rel="stylesheet"
  />

  <div class="toolbar">
   <div class="toolbar__brand">
    <i class="fas fa-sitemap"></i>
    Organograma
   </div>

   <label class="file-upload">
    <span class="file-upload__label">
     <i class="fas fa-file-csv"></i>
     Carregar CSV
    </span>
    <input
     type="file"
     id="csv-input"
     accept=".csv,text/csv"
     title="Selecione um arquivo CSV"
    />
   </label>

    <label class="theme-picker">
     <i class="fas fa-palette"></i>
     <select id="theme-select" title="Tema visual"></select>
    </label>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button class="btn" onclick="chart.fit()" title="Ajustar à tela">
     <i class="fas fa-expand"></i> Fit
    </button>
    <button class="btn" onclick="chart.fullscreen()" title="Tela cheia">
     <i class="fas fa-arrows-alt"></i> Full
    </button>
    <button
     class="btn"
     onclick='chart.layout(["right","bottom","left","top"][index++%4]).render().fit()'
     title="Trocar layout"
    >
     <i class="fas fa-exchange-alt"></i> Layout
    </button>
   </div>

   <div class="toolbar__group">
    <button class="btn" onclick="chart.expandAll()" title="Expandir tudo">
     <i class="fas fa-plus-circle"></i> Expand All
    </button>
    <button class="btn" onclick="chart.collapseAll()" title="Recolher tudo">
     <i class="fas fa-minus-circle"></i> Collapse All
    </button>
   </div>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button
     class="btn"
     onclick="chart.exportImg()"
     title="Exportar PNG do que está visível"
    >
     <i class="fas fa-image"></i> PNG
    </button>
    <button
     class="btn"
     onclick="chart.exportImg({full:true})"
     title="Exportar PNG do grafo completo"
    >
     <i class="far fa-images"></i> PNG Full
    </button>
    <button class="btn" onclick="chart.exportSvg()" title="Exportar SVG">
     <i class="fas fa-code"></i> SVG
    </button>
    <button class="btn" onclick="downloadPdf()" title="Exportar PDF">
     <i class="fas fa-file-pdf"></i> PDF
    </button>
   </div>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button
     class="btn"
     onclick='chart.setCentered("134").render()'
     title="Centralizar nó"
    >
     <i class="fas fa-crosshairs"></i> Center
    </button>
    <button
     class="btn"
     onclick='chart.setHighlighted("134").render()'
     title="Destacar nó"
    >
     <i class="fas fa-highlighter"></i> Highlight
    </button>
    <button
     class="btn"
     onclick='chart.setUpToTheRootHighlighted("134").render()'
     title="Destacar caminho até a raiz"
    >
     <i class="fas fa-arrow-up"></i> To Root
    </button>
    <button
     class="btn"
     onclick="chart.clearHighlighting().render()"
     title="Limpar destaques"
    >
     <i class="fas fa-eraser"></i> Clear
    </button>
   </div>

   <div class="toolbar__group">
    <button
     class="btn btn--primary"
     onclick='chart.addNode({id:"root-child-"+Date.now(),parentId:"100",name:"Novo",lastName:"Colaborador",position:"Cargo",department_name:"Equipe",_centered:true}).render()'
     title="Adicionar nó"
    >
     <i class="fas fa-user-plus"></i> Add Node
    </button>
    <button
     class="btn btn--danger"
     onclick='chart.removeNode("120").render()'
     title="Remover nó #120"
    >
     <i class="fas fa-user-minus"></i> Remove
    </button>
   </div>
  </div>

  <div class="status-bar">
   <span class="status-bar__dot"></span>
   <span id="status-msg">Pronto • 107 funcionários carregados</span>
  </div>

  <div class="chart-wrapper">
   <div class="chart-container"></div>
  </div>

  <div class="drop-overlay" id="drop-overlay">
   <div class="drop-overlay__content">
    <i class="fas fa-cloud-upload-alt"></i>
    Solte o arquivo CSV aqui
   </div>
  </div>

  buildThemeMenu();
   function activeTheme() {

   }
   function themedNodeContent(d) {

     return `<div style="width:240px;height:90px;padding:${kind === 1 ? 8 : 10}px;box-sizing:border-box;background:${theme.background};border:2px solid ${highlighted ? '#F59E0B' : theme.accent};border-radius:${radius};box-shadow:0 2px 7px rgba(15,23,42,.16);${layouts};font-family:'Inter','Helvetica',sans-serif;color:${theme.text};overflow:hidden;">
       ${image}<div style="min-width:0;flex:1;width:${kind === 1 ? 'auto' : '100%'};"><div style="font-size:${kind === 5 ? 11 : 13}px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div><div style="font-size:10px;color:${theme.muted};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.data.position || ''}</div><div style="font-size:9px;color:${theme.accent};margin-top:3px;">${kind === 7 ? 'TEAM ' : ''}${d.data.department_name || 'Organization'}</div>${kind === 4 || kind === 5 || kind === 8 ? metrics : ''}</div>

    }
    return `<div style="width:240px;height:90px;padding:8px 12px;box-sizing:border-box;background:${highlighted ? '#FEF3C7' : theme.background};border:2px solid ${highlighted ? '#F59E0B' : theme.accent};border-radius:10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.15);font-family:'Inter','Helvetica',sans-serif;">
      <img src="${d.data.image || ''}" onerror="this.style.display='none'" style="width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid ${theme.accent};flex-shrink:0;background:#E3F2FD;"/>
      <div style="display:flex;flex-direction:column;overflow:hidden;flex:1;min-width:0;">
       <div style="font-weight:700;font-size:14px;color:${theme.text};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.data.name} ${d.data.lastName || ''}</div>
       <div style="font-size:12px;color:${theme.muted};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">${d.data.position || ''}</div>
       <div style="font-size:11px;color:${theme.muted};margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"><i class="fas fa-building" style="color:${theme.accent};"></i> ${d.data.department_name || ''}</div>

     </div>`;
   }
   d3.csv("misc/data.csv").then((dataFlattened) => {
    currentData = dataFlattened;

    chart = new d3.OrgChart()

    // .buttonContent(({ node, state }) => {
    //     return `<div style="color:#716E7B;border-radius:5px;padding:3px;font-size:10px;margin:auto auto;background-color:white;border: 1px solid #E4E2E9"> <span style="font-size:9px">${node.children ? `<i class="fas fa-angle-up"></i>` : `<i class="fas fa-angle-down"></i>`}</span> ${node.data._directSubordinates}  </div>`

      layouts.top.linkY = (node) => node.y + 0;
      layouts.top.linkCompactYStart = (node) => node.y + node.height / 2 + 15;
      return layouts;
     })()
    );

    chart.render();
   });

    function downloadPdf() {
     chart.exportImg({
      save: false,
      onLoad: (base64) => {
      const pdf = new jspdf.jsPDF();
      const image = new Image();
      image.src = base64;
      image.onload = () => {
       pdf.addImage(image, "JPEG", 5, 5, 595 / 3, (image.height / image.width) * 595 / 3);
       pdf.save("organograma.pdf");
      };
      },
     });
    }

    function loadCsvFile(file) {
     if (!file || !/\.csv$/i.test(file.name)) {
      setStatus("Selecione um arquivo .csv válido", true);
      return;
     }

     const reader = new FileReader();
     reader.onload = (event) => {
      try {
      const rows = d3.csvParse(event.target.result);
      const validRows = rows.filter((row) => row.id && row.name);
      if (!validRows.length) {
       throw new Error("O CSV precisa conter as colunas id e name");
      }
      currentData = validRows;
      chart.data(currentData).render().fit();
      setStatus(`${validRows.length} funcionários carregados de ${file.name}`);
      } catch (error) {
      setStatus(error.message || "Não foi possível ler o CSV", true);
      }
     };
     reader.onerror = () => setStatus("Não foi possível ler o arquivo", true);
     reader.readAsText(file, "UTF-8");
    }

    function setStatus(message, isError) {
     const status = document.getElementById("status-msg");
     if (status) {
      status.textContent = message;
      status.previousElementSibling.style.background = isError ? "#ef4444" : "#10b981";
     }
    }

    document.getElementById("csv-input").addEventListener("change", (event) => {
     loadCsvFile(event.target.files[0]);
     event.target.value = "";
    });

    document.getElementById("theme-select").addEventListener("change", (event) => {
     currentTheme = event.target.value;
     if (chart) {
      chart.nodeContent(themedNodeContent).render().fit();
     }
     setStatus(`${event.target.selectedOptions[0].textContent} aplicado`);
    });

    const dropOverlay = document.getElementById("drop-overlay");
    let dragDepth = 0;
    document.addEventListener("dragenter", (event) => {
     event.preventDefault();
     dragDepth += 1;
     dropOverlay.classList.add("active");
    });
    document.addEventListener("dragover", (event) => event.preventDefault());
    document.addEventListener("dragleave", (event) => {
     event.preventDefault();
     dragDepth -= 1;
     if (dragDepth <= 0) {
      dragDepth = 0;
      dropOverlay.classList.remove("active");
     }
    });
    document.addEventListener("drop", (event) => {
     event.preventDefault();
     dragDepth = 0;
     dropOverlay.classList.remove("active");
     loadCsvFile(event.dataTransfer.files[0]);
    });
  </script>
