<!DOCTYPE html>

<html>
 <head>
  <meta charset="UTF-8" />
  <title>OrgChart</title>
  <link rel="shortcut icon" type="image/x-icon" href="misc/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 </head>

 <body>
  <!----------------   ORG CHART NON ESSENTIAL CONTENT ------------>
  <script src="build/vendor/html2canvas.js"></script>
  <script src="build/vendor/jspdf.umd.min.js"></script>
  <link href="build/simptip.min.css" rel="stylesheet" />

  <style>
   [data-tooltip]:focus:after {
    display: none;
    border-bottom-color: none !important;
   }

   [data-tooltip]:focus:before {
    display: none;
    border-bottom-color: none !important;
   }

   [data-tooltip]:after {
    height: auto !important;
    padding: 11px 11px 11px 11px !important;
    content: attr(data-tooltip);
    white-space: pre;
    line-height: 16px !important;
    text-align: left !important;
   }
  </style>

  <link href="build/app.css" rel="stylesheet" />

  <div class="toolbar">
   <div class="toolbar__brand">
    <i class="fas fa-sitemap"></i>
    Organograma
   </div>

   <label class="file-upload">
    <span class="file-upload__label">
     <i class="fas fa-file-csv"></i>
     Carregar CSV
    </span>
    <input
     type="file"
     id="csv-input"
     accept=".csv,text/csv,.json,application/json"
     title="Selecione um arquivo CSV ou JSON"
    />
   </label>

   <a
    class="btn file-upload__label"
    href="misc/modelo-organograma.csv"
    download="modelo-organograma.csv"
    title="Baixar modelo de CSV/JSON"
   >
    <i class="fas fa-download"></i> Modelo
   </a>

   <button class="btn" onclick="downloadCsv()" title="Exportar o organograma como CSV">
    <i class="fas fa-file-export"></i> Exportar CSV
   </button>
   <button class="btn" onclick="downloadJson()" title="Exportar o organograma como JSON">
    <i class="fas fa-file-code"></i> Exportar JSON
   </button>

   <label class="theme-picker">
    <i class="fas fa-palette"></i>
    <select id="theme-select" title="Design (bumbeishvili/org-chart)"></select>
   </label>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button class="btn" onclick="chartFit()" title="Ajustar à tela">
     <i class="fas fa-expand"></i> Fit
    </button>
    <button class="btn" onclick="toggleFullscreen()" title="Tela cheia">
     <i class="fas fa-arrows-alt"></i> Full
    </button>
    <button
     class="btn"
     onclick="cycleLayout()"
     title="Trocar layout"
    >
     <i class="fas fa-exchange-alt"></i> Layout
    </button>
   </div>

   <div class="toolbar__group">
    <button class="btn" onclick="safeCall('expandAll', 'Expandir tudo')" title="Expandir tudo">
     <i class="fas fa-plus-circle"></i> Expand All
    </button>
    <button class="btn" onclick="safeCall('collapseAll', 'Recolher tudo')" title="Recolher tudo">
     <i class="fas fa-minus-circle"></i> Collapse All
    </button>
   </div>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button
     class="btn"
     onclick="safeExportImg(false)"
     title="Exportar PNG do que está visível"
    >
     <i class="fas fa-image"></i> PNG
    </button>
    <button
     class="btn"
     onclick="safeExportImg(true)"
     title="Exportar PNG do grafo completo"
    >
     <i class="far fa-images"></i> PNG Full
    </button>
    <button class="btn" onclick="safeExportSvg()" title="Exportar SVG">
     <i class="fas fa-code"></i> SVG
    </button>
    <button class="btn" onclick="downloadPdf()" title="Exportar PDF">
     <i class="fas fa-file-pdf"></i> PDF
    </button>
   </div>

   <div class="toolbar__divider"></div>

   <div class="toolbar__group">
    <button class="btn" onclick="centerFocusNode()" title="Centralizar nó">
     <i class="fas fa-crosshairs"></i> Center
    </button>
    <button class="btn" onclick="highlightFocusNode()" title="Destacar nó">
     <i class="fas fa-highlighter"></i> Highlight
    </button>
    <button
     class="btn"
     onclick="highlightPathToRoot()"
     title="Destacar caminho até a raiz"
    >
     <i class="fas fa-arrow-up"></i> To Root
    </button>
    <button
     class="btn"
     onclick="clearHighlighting()"
     title="Limpar destaques"
    >
     <i class="fas fa-eraser"></i> Clear
    </button>
    <button class="btn" onclick="undoLast()" title="Desfazer a última alteração">
     <i class="fas fa-undo"></i> Undo
    </button>
   </div>

   <div class="toolbar__group">
    <button class="btn btn--primary" onclick="addSampleNode()" title="Adicionar nó">
     <i class="fas fa-user-plus"></i> Add Node
    </button>
    <button
     class="btn btn--danger"
     onclick="removeSampleNode()"
     title="Remover o último nó adicionado (ou uma folha da árvore)"
    >
     <i class="fas fa-user-minus"></i> Remove
    </button>
   </div>
  </div>

  <div class="status-bar">
   <span class="status-bar__dot"></span>
   <span id="status-msg">Carregando…</span>
  </div>

  <div class="chart-wrapper">
   <div class="chart-container"></div>
  </div>

  <div class="drop-overlay" id="drop-overlay">
   <div class="drop-overlay__content">
    <i class="fas fa-cloud-upload-alt"></i>
    Solte o arquivo CSV aqui
   </div>
  </div>

  <!----------------  ORG CHART ESSENTIAL CONTENT ---------------->

  <script src="build/d3.v7.min.js"></script>
  <script src="build/d3-org-chart.js"></script>
  <script src="build/d3-flextree.js"></script>
  <script src="build/vendor/pieChart.js"></script>

  <script>
   // ---------------------------------------------------------------------
   // Os 7 designs abaixo são portes literais dos exemplos publicados em
   // github.com/bumbeishvili/org-chart ("Jump To Examples"):
   //   Default        -> stackblitz.com/edit/web-platform-sgsxzp
   //   Sky            -> stackblitz.com/edit/web-platform-jyncb9
   //   Circles        -> stackblitz.com/edit/web-platform-lwyild
   //   Oval           -> stackblitz.com/edit/web-platform-uhd3q7
   //   Clean          -> stackblitz.com/edit/web-platform-3gwnsg
   //   Futuristic     -> stackblitz.com/edit/web-platform-o5t1ha
   //   Prev version   -> stackblitz.com/edit/web-platform-thplyq
   // Únicas adaptações: (1) os exemplos leem sample-data/org.csv, aqui as
   // colunas do misc/data.csv são mapeadas para os nomes que eles esperam
   // (imageUrl / positionName / area / office); (2) `neightbourMargin` era
   // o nome (com typo) do setter na v2 da lib — na v3 local é
   // `neighbourMargin`; (3) svgHeight vem do container da página; (4) em
   // Sky, Circles e Oval, nome/cargo ganharam nowrap + ellipsis: os exemplos
   // usam cargos curtos ("CTO"), os cargos deste CSV quebram em 2 linhas e
   // ou vazam para fora da faixa/pill (28px e 70px de altura fixa), ou
   // empurram o rodapé Manages/Oversees contra a borda do card (Sky),
   // deixando cards do mesmo design com espaçamentos diferentes.
   // ---------------------------------------------------------------------

   var index = 0;
   var chart;
   var currentDesign = "default";
   var currentData = [];
   var addedIds = [];
   var selectedNodeId = null;
   var undoStack = [];

   var designs = [
    {
     id: "default",
     label: "Default",
     background: "white",
     // Porte do próprio tree.html do repositório (o nodeContent está lá
     // comentado, junto da configuração ativa de nodeWidth/nodeHeight e do
     // override de layoutBindings). Sem ele, a lib cai no nodeContent padrão,
     // que é só o placeholder "Sample Node(id=…), override using…".
     apply: (c) => {
      c.nodeHeight((d) => 85 + 25)
       .nodeWidth((d) => {
        return 220 + 2;
       })
       .childrenMargin((d) => 50)
       .compactMarginBetween((d) => 35)
       .compactMarginPair((d) => 30)
       .neighbourMargin((a, b) => 20)
       .nodeContent(function (d, i, arr, state) {
        const color = "#FFFFFF";
        const imageDiffVert = 25 + 2;
        return `
                <div style='width:${d.width}px;height:${
         d.height
        }px;padding-top:${
         imageDiffVert - 2
        }px;padding-left:1px;padding-right:1px'>
                    <div style="font-family: 'Inter', sans-serif;background-color:${color};  margin-left:-1px;width:${
         d.width - 2
        }px;height:${
         d.height - imageDiffVert
        }px;border-radius:10px;border: 1px solid #E4E2E9">
                        <div style="display:flex;justify-content:flex-end;margin-top:5px;margin-right:5px">#${
                         d.data.id
                        }</div>
                        <div style="background-color:${color};margin-top:${
         -imageDiffVert - 20
        }px;margin-left:${15}px;border-radius:100px;width:50px;height:50px;" ></div>
                        <div style="margin-top:${
                         -imageDiffVert - 20
                        }px;">   <img src=" ${
         d.data.image
        }" style="margin-left:${20}px;border-radius:100px;width:40px;height:40px;" /></div>
                        <div style="font-size:15px;color:#08011E;margin-left:20px;margin-top:10px">  ${
                         d.data.name
                        } </div>
                        <div style="color:#716E7B;margin-left:20px;margin-top:3px;font-size:10px;"> ${
                         d.data.position
                        } </div>

                    </div>
                </div>
                        `;
       });

      c.layoutBindings(
       (() => {
        const layouts = c.layoutBindings();
        layouts.top.linkY = (node) => node.y + 0;
        layouts.top.linkCompactYStart = (node) => node.y + node.height / 2 + 15;
        return layouts;
       })()
      );
      return c;
     }
    },

    {
     id: "sky",
     label: "Sky",
     background: "#f6f6f6",
     apply: (c) =>
      c
       .nodeWidth((d) => 250)
       .initialZoom(0.7)
       .nodeHeight((d) => 175)
       .childrenMargin((d) => 40)
       .compactMarginBetween((d) => 15)
       .compactMarginPair((d) => 80)
       .nodeContent(function (d, i, arr, state) {
        return `
            <div style="padding-top:30px;background-color:none;margin-left:1px;height:${
             d.height
            }px;border-radius:2px;overflow:visible">
              <div style="height:${
               d.height - 32
              }px;padding-top:0px;background-color:white;border:1px solid lightgray;">

                <img src=" ${
                 d.data.imageUrl
                }" style="margin-top:-30px;margin-left:${
         d.width / 2 - 30
        }px;border-radius:100px;width:60px;height:60px;" />

               <div style="margin-right:10px;margin-top:15px;float:right">${
                d.data.id
               }</div>

               <div style="margin-top:-30px;background-color:#3AB6E3;height:10px;width:${
                d.width - 2
               }px;border-radius:1px"></div>

               <div style="padding:20px; padding-top:35px;text-align:center">
                   <div style="color:#111672;font-size:16px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"> ${
                    d.data.name
                   } </div>
                   <div style="color:#404040;font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"> ${
                    d.data.positionName
                   } </div>
               </div>
               <div style="display:flex;justify-content:space-between;padding-left:15px;padding-right:15px;">
                 <div > Manages:  ${d.data._directSubordinates} 👤</div>
                 <div > Oversees: ${d.data._totalSubordinates} 👤</div>
               </div>
              </div>
      </div>
  `;
       })
    },

    {
     id: "circles",
     label: "Circles",
     background: "#fffeff",
     apply: (c) =>
      c
       .rootMargin(100)
       .nodeWidth((d) => 210)
       .nodeHeight((d) => 140)
       .childrenMargin((d) => 130)
       .compactMarginBetween((d) => 75)
       .compactMarginPair((d) => 80)
       .linkUpdate(function (d, i, arr) {
        d3.select(this)
         .attr("stroke", (d) =>
          d.data._upToTheRootHighlighted ? "#152785" : "lightgray"
         )
         .attr("stroke-width", (d) =>
          d.data._upToTheRootHighlighted ? 5 : 1.5
         )
         .attr("stroke-dasharray", "4,4");

        if (d.data._upToTheRootHighlighted) {
         d3.select(this).raise();
        }
       })
       .nodeContent(function (d, i, arr, state) {
        const colors = [
         "#6E6B6F",
         "#18A8B6",
         "#F45754",
         "#96C62C",
         "#BD7E16",
         "#802F74"
        ];
        const color = colors[d.depth % colors.length];
        const imageDim = 80;
        const lightCircleDim = 95;
        const outsideCircleDim = 110;

        return `
                <div style="background-color:white; position:absolute;width:${
                 d.width
                }px;height:${d.height}px;">
                   <div style="background-color:${color};position:absolute;margin-top:-${
         outsideCircleDim / 2
        }px;margin-left:${
         d.width / 2 - outsideCircleDim / 2
        }px;border-radius:100px;width:${outsideCircleDim}px;height:${outsideCircleDim}px;"></div>
                   <div style="background-color:#ffffff;position:absolute;margin-top:-${
                    lightCircleDim / 2
                   }px;margin-left:${
         d.width / 2 - lightCircleDim / 2
        }px;border-radius:100px;width:${lightCircleDim}px;height:${lightCircleDim}px;"></div>
                   <img src=" ${
                    d.data.imageUrl
                   }" style="position:absolute;margin-top:-${
         imageDim / 2
        }px;margin-left:${
         d.width / 2 - imageDim / 2
        }px;border-radius:100px;width:${imageDim}px;height:${imageDim}px;" />
                   <div class="card" style="top:${
                    outsideCircleDim / 2 + 10
                   }px;position:absolute;height:30px;width:${
         d.width
        }px;background-color:#3AB6E3;">
                      <div style="background-color:${color};height:28px;text-align:center;padding-top:10px;color:#ffffff;font-weight:bold;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                          ${d.data.name}
                      </div>
                      <div style="background-color:#F0EDEF;height:28px;text-align:center;padding-top:10px;color:#424142;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                          ${d.data.positionName}
                      </div>
                   </div>
               </div>
  `;
       })
    },

    {
     id: "oval",
     label: "Oval",
     background: "#fffeff",
     apply: (c) =>
      c
       .nodeHeight((d) => 70)
       .nodeWidth((d) => {
        if (d.depth == 0) return 250;
        if (d.depth == 1) return 220;
        return 140;
       })
       .childrenMargin((d) => 50)
       .compactMarginBetween((d) => 35)
       .compactMarginPair((d) => 30)
       .neighbourMargin((a, b) => 20)
       .buttonContent(({ node, state }) => {
        return `<div style="border-radius:3px;padding:3px;font-size:10px;margin:auto auto;background-color:lightgray"> <span style="font-size:9px">${
         node.children
          ? `<i class="fas fa-chevron-up"></i>`
          : `<i class="fas fa-chevron-down"></i>`
        }</span> ${node.data._directSubordinates}  </div>`;
       })
       .nodeContent(function (d, i, arr, state) {
        const colors = ["#278B8D", "#404040", "#0C5C73", "#33C6CB"];
        const color = colors[d.depth % colors.length];
        return `
            <div style="background-color:${color}; position:absolute;margin-top:-1px; margin-left:-1px;width:${
         d.width
        }px;height:${d.height}px;border-radius:50px">
               <img src=" ${
                d.data.imageUrl
               }" style="position:absolute;margin-top:5px;margin-left:${5}px;border-radius:100px;width:60px;height:60px;" />
               <div style="position:absolute;top:-15px;width:${
                d.width
               }px;text-align:center;color:#fafafa;">
                     <div style="margin:0 auto;background-color:${color};display:inline-block;padding:8px;padding-bottom:0px;border-radius:5px"> ${
         d.data.id
        }</div>
              </div>

              <div style="color:#fafafa;font-size:${
               d.depth < 2 ? 16 : 12
              }px;font-weight:bold;margin-left:70px;margin-right:20px;margin-top:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"> ${
         d.depth < 2
          ? d.data.name
          : (d.data.name || "").trim().split(/\s+/g)[0]
        } </div>
              <div style="color:#fafafa;margin-left:70px;margin-right:20px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"> ${
               d.depth < 2 ? d.data.positionName : d.data.area
              } </div>
           </div>
  `;
       })
    },

    {
     id: "clean",
     label: "Clean",
     background: "#fffeff",
     apply: (c) =>
      c
       .nodeHeight((d) => 85)
       .nodeWidth((d) => {
        return 220;
       })
       .childrenMargin((d) => 50)
       .compactMarginBetween((d) => 25)
       .compactMarginPair((d) => 50)
       .neighbourMargin((a, b) => 25)
       .siblingsMargin((d) => 25)
       .buttonContent(({ node, state }) => {
        return `<div style="px;color:#716E7B;border-radius:5px;padding:4px;font-size:10px;margin:auto auto;background-color:white;border: 1px solid #E4E2E9"> <span style="font-size:9px">${
         node.children
          ? `<i class="fas fa-angle-up"></i>`
          : `<i class="fas fa-angle-down"></i>`
        }</span> ${node.data._directSubordinates}  </div>`;
       })
       .linkUpdate(function (d, i, arr) {
        d3.select(this)
         .attr("stroke", (d) =>
          d.data._upToTheRootHighlighted ? "#152785" : "#E4E2E9"
         )
         .attr("stroke-width", (d) => (d.data._upToTheRootHighlighted ? 5 : 1));

        if (d.data._upToTheRootHighlighted) {
         d3.select(this).raise();
        }
       })
       .nodeContent(function (d, i, arr, state) {
        const color = "#FFFFFF";
        return `
            <div style="font-family: 'Inter', sans-serif;background-color:${color}; position:absolute;margin-top:-1px; margin-left:-1px;width:${
         d.width
        }px;height:${d.height}px;border-radius:10px;border: 1px solid #E4E2E9">
               <div style="background-color:${color};position:absolute;margin-top:-25px;margin-left:${15}px;border-radius:100px;width:50px;height:50px;" ></div>
               <img src=" ${
                d.data.imageUrl
               }" style="position:absolute;margin-top:-20px;margin-left:${20}px;border-radius:100px;width:40px;height:40px;" />

              <div style="color:#08011E;position:absolute;right:20px;top:17px;font-size:10px;"><i class="fas fa-ellipsis-h"></i></div>

              <div style="font-size:15px;color:#08011E;margin-left:20px;margin-top:32px"> ${
               d.data.name
              } </div>
              <div style="color:#716E7B;margin-left:20px;margin-top:3px;font-size:10px;"> ${
               d.data.positionName
              } </div>


           </div>
  `;
       })
    },

    {
     id: "futuristic",
     label: "Futuristic",
     background: "#000c0e",
     prepare: (rows) => {
      rows.forEach((d) => {
       const val = Math.round((d.name || "").length / 2);
       d.progress = [...new Array(val)].map((d) => Math.random() * 25 + 5);
      });
      return rows;
     },
     apply: (c) =>
      c
       .nodeHeight((d) => 170)
       .nodeWidth((d) => {
        if (d.depth == 0) return 500;
        return 330;
       })
       .childrenMargin((d) => 90)
       .compactMarginBetween((d) => 65)
       .compactMarginPair((d) => 100)
       .neighbourMargin((a, b) => 50)
       .siblingsMargin((d) => 100)
       .buttonContent(({ node, state }) => {
        return `<div style="color:#2CAAE5;border-radius:5px;padding:3px;font-size:10px;margin:auto auto;background-color:#040910;border: 1px solid #2CAAE5"> <span style="font-size:9px">${
         node.children
          ? `<i class="fas fa-angle-up"></i>`
          : `<i class="fas fa-angle-down"></i>`
        }</span> ${node.data._directSubordinates}  </div>`;
       })
       .linkUpdate(function (d, i, arr) {
        d3.select(this)
         .attr("stroke", (d) =>
          d.data._upToTheRootHighlighted ? "#14760D" : "#2CAAE5"
         )
         .attr("stroke-width", (d) =>
          d.data._upToTheRootHighlighted ? 15 : 1
         );

        if (d.data._upToTheRootHighlighted) {
         d3.select(this).raise();
        }
       })
       .nodeContent(function (d, i, arr, state) {
        const svgStr = `<svg width=150 height=75  style="background-color:none"> <path d="M 0,15 L15,0 L135,0 L150,15 L150,60 L135,75 L15,75 L0,60" fill="#2599DD" stroke="#2599DD"/> </svg>`;
        return `
                          <div class="left-top" style="position:absolute;left:-10px;top:-10px">  ${svgStr}</div>
                          <div class="right-top" style="position:absolute;right:-10px;top:-10px">  ${svgStr}</div>
                          <div class="right-bottom" style="position:absolute;right:-10px;bottom:-14px">  ${svgStr}</div>
                          <div class="left-bottom" style="position:absolute;left:-10px;bottom:-14px">  ${svgStr}</div>
                          <div style="font-family: 'Inter'; background-color:#040910;sans-serif; position:absolute;margin-top:-1px; margin-left:-1px;width:${
                           d.width
                          }px;height:${
         d.height
        }px;border-radius:0px;border: 2px solid #2CAAE5">

                             <div class="pie-chart-wrapper" style="margin-left:-10px;margin-top:5px;width:320px;height:300px"></div>

                            <div style="color:#2CAAE5;position:absolute;right:15px;top:-20px;">
                              <div style="font-size:15px;color:#2CAAE5;margin-top:32px"> ${
                               d.data.name
                              } </div>
                              <div style="font-size:10px;"> ${
                               d.data.positionName || ""
                              } </div>
                              <div style="font-size:10px;"> ${
                               d.data.id || ""
                              } </div>
                              ${
                               d.depth == 0
                                ? `                              <br/>
                              <div style="max-width:200px;font-size:10px;">
                                A corporate history of Ian is a chronological account of a business or other co-operative organization he founded.  <br><br>Usually it is produced in written format but it can also be done in audio or audiovisually
                              </div>`
                                : ""
                              }

                            </div>

                            <div style="position:absolute;left:-5px;bottom:10px;">
                              <div style="font-size:10px;color:#2CAAE5;margin-left:20px;margin-top:32px"> Progress </div>
                              <div style="color:#2CAAE5;margin-left:20px;margin-top:3px;font-size:10px;">
                                <svg width=150 height=30> ${(
                                 d.data.progress || []
                                )
                                 .map((h, i) => {

   function buildDesignMenu() {
    const select = document.getElementById("theme-select");
    designs.forEach((design, i) => {
     const option = document.createElement("option");
     option.value = design.id;
     option.textContent = `${String(i + 1).padStart(2, "0")} · ${design.label}`;
     select.appendChild(option);
    });
    select.value = currentDesign;
   }

   function activeDesign() {
    return designs.find((item) => item.id === currentDesign) || designs[0];
   }

   // As colunas do misc/data.csv mapeadas para os nomes usados pelos
   // exemplos do repositório (que leem sample-data/org.csv).
   function toChartRow(row) {
    return Object.assign({}, row, {
     id: row.id,
     parentId: row.parentId,
     name: `${row.name || ""} ${row.lastName || ""}`.trim(),
     positionName: row.position || "",
     imageUrl: row.image || "",
     area: row.department_name || "",
     office: row.location_state || row.department_name || "",
     email: row.email || ""
    });
   }

   function chartHeight() {
    const el = document.querySelector(".chart-container");
    const rect = el.getBoundingClientRect();
    return Math.max(400, Math.round(rect.height));
   }

   function attachEmailOverlay() {
    const nodes = document.querySelectorAll(".chart-container g.node");
    nodes.forEach((node) => {
     const inner = node.querySelector(".node-foreign-object-div");
     if (!inner || inner.querySelector(".orgchart-email-overlay")) return;
     const idMatch = (node.textContent || "").match(/#\s*(\d+)/);
     if (!idMatch) return;
     const nodeId = idMatch[1];
     const row = currentData.find((r) => String(r.id) === String(nodeId));
     if (!row) return;
     const overlay = document.createElement("div");
     overlay.className = "orgchart-email-overlay";
     overlay.textContent = row.email ? `✉ ${row.email}` : "✉ sem e-mail";
     overlay.style.position = "absolute";
     overlay.style.right = "6px";
     overlay.style.bottom = "6px";
     overlay.style.padding = "2px 6px";
     overlay.style.borderRadius = "10px";
     overlay.style.background = "rgba(15,23,42,.78)";
     overlay.style.color = "#fff";
     overlay.style.font = "9px 'Inter','Helvetica',sans-serif";
     overlay.style.pointerEvents = "none";
     overlay.style.maxWidth = "200px";
     overlay.style.overflow = "hidden";
     overlay.style.textOverflow = "ellipsis";
     overlay.style.whiteSpace = "nowrap";
     overlay.style.zIndex = "5";
     inner.style.position = "relative";
     inner.appendChild(overlay);
    });
   }

   function renderDesign() {
    const design = activeDesign();
    const container = document.querySelector(".chart-container");
    container.innerHTML = "";
    container.style.backgroundColor = design.background;

    let rows = currentData.map(toChartRow);
    if (design.prepare) rows = design.prepare(rows);

    chart = new d3.OrgChart()
     .container(".chart-container")
     .svgHeight(chartHeight())
     .data(rows)
     .pagingStep((d) => 5)
     .minPagingVisibleNodes((d) => 3)
     .onNodeClick((d) => {
      selectedNodeId = String(d.id);
      setStatus(`Selecionado: ${nodeLabel(d.id)}`);
     });

    design.apply(chart);
    chart.render();
    setTimeout(attachEmailOverlay, 50);
    setTimeout(attachEmailOverlay, 250);
    if (design.after) design.after(chart);
   }

   d3.csv("misc/data.csv").then((dataFlattened) => {
    currentData = dataFlattened;
    buildDesignMenu();
    renderDesign();
    setStatus(`Pronto • ${currentData.length} funcionários carregados`);
   });

   // ------------------------- ações da toolbar -------------------------

   function rootId() {
    const ids = new Set(currentData.map((row) => String(row.id)));
    const root = currentData.find(
     (row) => !String(row.parentId || "").trim() || !ids.has(String(row.parentId))
    );
    return root ? String(root.id) : null;
   }

   function nodeExists(id) {
    return currentData.some((row) => String(row.id) === String(id));
   }

   function pushUndo() {
    undoStack.push(JSON.stringify(currentData));
    if (undoStack.length > 25) undoStack.shift();
   }

   function undoLast() {
    if (!undoStack.length) return setStatus("Nada para desfazer", true);
    const previous = JSON.parse(undoStack.pop());
    if (!Array.isArray(previous)) return setStatus("Histórico corrompido", true);
    currentData = previous;
    selectedNodeId = currentData.some((row) => String(row.id) === String(selectedNodeId))
     ? selectedNodeId
     : null;
    addedIds = [];
    renderDesign();
    chart.fit();
    setStatus("Última alteração desfeita");
   }

   function focusId() {
    const root = rootId();
    const parents = new Set(
     currentData.map((row) => String(row.parentId || "")).filter(Boolean)
    );
    const manager = currentData.find(
     (row) => parents.has(String(row.id)) && String(row.id) !== root
    );
    if (manager) return String(manager.id);
    const other = currentData.find((row) => String(row.id) !== root);
    return other ? String(other.id) : root;
   }

   function getSelectedNodeId() {
    if (selectedNodeId && nodeExists(selectedNodeId)) return selectedNodeId;
    const fallback = focusId();
    if (fallback) {
     selectedNodeId = fallback;
     return fallback;
    }
    return null;
   }

   function centerFocusNode() {
    const id = getSelectedNodeId();
    if (!id) return setStatus("Clique em um nó para selecioná-lo antes de centralizar", true);
    chart.setCentered(id).render();
    const label = nodeLabel(id);
    setStatus(`Centralizado em ${label}`);
   }

   function highlightFocusNode() {
    const id = getSelectedNodeId();
    if (!id) return setStatus("Clique em um nó para selecioná-lo antes de destacar", true);
    chart.clearHighlighting().setHighlighted(id).render();
    const label = nodeLabel(id);
    setStatus(`Nó destacado: ${label}`);
   }

   function highlightPathToRoot() {
    const id = getSelectedNodeId();
    if (!id) return setStatus("Clique em um nó antes de destacar o caminho", true);
    chart.clearHighlighting().setUpToTheRootHighlighted(id).render();
    const label = nodeLabel(id);
    setStatus(`Caminho até a raiz destacado: ${label}`);
   }

   function clearHighlighting() {
    if (!chart) return setStatus("Carregue dados antes de limpar destaques", true);
    chart.clearHighlighting().render();
    setStatus("Destaques removidos");
   }

   function nodeLabel(id) {
    const row = currentData.find((r) => String(r.id) === String(id));
    if (!row) return `#${id}`;
    const fullName = `${row.name || ""} ${row.lastName || ""}`.trim() || `(sem nome)`;
    return `#${id} • ${fullName}${row.position ? " — " + row.position : ""}`;
   }

   function chartFit() {
    if (!chart) return setStatus("Carregue dados antes de ajustar à tela", true);
    chart.fit();
    setStatus("Visão ajustada à tela");
   }

   function toggleFullscreen() {
    const el = document.querySelector(".chart-wrapper");
    if (!el) return;
    if (!document.fullscreenElement) {
     (el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen());
     setStatus("Modo tela cheia ativado");
    } else {
     (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen && document.webkitExitFullscreen());
     setStatus("Modo tela cheia desativado");
    }
   }

   function cycleLayout() {
    if (!chart) return setStatus("Carregue dados antes de trocar layout", true);
    const layouts = ["right", "bottom", "left", "top"];
    chart.layout(layouts[index++ % layouts.length]).render().fit();
    setStatus(`Layout: ${layouts[(index - 1 + layouts.length) % layouts.length]}`);
   }

   function safeCall(method, label) {
    if (!chart) return setStatus(`Carregue dados antes de ${label.toLowerCase()}`, true);
    if (typeof chart[method] === "function") {
     chart[method]();
     setStatus(label);
    } else {
     setStatus(`${label} indisponível nesta versão`, true);
    }
   }

   function safeExportImg(full) {
    if (!chart) return setStatus("Carregue dados antes de exportar", true);
    chart.exportImg(full ? { full: true } : undefined);
    setStatus(full ? "PNG completo exportado" : "PNG exportado");
   }

   function safeExportSvg() {
    if (!chart) return setStatus("Carregue dados antes de exportar SVG", true);
    chart.exportSvg();
    setStatus("SVG exportado");
   }

   function addSampleNode() {
    const parentId = getSelectedNodeId() || rootId();
    if (!parentId) return setStatus("Carregue dados antes de adicionar um nó", true);
    const id = "novo-" + Date.now();
    const position = prompt("Cargo do novo colaborador?", "Analista") || "Colaborador";
    const name = prompt("Nome do novo colaborador?", "Novo Colaborador") || "Novo";
    pushUndo();
    currentData.push({
     id,
     parentId,
     name,
     lastName: "",
     position,
     email: "",
     department_name: nodeExists(parentId) ? (currentData.find((r) => String(r.id) === String(parentId))?.department_name || "Equipe") : "Equipe",
     image: ""
    });
    addedIds.push(id);
    selectedNodeId = id;
    renderDesign();
    chart.fit();
    setStatus(`Nó adicionado: ${nodeLabel(id)}`);
   }

   function removeSampleNode() {
    if (!currentData.length) return setStatus("Não há nós para remover", true);
    const targetId = getSelectedNodeId();
    if (!targetId || !nodeExists(targetId)) return setStatus("Clique em um nó antes de remover", true);
    const idsToRemove = new Set([String(targetId)]);
    let changed = true;
    while (changed) {
     changed = false;
     for (const row of currentData) {
      if (idsToRemove.has(String(row.parentId)) && !idsToRemove.has(String(row.id))) {
       idsToRemove.add(String(row.id));
       changed = true;
      }
     }
    }
    const label = nodeLabel(targetId);
    if (!confirm(`Remover ${label} e ${idsToRemove.size - 1} subordinado(s)?`)) {
     return;
    }
    pushUndo();
    currentData = currentData.filter((row) => !idsToRemove.has(String(row.id)));
    addedIds = addedIds.filter((aid) => !idsToRemove.has(String(aid)));
    selectedNodeId = null;
    renderDesign();
    chart.fit();
    setStatus(`Removido: ${label} (${idsToRemove.size} nó(s))`);
   }

   function downloadPdf() {
    chart.exportImg({
     save: false,
     onLoad: (base64) => {
      const image = new Image();
      image.onload = () => {
       const landscape = image.width >= image.height;
       const pdf = new jspdf.jsPDF({
        orientation: landscape ? "landscape" : "portrait",
        unit: "mm",
        format: "a4"
       });
       const pageW = pdf.internal.pageSize.getWidth();
       const pageH = pdf.internal.pageSize.getHeight();
       const margin = 8;
       const scale = Math.min(
        (pageW - margin * 2) / image.width,
        (pageH - margin * 2) / image.height
       );
       const w = image.width * scale;
       const h = image.height * scale;
       pdf.addImage(base64, "PNG", (pageW - w) / 2, (pageH - h) / 2, w, h);
       pdf.save("organograma.pdf");
      };
      image.onerror = () => setStatus("Não foi possível gerar o PDF", true);
      image.src = base64;
     }
    });
   }

   // ------------------------- carregamento de CSV -------------------------

   function validateRows(rows) {
    const ids = new Set();
    const duplicated = [];
    rows.forEach((row) => {
     const id = String(row.id);
     if (ids.has(id)) duplicated.push(id);
     ids.add(id);
    });
    if (duplicated.length) {
     throw new Error(
      `IDs duplicados no CSV: ${[...new Set(duplicated)].slice(0, 3).join(", ")}`
     );
    }
    const roots = rows.filter((row) => !String(row.parentId || "").trim());
    if (!roots.length) {
     throw new Error("O CSV não tem nó raiz (uma linha com parentId vazio)");
    }
    if (roots.length > 1) {
     throw new Error(
      `O CSV tem ${roots.length} raízes; use apenas uma linha com parentId vazio`
     );
    }
    const orphan = rows.find((row) => {
     const parent = String(row.parentId || "").trim();
     return parent && !ids.has(parent);
    });
    if (orphan) {
     throw new Error(
      `A linha ${orphan.id} aponta para um parentId inexistente (${orphan.parentId})`
     );
    }
   }

   function parseInput(text, name) {
    const ext = (name || "").toLowerCase();
    if (ext.endsWith(".json")) {
     const json = JSON.parse(text);
     const rows = Array.isArray(json) ? json : Array.isArray(json.nodes) ? json.nodes : null;
     if (!rows) throw new Error("JSON precisa ser uma lista de nós ou ter a chave 'nodes'");
     return rows;
    }
    return d3.csvParse(text);
   }

   function loadDataFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
     try {
      const rows = parseInput(event.target.result, file.name);
      const validRows = rows.filter((row) => row.id && (row.name || row.lastName));
      if (!validRows.length) {
       throw new Error("O arquivo precisa conter pelo menos id e nome");
      }
      validateRows(validRows);
      currentData = validRows;
      addedIds = [];
      selectedNodeId = null;
      undoStack.length = 0;
      renderDesign();
      chart.fit();
      setStatus(`${validRows.length} registros carregados de ${file.name}`);
     } catch (error) {
      setStatus(error.message || "Não foi possível ler o arquivo", true);
     }
    };
    reader.onerror = () => setStatus("Não foi possível ler o arquivo", true);
    reader.readAsText(file, "UTF-8");
   }

   const CSV_COLUMNS = ["id", "parentId", "name", "lastName", "position", "email", "department_name", "location_state", "image"];

   function exportRows() {
    return CSV_COLUMNS.map((column) => `"${column.replace(/"/g, '""')}"`).join(",")
     + "\n"
     + currentData.map((row) =>
      CSV_COLUMNS.map((column) => {
       const value = row[column] === undefined || row[column] === null ? "" : String(row[column]);
       return `"${value.replace(/"/g, '""')}"`;
      }).join(",")
     ).join("\n");
   }

   function downloadCsv() {
    if (!currentData.length) return setStatus("Não há dados para exportar", true);
    const blob = new Blob([exportRows()], { type: "text/csv;charset=utf-8" });
    triggerDownload(blob, "organograma.csv");
    setStatus(`Exportado organograma.csv (${currentData.length} registros)`);
   }

   function downloadJson() {
    if (!currentData.length) return setStatus("Não há dados para exportar", true);
    const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: "application/json" });
    triggerDownload(blob, "organograma.json");
    setStatus(`Exportado organograma.json (${currentData.length} registros)`);
   }

   function triggerDownload(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
   }

   function setStatus(message, isError) {
    const status = document.getElementById("status-msg");
    if (status) {
     status.textContent = message;
     status.previousElementSibling.style.background = isError
      ? "#ef4444"
      : "#10b981";
    }
   }

   document.getElementById("csv-input").addEventListener("change", (event) => {
    loadDataFile(event.target.files[0]);
    event.target.value = "";
   });

   document.getElementById("theme-select").addEventListener("change", (event) => {
    currentDesign = event.target.value;
    index = 0;
    renderDesign();
    setStatus(`${event.target.selectedOptions[0].textContent} aplicado`);
   });

   let resizeTimer;
   window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
     if (chart) chart.svgHeight(chartHeight()).render().fit();
    }, 200);
   });

   const dropOverlay = document.getElementById("drop-overlay");
   let dragDepth = 0;
   document.addEventListener("dragenter", (event) => {
    event.preventDefault();
    dragDepth += 1;
    dropOverlay.classList.add("active");
   });
   document.addEventListener("dragover", (event) => event.preventDefault());
   document.addEventListener("dragleave", (event) => {
    event.preventDefault();
    dragDepth -= 1;
    if (dragDepth <= 0) {
     dragDepth = 0;
     dropOverlay.classList.remove("active");
    }
   });
   document.addEventListener("drop", (event) => {
    event.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove("active");
    loadDataFile(event.dataTransfer.files[0]);
   });
