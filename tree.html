   const LADO_FOTO = 256;

   // Recorta no quadrado central e reduz. Uma foto de celular tem ~4 MB; sem
   // isto, 330 colaboradores encheriam o disco e deixariam a página lenta.
   function prepararFoto(file) {
    return new Promise((resolve, reject) => {
     const reader = new FileReader();
     reader.onerror = () => reject(new Error("não foi possível ler o arquivo"));
     reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("arquivo não é uma imagem válida"));
      img.onload = () => {
       const canvas = document.createElement("canvas");
       canvas.width = LADO_FOTO;
       canvas.height = LADO_FOTO;
       const corte = Math.min(img.width, img.height);
       canvas
        .getContext("2d")
        .drawImage(img, (img.width - corte) / 2, (img.height - corte) / 2, corte, corte, 0, 0, LADO_FOTO, LADO_FOTO);
       canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("falha ao converter"))), "image/jpeg", 0.82);
      };
      img.src = reader.result;
     };
     reader.readAsDataURL(file);
    });
   }

   async function enviarFoto(id, file) {
    const blob = await prepararFoto(file);
    const resposta = await fetch(`api/fotos/${encodeURIComponent(id)}`, {
     method: "PUT",
     headers: { "Content-Type": "image/jpeg" },
     body: blob
    });
    if (!resposta.ok) throw new Error((await resposta.json()).erro || "falha no envio");
    const corpo = await resposta.json();
    // O sufixo força o navegador a buscar de novo depois de trocar a foto.
    return `${corpo.caminho}?v=${Date.now()}`;
   }

   const semAcento = (t) =>
    (t || "")
     .normalize("NFD")
     .replace(/[̀-ͯ]/g, "")
     .toLowerCase()
     .replace(/[^a-z0-9]+/g, " ")
     .trim();

   // Casa "maria.silva.jpg" com a pessoa: primeiro pelo id, depois pelo login/
   // e-mail e por fim pelo nome completo, para o lote não exigir renomear tudo.
   function acharPessoaPorArquivo(nomeArquivo) {
    const base = nomeArquivo.replace(/\.[^.]+$/, "");
    const chave = semAcento(base);
    let achou = currentData.find((r) => String(r.id) === base.trim());
    if (achou) return achou;
    achou = currentData.find((r) => r.email && semAcento(String(r.email).split("@")[0]) === chave);
    if (achou) return achou;
    return currentData.find(
     (r) => semAcento(`${r.name || ""} ${r.lastName || ""}`) === chave && chave
    );
   }

   async function enviarFotosEmLote(arquivos) {
    const total = arquivos.length;
    const semDono = [];
    let enviadas = 0;
    for (let i = 0; i < total; i++) {
     const arquivo = arquivos[i];
     const pessoa = acharPessoaPorArquivo(arquivo.name);
     if (!pessoa) {
      semDono.push(arquivo.name);
      continue;
     }
     setStatus(`Enviando fotos… ${i + 1} de ${total}`);
     try {
      pessoa.image = await enviarFoto(pessoa.id, arquivo);
      enviadas++;
     } catch (erro) {
      semDono.push(`${arquivo.name} (${erro.message})`);
     }
    }
    if (enviadas) {
     await salvarNoServidor();
     renderDesign();
     afterRender();
    }
    const sobra = semDono.length
     ? ` • ${semDono.length} sem correspondência: ${semDono.slice(0, 3).join(", ")}${semDono.length > 3 ? "…" : ""}`
     : "";
    setStatus(`${enviadas} de ${total} fotos aplicadas${sobra}`, !enviadas);
   }

   function salvarEditor() {
    if (!editandoId) return;
    const row = currentData.find((r) => String(r.id) === String(editandoId));
    if (!row) return setStatus("Colaborador não encontrado", true);

    const valores = {};
    CAMPOS_EDITAVEIS.forEach((campo) => {
     valores[campo] = document.getElementById("ed-" + campo).value.trim();
    });
    const erro = document.getElementById("ed-erro");
    // Caixa de unidade ("GABINETE DO PREFEITO") não tem nome de pessoa, e uma
    // pessoa pode estar sem cargo definido: basta um dos dois para identificar.
    if (!valores.name && !valores.position) {
     erro.textContent = "Preencha o nome ou o cargo/unidade";
     return document.getElementById("ed-name").focus();
    }

    const select = document.getElementById("ed-parentId");
    const novoChefe = select.disabled ? row.parentId : select.value;
    const mudouChefe = String(novoChefe || "") !== String(row.parentId || "");
    const novoTipo = document.getElementById("ed-type").value;

    // Hierarquia validada ANTES de gravar: um SETOR nao entra sob um
    // COLABORADOR, e uma SECRETARIA nao entra sob um SETOR. A regra e a
    // mesma de validarHierarquia(), aplicada no momento da edicao para o
    // arquivo nunca chegar a ficar invalido.
    const chefeRow = currentData.find((r) => String(r.id) === String(novoChefe));
    if (chefeRow) {
     const rankFilho = (TIPOS[novoTipo] || TIPO_DESCONHECIDO).rank;
     const tipoChefe = tipoDe(chefeRow);
     if (ehColaborador(chefeRow)) {
      erro.textContent = `${rotuloLegivel(chefeRow)} é COLABORADOR e não pode ter subordinados`;
      return;
     }
     if (rankFilho < tipoChefe.rank) {
      erro.textContent =
       `${(TIPOS[novoTipo] || TIPO_DESCONHECIDO).rotulo} não pode responder a ${tipoChefe.rotulo}`;
      return;
     }
    }

    // Um no criado por Add Node ja empilhou o undo; empilhar de novo aqui
    // faria um unico Ctrl+Z desfazer so metade da operacao.
    const eraNovo = novoNoPendente && String(novoNoPendente) === String(editandoId);
    if (!eraNovo) pushUndo();
    novoNoPendente = null;

    Object.assign(row, valores);
    row.type = novoTipo;
    if (mudouChefe) row.parentId = novoChefe;
    // Sincroniza image/imageUrl para o render dos cards.
    if (valores.image) {
     row.image = valores.image;
     row.imageUrl = valores.image;
    }

    fecharEditor();
    selectNode(row.id);
    salvarNoServidor();
    if (mudouChefe || eraNovo) focarCaminho(row.id);
    renderDesign();
    fitLegivel(row.id);
    afterRender();
    salvarVisual();
    setStatus(
     eraNovo
      ? `Criado: ${tipoDe(row).rotulo} ${rotuloLegivel(row)} sob ${nodeLabel(row.parentId)}. Total: ${currentData.length}.`
      : mudouChefe
      ? `Salvo: ${nodeLabel(row.id)} agora responde a ${nodeLabel(novoChefe)}`
      : `Salvo: ${nodeLabel(row.id)}`
    );
   }

   // Continua a numeração do CSV em vez de um id sintético: quem adiciona uma
   // pessoa aqui espera encontrá-la no CSV exportado, com um id igual aos outros.
   function proximoId() {
    const numericos = currentData
     .map((row) => Number(row.id))
     .filter((n) => Number.isFinite(n));
    return String(numericos.length ? Math.max(...numericos) + 1 : 1);
   }

   function descendantsOf(targetId) {
    const ids = new Set([String(targetId)]);
    let changed = true;
    while (changed) {
     changed = false;
     for (const row of currentData) {
      if (ids.has(String(row.parentId)) && !ids.has(String(row.id))) {
       ids.add(String(row.id));
       changed = true;
      }
     }
    }
    return ids;
   }

   function removeSampleNode() {
    if (!currentData.length) return setStatus("Não há nós para remover", true);
    const targetId = requireSelection("remover");
    if (!targetId) return;

    // Apagar a raiz esvazia o organograma inteiro e deixa a tela em branco.
    if (String(targetId) === String(rootId())) {
     return setStatus(
      `${nodeLabel(targetId)} é a raiz do organograma e não pode ser removida`,
      true
     );
    }

    const idsToRemove = descendantsOf(targetId);
    const label = nodeLabel(targetId);
    const subordinados = idsToRemove.size - 1;
    const aviso = subordinados
     ? `Remover ${label}?\n\nIsto também remove ${subordinados} subordinado(s) abaixo dele.`
     : `Remover ${label}?`;
    if (!confirm(aviso)) return setStatus("Remoção cancelada");

    pushUndo();
    currentData = currentData.filter((row) => !idsToRemove.has(String(row.id)));
    selectNode(null);
    salvarNoServidor();
    renderDesign();
    fitLegivel();
    afterRender();
    setStatus(`Removido: ${label} (${idsToRemove.size} pessoa(s))`);
   }

   function downloadPdf() {
    chart.exportImg({
     save: false,
     onLoad: (base64) => {
      const image = new Image();
      image.onload = () => {
       const landscape = image.width >= image.height;
       const pdf = new jspdf.jsPDF({
        orientation: landscape ? "landscape" : "portrait",
        unit: "mm",
        format: "a4"
       });
       const pageW = pdf.internal.pageSize.getWidth();
       const pageH = pdf.internal.pageSize.getHeight();
       const margin = 8;
       const scale = Math.min(
        (pageW - margin * 2) / image.width,
        (pageH - margin * 2) / image.height
       );
       const w = image.width * scale;
       const h = image.height * scale;
       pdf.addImage(base64, "PNG", (pageW - w) / 2, (pageH - h) / 2, w, h);
       pdf.save("organograma.pdf");
      };
      image.onerror = () => setStatus("Não foi possível gerar o PDF", true);
      image.src = base64;
     }
    });
   }

   // ------------------------- carregamento de CSV -------------------------

   function validateRows(rows) {
    const ids = new Set();
    const duplicated = [];
    rows.forEach((row) => {
     const id = String(row.id);
     if (ids.has(id)) duplicated.push(id);
     ids.add(id);
    });
    if (duplicated.length) {
     throw new Error(
      `IDs duplicados no CSV: ${[...new Set(duplicated)].slice(0, 3).join(", ")}`
     );
    }
    const roots = rows.filter((row) => !String(row.parentId || "").trim());
    if (!roots.length) {
     throw new Error("O CSV não tem nó raiz (uma linha com parentId vazio)");
    }
    if (roots.length > 1) {
     throw new Error(
      `O CSV tem ${roots.length} raízes; use apenas uma linha com parentId vazio`
     );
    }
    const orphan = rows.find((row) => {
     const parent = String(row.parentId || "").trim();
     return parent && !ids.has(parent);
    });
    if (orphan) {
     throw new Error(
      `A linha ${orphan.id} aponta para um parentId inexistente (${orphan.parentId})`
     );
    }
    // A tabela TIPOS e a unica fonte da verdade. Manter uma segunda lista
    // escrita a mao aqui e o que fazia o proprio arquivo do organograma
    // (PREFEITURA, CHEFE, CONSELHO, GUARDA...) ser recusado no upload.
    // UNIDADE/ORGAO passam como apelidos do generico (TIPO_DESCONHECIDO).
    const APELIDOS_GENERICOS = new Set(["UNIDADE", "ORGAO"]);
    for (const row of rows) {
     const tipo = normalizar(row.type);
     if (tipo && !TIPOS[tipo] && !APELIDOS_GENERICOS.has(tipo)) {
      throw new Error(`Tipo inválido na linha ${row.id}: "${row.type}"`);
     }
    }
   }

   function parseInput(text, name) {
    // O Bloco de Notas e o Excel gravam um BOM no início do arquivo. Sem tirar,
    // a primeira coluna vira o texto FEFF+id e nenhuma linha tem id.
    const limpo = text.charCodeAt(0) === 0xfeff ? text.slice(1) : text;
    const ext = (name || "").toLowerCase();
    if (ext.endsWith(".json")) {
     const json = JSON.parse(limpo);
     const rows = Array.isArray(json) ? json : Array.isArray(json.nodes) ? json.nodes : null;
     if (!rows) throw new Error("JSON precisa ser uma lista de nós ou ter a chave 'nodes'");
     return rows;
    }
    // Excel em português salva com ";". Decide pelo separador que mais aparece
    // no cabeçalho, senão o arquivo inteiro vira uma coluna só.
    const cabecalho = limpo.slice(0, limpo.indexOf("\n") + 1 || limpo.length);
    const conta = (c) => cabecalho.split(c).length - 1;
    if (conta(";") > conta(",")) return d3.dsvFormat(";").parse(limpo);
    if (conta("\t") > conta(",")) return d3.dsvFormat("\t").parse(limpo);
    return d3.csvParse(limpo);
   }

   // O CSV e as fotos entram no mesmo gesto. Aqui a lista é separada: os dados
   // são carregados primeiro (as fotos precisam saber a quem pertencem) e só
   // depois as imagens são casadas com as pessoas.
   async function carregarArquivos(lista) {
    const arquivos = [...(lista || [])];
    if (!arquivos.length) return;
    const ehImagem = (f) => /^image\//.test(f.type) || /\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name);
    const imagens = arquivos.filter(ehImagem);
    const dados = arquivos.filter((f) => !ehImagem(f));

    if (dados.length > 1) {
     return setStatus(
      `Selecione um único CSV/JSON (encontrei ${dados.length}: ${dados.map((f) => f.name).join(", ")})`,
      true
     );
    }
    if (dados.length) {
     const carregou = await loadDataFile(dados[0]);
     if (!carregou) return;
    } else if (!currentData.length) {
     return setStatus("Envie o CSV junto com as fotos", true);
    }
    if (imagens.length) {
     await enviarFotosEmLote(imagens);
     return;
    }
    await salvarNoServidor();
   }

   function loadDataFile(file) {
    return new Promise((resolve) => {
     const reader = new FileReader();
     reader.onload = (event) => {
      try {
       const rows = parseInput(event.target.result, file.name);
       if (!Array.isArray(rows) || rows.length === 0) {
        throw new Error("O arquivo não contém dados válidos");
       }
       // Um organograma institucional é feito de unidades (secretaria,
       // gabinete, coordenadoria) além de pessoas, e unidade não tem nome nem
       // sobrenome — só o rótulo em `position`. Exigir nome de pessoa
       // descartava essas linhas, inclusive a raiz, e o arquivo inteiro era
       // recusado por "não tem nó raiz".
       const validRows = rows.map(normalizarLinha).filter((row) => {
        const id = String(valorCampo(row, "id", "ID") || "").trim();
        const rotulo =
         String(valorCampo(row, "name", "nome", "fullName", "nomeCompleto", "employeeName") || "").trim() ||
         String(valorCampo(row, "lastName", "sobrenome", "surname", "ultimoNome") || "").trim() ||
         String(valorCampo(row, "position", "cargo", "titulo", "title") || "").trim();
        return id && rotulo;
       });
       if (!validRows.length) {
        throw new Error("O arquivo precisa ter, em cada linha, um id e um nome ou cargo");
       }
       validateRows(validRows);
       validarHierarquia(validRows);
       currentData = validRows;
       selectNode(null);
       undoStack.length = 0;
       expandidos = new Set();
       renderDesign();
       fitLegivel();
       afterRender();
       setStatus(`${validRows.length} registros carregados de ${file.name}`);
       resolve(true);
      } catch (error) {
       setStatus(error.message || "Não foi possível ler o arquivo", true);
       resolve(false);
      }
     };
     reader.onerror = () => {
      setStatus("Não foi possível ler o arquivo", true);
      resolve(false);
     };
     reader.readAsText(file, "UTF-8");
    });
   }

   const CSV_COLUMNS = ["id", "parentId", "name", "lastName", "position", "type", "email", "department_name", "location_state", "image"];

   function rowsParaExportar(parcial) {
    if (!parcial) return currentData.slice();
    const baseId = selectedNodeId && nodeExists(selectedNodeId) ? selectedNodeId : escopoId;
    if (!baseId) return currentData.slice();
    const ids = descendantsOf(baseId);
    const rows = currentData
     .filter((row) => ids.has(String(row.id)))
     .map((row) => Object.assign({}, row));
    rows.forEach((row) => {
     if (String(row.id) === String(baseId)) row.parentId = "";
    });
    return rows;
   }

   function nomeExportacao(ext, parcial, rows) {
    if (!parcial) return `organograma.${ext}`;
    const raiz = rows.find((row) => !String(row.parentId || "").trim()) || rows[0];
    const slug = semAcento(rotuloLegivel(raiz || {})).replace(/\s+/g, "-").slice(0, 48) || "parte";
    return `organograma-${slug}.${ext}`;
   }

   function exportRows(rows) {
    const lista = Array.isArray(rows) ? rows : currentData;
    return CSV_COLUMNS.map((column) => `"${column.replace(/"/g, '""')}"`).join(",")
     + "\n"
     + lista.map((row) =>
      CSV_COLUMNS.map((column) => {
       const value = row[column] === undefined || row[column] === null ? "" : String(row[column]);
       return `"${value.replace(/"/g, '""')}"`;
      }).join(",")
     ).join("\n");
   }

   function downloadCsv(parcial) {
    if (!currentData.length) return setStatus("Não há dados para exportar", true);
    const rows = rowsParaExportar(parcial);
    const nome = nomeExportacao("csv", parcial, rows);
    const blob = new Blob([exportRows(rows)], { type: "text/csv;charset=utf-8" });
    triggerDownload(blob, nome);
    setStatus(`Exportado ${nome} (${rows.length} registros)`);
   }

   function downloadJson(parcial) {
    if (!currentData.length) return setStatus("Não há dados para exportar", true);
    const rows = rowsParaExportar(parcial);
    const nome = nomeExportacao("json", parcial, rows);
    const blob = new Blob([JSON.stringify(rows, null, 2)], { type: "application/json" });
    triggerDownload(blob, nome);
    setStatus(`Exportado ${nome} (${rows.length} registros)`);
   }

   function triggerDownload(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
   }

   function setStatus(message, isError) {
    const status = document.getElementById("status-msg");
    if (status) {
     status.textContent = message;
     status.previousElementSibling.style.background = isError
      ? "#ef4444"
      : "#10b981";
    }
   }

   const editorEl = document.getElementById("editor");
   const fotoInput = document.getElementById("ed-arquivo");
   const imagemInput = document.getElementById("ed-image");
   const coresEl = document.getElementById("cores");
   const csvInput = document.getElementById("csv-input");
   const escopoSelect = document.getElementById("escopo-select");
   const themeSelect = document.getElementById("theme-select");
   const chartWrapper = document.querySelector(".chart-wrapper");

   if (fotoInput) {
    fotoInput.addEventListener("change", async (event) => {
     const file = event.target.files[0];
     event.target.value = "";
     if (!file || !editandoId) return;
     setStatus("Enviando foto…");
     try {
      const caminho = await enviarFoto(editandoId, file);
      const inputFoto = document.getElementById("ed-image");
      if (inputFoto) inputFoto.value = caminho;
      atualizarPreview(caminho);
      setStatus("Foto enviada — clique em Salvar para aplicar");
     } catch (erro) {
      setStatus(`Não foi possível enviar a foto: ${erro.message}`, true);
     }
    });
   }

   if (imagemInput) {
    imagemInput.addEventListener("input", (event) => {
     atualizarPreview(event.target.value.trim());
    });
   }

   // Sem isso o aviso de campo obrigatório fica na tela depois de corrigido.
   if (editorEl) {
    editorEl.querySelectorAll("input, select").forEach((campo) => {
     campo.addEventListener("input", () => {
      const erro = document.getElementById("ed-erro");
      if (erro) erro.textContent = "";
     });
    });
   }

   if (editorEl) {
    editorEl.addEventListener("click", (event) => {
     if (event.target.id === "editor") fecharEditor();
    });
   }

   if (coresEl) {
    coresEl.addEventListener("click", (event) => {
     if (event.target.id === "cores") fecharCores();
    });
   }

   document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && coresEl && !coresEl.hidden) fecharCores();
   });

   document.addEventListener("keydown", (event) => {
    if (!editorEl || editorEl.hidden) return;
    if (event.key === "Escape") fecharEditor();
    if (event.key === "Enter" && event.target.tagName === "INPUT") salvarEditor();
   });

   // Atalho extra: depois de cada render os cards tambem recebem listener
   // proprio, mas a delegacao cobre temas que recriam o SVG entre frames.
   if (chartWrapper) {
    chartWrapper.addEventListener("dblclick", (event) => {
     const node = event.target.closest("g.node");
     if (!node) return;
     const id = nodeIdFromElement(node);
     if (id === null) return;
     selectNode(id);
     abrirEditor(id);
    });
   }

   if (csvInput) {
    csvInput.addEventListener("change", async (event) => {
     const arquivos = [...event.target.files];
     event.target.value = "";
     await carregarArquivos(arquivos);
    });
   }

   if (escopoSelect) {
    escopoSelect.addEventListener("change", (event) => {
     aplicarEscopo(event.target.value);
    });
   }

   if (themeSelect) {
    themeSelect.addEventListener("change", (event) => {
     currentDesign = event.target.value;
     renderDesign();
     afterRender();
     salvarVisual();
     setStatus(`${event.target.selectedOptions[0].textContent} aplicado`);
    });
   }

   let resizeTimer;
   function reajustarAoContainer() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
     if (!chart) return;
     const alvo = chartHeight();
     // So redesenha se mudou de verdade: render() altera o DOM observado e
     // sem esta guarda o ResizeObserver se realimenta em loop.
     if (Math.abs(alvo - alturaDesenhada) <= 4) return;
     alturaDesenhada = alvo;
     chart.svgHeight(alvo).render();
     fitLegivel();
    }, 150);
   }

   iniciarResizeSidebar();
   window.addEventListener("resize", reajustarAoContainer);

   // O window.resize sozinho nao cobria o caso real: a webfont Inter termina de
   // carregar depois do primeiro render, a toolbar muda de altura, o container
   // encolhe e o SVG continuava com a altura antiga — sobrando desenho cortado
   // por baixo. O observer pega isso, e tambem o recolher da barra lateral e a
   // tela cheia, sem depender de a janela ser redimensionada.
   const caixaGrafico = document.querySelector(".chart-container");
   if (caixaGrafico && window.ResizeObserver) {
    new ResizeObserver(reajustarAoContainer).observe(caixaGrafico);
   }
   if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(reajustarAoContainer);
   }

   const dropOverlay = document.getElementById("drop-overlay");
   let dragDepth = 0;
   document.addEventListener("dragenter", (event) => {
    event.preventDefault();
    dragDepth += 1;
    dropOverlay.classList.add("active");
   });
   document.addEventListener("dragover", (event) => event.preventDefault());
   document.addEventListener("dragleave", (event) => {
    event.preventDefault();
    dragDepth -= 1;
    if (dragDepth <= 0) {
     dragDepth = 0;
     dropOverlay.classList.remove("active");
    }
   });
   document.addEventListener("drop", (event) => {
    event.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove("active");
    carregarArquivos(event.dataTransfer.files);
   });
  </script>
