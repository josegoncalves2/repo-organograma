# Docker Compose - Organograma Municipal via WSL host network na porta 8085

services:
  orgchart:
    container_name: orgchart-demo
    build:
      context: .
      dockerfile: Dockerfile
    image: bumbeishvili-orgchart:latest
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    environment:
      PORT: 8085
    volumes:
      - orgchart-dados:/dados
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/api/saude"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  orgchart-dados:
