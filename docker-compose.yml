# Docker Compose - Organograma Municipal via localhost na porta 8085

services:
  orgchart:
    container_name: orgchart-demo
    build:
      context: .
      dockerfile: Dockerfile
    image: bumbeishvili-orgchart:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8085"
      DOCKER: "1"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - orgchart-dados:/dados
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/api/saude"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  orgchart-dados:
