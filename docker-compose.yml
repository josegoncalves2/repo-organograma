# Docker Compose - bumbeishvili/org-chart demo
services:
  orgchart:
    container_name: orgchart-demo
    build:
      context: .
      dockerfile: Dockerfile
    image: bumbeishvili-orgchart:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s