server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fontes: nomes estáveis e versionados -> cache longo
    location ~* \.(woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Demais assets: nomes SEM hash, então revalidar sempre (ETag -> 304).
    # Cache longo aqui faria o browser ignorar rebuilds da imagem.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|csv)$ {
        add_header Cache-Control "no-cache";
    }

    # Página principal -> index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
